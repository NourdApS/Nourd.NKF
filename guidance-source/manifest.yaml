# Version-neutral guidance source.
#
# No file under guidance-source/ may contain a literal NKF version. Every
# version reference is the {{nkf_version}} placeholder, resolved once per
# emission. That is the whole point: an author edits meaning, the generator
# owns every version, and a stale version label becomes impossible rather
# than merely unlikely.
#
# No emitted tree is ever an input. Each target is written from the source and
# the target's own version, never by reading a previous version's output.
#
# stamp: adopted -> the version this repository has adopted (bundle.nkf_version)
# stamp: release -> the version being emitted (--version)
#
# Only targets the generator owns appear here. The adopter installs the skills
# and the authoring and onboarding protocols from the published archive, so
# those producer copies are adopter outputs and are written by the adoption
# process, never by this generator. The adoption and release protocol roots are
# not installed by anything, which is precisely why they rotted, so the
# generator owns them at the adopted version.
contract: nkf.guidance-source
version: 1
members:
  - source: skills/nkf-authoring/SKILL.md
    targets:
      - { path: "distribution/nkf/{version}/.claude/skills/nkf-authoring/SKILL.md", stamp: release }
      - { path: "distribution/nkf/{version}/.agents/skills/nkf-authoring/SKILL.md", stamp: release }
  - source: skills/nkf-onboarding/SKILL.md
    targets:
      - { path: "distribution/nkf/{version}/.claude/skills/nkf-onboarding/SKILL.md", stamp: release }
      - { path: "distribution/nkf/{version}/.agents/skills/nkf-onboarding/SKILL.md", stamp: release }
  - source: integrations/adoption/nkf-adoption-protocol.md
    targets:
      - { path: "integrations/adoption/nkf-adoption-protocol.md", stamp: adopted }
      - { path: "distribution/nkf/{version}/integrations/adoption/nkf-adoption-protocol.md", stamp: release }
  - source: integrations/release/nkf-release-protocol.md
    targets:
      - { path: "integrations/release/nkf-release-protocol.md", stamp: adopted }
      - { path: "distribution/nkf/{version}/integrations/release/nkf-release-protocol.md", stamp: release }
  - source: integrations/ai/nkf-authoring-protocol.md
    targets:
      - { path: "distribution/nkf/{version}/integrations/ai/nkf-authoring-protocol.md", stamp: release }
  - source: integrations/onboarding/nkf-onboarding-protocol.md
    targets:
      - { path: "distribution/nkf/{version}/integrations/onboarding/nkf-onboarding-protocol.md", stamp: release }
  - source: host-adapters/AGENTS.adapter.md
    targets:
      - { path: "distribution/nkf/{version}/host-adapters/AGENTS.adapter.md", stamp: release }
  - source: host-adapters/CLAUDE.adapter.md
    targets:
      - { path: "distribution/nkf/{version}/host-adapters/CLAUDE.adapter.md", stamp: release }
  - source: host-adapters/GEMINI.adapter.md
    targets:
      - { path: "distribution/nkf/{version}/host-adapters/GEMINI.adapter.md", stamp: release }
  - source: host-adapters/copilot-instructions.adapter.md
    targets:
      - { path: "distribution/nkf/{version}/host-adapters/copilot-instructions.adapter.md", stamp: release }
