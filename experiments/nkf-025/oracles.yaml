reviewer: codex-technical-reviewer
scenarios:
  product-decision-change:
    whole_root_review:
      - decision-access
      - design-access
      - realization-current
    basis: The accepted access Decision is changed; its extending Design and realizing Realization require review.
  technology-specification-change:
    whole_root_review:
      - realization-current
      - specification
    basis: The Specification and its Realization require review; the Technology map is a contextual reference only.
