    whole_root_review:
      - design-nkf-025-freshness-and-deterministic-knowledge-graph
      - document:tasks/active/NKF-025-validate-freshness-and-knowledge-graph-direction.md
    basis: The active Task owns and reports the Draft Design work, so a Design revision requires the Task progress and evidence boundary to be reviewed.

