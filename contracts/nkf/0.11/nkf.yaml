    algorithm: sha-256
    value: 5fe51c09bb065835699a824b98cf05adc8a0916145aec0a4332ecd3652652838
  accepted_baseline:
    markdown_path: knowledge/specifications/nkf-0.1.md
    markdown_digest:
      algorithm: sha-256
      value: df0235ee01ba951fe5beea50990213e4d1063b2e7014f460657de6904d5fabc0
    executable_path: contracts/nkf/0.1/nkf.yaml
    executable_digest:
      algorithm: sha-256
      value: 3cd00712ecf5fc4d4ae6faa275fd04373d28802eb1de80f6c47f6f039026f0aa
  governing_decisions:
    - ADR-0001
    - ADR-0002
    - ADR-0003
    - ADR-0005
    - ADR-0006
    - ADR-0007
    - ADR-0008
    - ADR-0009
    - ADR-0010
    - ADR-0011
    - ADR-0012
    - ADR-0013
    - ADR-0014
    - ADR-0015
    - ADR-0016
    - ADR-0017
    - ADR-0018
    - ADR-0019
    - ADR-0020
    - ADR-0021
    - ADR-0022
    - ADR-0024
    - ADR-0025
    - ADR-0026
    - ADR-0027
    - ADR-0028
    - ADR-0029
    - ADR-0032
    - ADR-0034
    - ADR-0035
    - ADR-0036
    - ADR-0038
    - ADR-0039
    - ADR-0042
    - ADR-0043
    - ADR-0044
    - ADR-0045
    - ADR-0049
    - ADR-0050
    - ADR-0053
    - ADR-0054
    - ADR-0055
    - ADR-0056
    - ADR-0058
    - ADR-0071
    - ADR-0072
    - ADR-0073
    - ADR-0076
    - ADR-0077
  conflict_behavior: fail-closed
  semantic_acceptance_from_validation: false
  realization_confirmation_from_validation: false

native_checker_invocation:
  candidate_project_root:
    type: directory
  project_nourd_precondition:
    path: .nourd
    base: candidate-project-root
    evaluated_before_validation: true
    required_direct_entry: true
    resolution:
      must_be_safe: true
      final_kind: directory
      must_be_inside_candidate_project_root: true
    failure:
      classification: execution-level
      native_diagnostic: none
      validation_result_construction: forbidden
      validation_result_persistence: forbidden
      create_replace_or_repair: forbidden
      unsafe_path_following: forbidden

yaml_data_model:
  encoding: UTF-8
  yaml_version: "1.2"
  model: JSON-compatible
  document_count: 1
  root_type: mapping
  string_keys_only: true
  permitted_values:
    - "null"
    - boolean
    - finite-number
    - string
    - array
    - mapping
  duplicate_keys: forbidden
  custom_tags: forbidden
  merge_keys: forbidden
  anchors: forbidden
  aliases: forbidden
  comments_semantic: false
  whitespace_semantic: false
  constructors: forbidden
  environment_interpolation: forbidden
  parse_time_external_resolution: forbidden

common:
  identifier:
    type: string
    min_length: 1
    lexical_grammar: unspecified
  portable_identity:
    type: string
    min_length: 1
    max_length: 256
    pattern: "^[^\\u0000-\\u001f\\u007f]+$"
  lowercase_uuid:
    type: string
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  utc_millisecond_timestamp:
    type: string
    format: date-time
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:(?:[0-5][0-9]|60)\\.[0-9]{3}Z$"
  digest:
    closed: true
    required_fields: [algorithm, value]
    fields:
      algorithm:
        const: sha-256
      value:
        type: string
        pattern: "^[0-9a-f]{64}$"
  entity_reference:
    closed: true
    required_fields: [record, entity]
    fields:
      record:
        ref: common.identifier
      entity:
        ref: common.identifier
    resolution: same-bundle-declared-entity
  extension_use:
    closed: true
    required_fields: [contract, requirement, payload]
    fields:
      contract:
        ref: extensions.identifier
      requirement:
        enum: [required, optional]
      payload:
        type: any-json-compatible-value

bundle:
  identity: nkf.bundle
  manifest_path: .nourd/knowledge/bundle.yaml
  closed: true
  required_fields:
    - nkf_version
    - contract
    - id
    - root
    - knowledge_root
    - non_records
  optional_fields:
    - canonical_terms
    - governed_artifacts
    - extension_contracts
    - extensions
  forbidden_legacy_fields:
    - product_record
    - record_contract
    - markdown_root
    - records_root
    - required_extensions
  fields:
    nkf_version:
      const: "0.11"
    contract:
      const: nkf.bundle
    id:
      ref: common.identifier
    root:
      closed: true
      required_fields: [record, profile]
      fields:
        record:
          ref: common.identifier
          resolves_to: unique-profile-root-record
        profile:
          ref: common.identifier
          resolves_to: supported-selectable-root-profile
    knowledge_root:
      ref: paths.knowledge_root
    non_records:
      type: array
      required: true
      may_be_empty: true
      order_semantic: false
      items:
        ref: bundle.non_record
    canonical_terms:
      type: array
      min_items: 1
      unique_items: true
      order_semantic: false
      items:
        type: string
        min_length: 1
        leading_or_trailing_whitespace: forbidden
        internal_whitespace: one-U+0020
        markdown_markup: forbidden
        casing: exact
      omit_when_empty: true
      core_terms: [NKF]
      core_conflict_comparison: unicode-17-default-caseless-matching
    governed_artifacts:
      type: array
      min_items: 1
      unique_by: id
      order_semantic: false
      items:
        ref: bundle.governed_artifact
      allowed_by_profile: [nkf.profile.technology]
      omit_when_empty: true
    extension_contracts:
      ref: extensions.catalog
      omit_when_empty: true
    extensions:
      type: array
      unique_by: contract
      items:
        ref: common.extension_use
      omit_when_empty: true
  non_record:
    closed: true
    required_fields: [path, kind]
    optional_fields: [reason]
    fields:
      path:
        ref: paths.knowledge_relative_file
        must_exist: true
        file_kind: regular-file
      kind:
        enum: [navigation, task, evidence, generated, redirect, other]
      reason:
        type: string
        min_length: 1
        required_when:
          field: kind
          equals: other
    path_unique_after_resolution: true
    may_conflict_with_record_source: false
  governed_artifact:
    closed: true
    required_fields: [id, kind, path, digest, record, source_section]
    fields:
      id:
        ref: common.identifier
      kind:
        enum: [executable-contract, schema, checker-source, test, fixture, build-tool, project-configuration]
      path:
        ref: paths.project_relative_file
        must_exist: true
        file_kind: regular-file
        must_be_outside_nourd: true
      digest:
        ref: common.digest
      record:
        ref: common.identifier
        resolves_to: same-bundle-realization-record
      source_section:
        ref: common.identifier
        resolves_to: governed-artifact-record-section
    unique_by: [id, lexical-path, resolved-physical-file, exact-entry]
    exact_bytes_in_validated_snapshot: true
    binding_integrity_proves_realization: false
  constraints:
    exactly_one_profile_root: true
    exactly_one_selectable_profile: true
    common_profile_selectable: false
    portable_topology_required: true
    every_markdown_exactly_one_representation: true
    non_markdown_enumeration_required: false
    non_markdown_enumeration_permitted: true
    array_order_semantic: false

paths:
  project_root:
    definition: directory-directly-containing-.nourd
    identity: false
    git_repository_required: false
  declaration_directory:
    path: .nourd/knowledge/records
    flat: true
    files:
      encoding: UTF-8
      suffix: .yaml
      regular_files_only: true
      one_record_per_file: true
      filename_convention: <record-id>.yaml
      filename_mismatch: warning
      identity_source: record.id
  knowledge_root:
    type: string
    min_length: 1
    base: project-root
    target_kind: directory
    must_be_inside_project: true
    must_be_outside_nourd: true
    forbidden:
      absolute: true
      empty_segment: true
      dot_segment: true
      parent_segment: true
      environment_expansion: true
      tilde_expansion: true
  knowledge_relative_file:
    type: string
    min_length: 1
    base: knowledge-root
    separator: /
    must_resolve_inside_knowledge_root: true
    forbidden:
      absolute: true
      leading_slash: true
      windows_drive_prefix: true
      unc_prefix: true
      backslash_separator: true
      empty_segment: true
      dot_segment: true
      parent_segment: true
      nul: true
      ascii_control: true
      environment_expansion: true
      tilde_expansion: true
    spelling: exact
    case: exact
    windows_reserved_names_rule: none
    unicode_case_folding_rule: none
  project_relative_file:
    type: string
    min_length: 1
    base: project-root
    separator: /
    must_resolve_inside_project: true
    must_be_outside_nourd: true
    forbidden:
      absolute: true
      leading_slash: true
      windows_drive_prefix: true
      unc_prefix: true
      backslash_separator: true
      empty_segment: true
      dot_segment: true
      parent_segment: true
      nul: true
      ascii_control: true
      environment_expansion: true
      tilde_expansion: true
    spelling: exact
    case: exact
  symlinks:
    policy: generally-prohibited
    broken: error
    cyclic: error
    target_outside_project: error
    target_outside_knowledge_root_for_knowledge_path: error
    contained: warning
    contained_read_permitted: true
    final_target_kind_enforced: true
    duplicate_physical_file_checks: true
  locators:
    are_paths: false
    are_identity: false
    universal_syntax: unspecified
    automatic_unsafe_dereference: forbidden

portable_topology:
  owner: nkf.common
  applies_to_profiles: [nkf.profile.product, nkf.profile.technology]
  continuing_conformance: true
  required_paths:
    - {path: README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: tasks/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: tasks/active/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: tasks/deferred/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: tasks/completed/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: designs/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: designs/active/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: designs/adopted/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: designs/rejected/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: designs/superseded/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: designs/withdrawn/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: decisions/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: specifications/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: realizations/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: realizations/current-system.md, representation: record, type: realization, body_contract: nkf.realization, count: 1}
    - {path: realizations/current/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: evidence/README.md, representation: non-record, kind: evidence, frontmatter: evidence-exempt}
  path_safety:
    file_kind: regular-file
    symlink: forbidden
    duplicate_physical_target: forbidden
    multiple_representation: forbidden
  topology_link_resolution:
    participation: satisfies-required-managed-map-or-lifecycle-index-target
    commonmark_node: link
    images: excluded
    autolinks: excluded
    scheme: forbidden
    authority: forbidden
    query: forbidden
    fragment: forbidden
    percent_escape: forbidden
    backslash: forbidden
    nul: forbidden
    ascii_control: forbidden
    separator: /
    base: containing-markdown-directory
    lexical_parent_segments: permitted-while-normalized-target-inside-knowledge-root
    target_spelling: exact
    other_links: ignored-for-topology
  canonical_map:
    path: README.md
    single_authority_copy: true
    competing_generated_pattern: "^README-[0-9]+\\.md$"
    competing_generated_declared: forbidden
    managed_block:
      count: 1
      start_line: "<!-- nkf-navigation:start -->"
      end_line: "<!-- nkf-navigation:end -->"
      heading:
        level: 2
        text: NKF Navigation
        direct_child: true
        count: 1
        same_heading_outside_block: forbidden
      required_targets:
        - profile-root-source
        - tasks/README.md
        - designs/README.md
        - decisions/README.md
        - specifications/README.md
        - realizations/README.md
        - realizations/current-system.md
        - evidence/README.md
      target_count: exactly-once
      target_base: canonical-map-directory
      target_spelling: exact
      target_containment: knowledge-root
      target_resolution: declared-native-source
    outside_managed_block:
      ownership: project
      native_validation_rewrite: forbidden
  lifecycle_navigation:
    task:
      representation: non-record
      state_source: markdown.frontmatter.task_status
      placements:
        active: tasks/active/
        deferred: tasks/deferred/
        completed: tasks/completed/
      indexes:
        active: tasks/active/README.md
        deferred: tasks/deferred/README.md
        completed: tasks/completed/README.md
      matching_items: exactly-once
      parent_index: tasks/README.md
      parent_targets: [tasks/active/README.md, tasks/deferred/README.md, tasks/completed/README.md]
    design:
      representation: record
      disposition_source: markdown.frontmatter.design_disposition
      placements:
        active: designs/active/
        adopted: designs/adopted/
        rejected: designs/rejected/
        superseded: designs/superseded/
        withdrawn: designs/withdrawn/
      indexes:
        active: designs/active/README.md
        adopted: designs/adopted/README.md
        rejected: designs/rejected/README.md
        superseded: designs/superseded/README.md
        withdrawn: designs/withdrawn/README.md
      matching_items: exactly-once
      parent_index: designs/README.md
      parent_targets: [designs/active/README.md, designs/adopted/README.md, designs/rejected/README.md, designs/superseded/README.md, designs/withdrawn/README.md]
    decision:
      representation: record
      placement: decisions/
      index: decisions/README.md
      matching_items: exactly-once
    specification:
      representation: record
      placement: specifications/
      index: specifications/README.md
      matching_items: exactly-once
      selected_profile_permissions_apply: true
    realization:
      current_system:
        path: realizations/current-system.md
        count: 1
      supporting_current_placement: realizations/current/
      supporting_current_index: realizations/current/README.md
      matching_supporting_items: exactly-once
      parent_index: realizations/README.md
      parent_targets: [realizations/current-system.md, realizations/current/README.md]
    evidence:
      index: evidence/README.md
      exhaustive_file_links_required: false
      required_area_target: direct-child-directory-containing-represented-evidence-markdown-at-any-depth
      required_area_target_count: exactly-once
      required_area_target_resolution: safe-directory-inside-knowledge-root
    metadata_precedes_path_inference: true
    path_assigns_semantic_state: false
  preserved_material:
    unresolved_native_promotion: forbidden
    noncanonical_path_permitted_when_non-record: true
    deliberately_promoted_native_knowledge_requires_canonical_placement: true
  initial_onboarding:
    supported_categories: [category-1-empty, category-2-tiny-knowledge]
    common_topology: complete
    active_task:
      placement: tasks/active/
      map_target_during_onboarding: required
    profile_scaffolds:
      nkf.profile.product:
        root: {preferred_path: product.md, governance: draft}
      nkf.profile.technology:
        root: {preferred_path: technology.md, governance: draft}
        specification: {preferred_path: specifications/initial-specification.md, governance: draft, map_target_during_onboarding: required}
    occupied_preferred_path:
      inspected_safe_selected_path_may_remain: true
      filesystem_path_defines_identity: false
    canonical_map:
      absent: generate
      existing: reconcile-same-document
      suffix_allocation: forbidden
      ambiguous: fail-before-mutation
      outside_managed_block_bytes: preserve-unless-explicit-candidate-change
  predecessor_repair:
    command: repair-topology
    eligible_predecessors: [NKF-013, NKF-015]
    trusted_receipt_required: true
    candidate_outside_project: true
    seal_required: true
    staged_full_bundle_validation: true
    rollback_required: true
    idempotent_result: no-update
    competing_map_removal:
      receipt_path_match: required
      current_byte_match: required
      drift: fail-human-resolution
      consumer_authored_content: preserve-and-fail-human-resolution
    receipt_fields: [predecessor_release, successor_release, created_paths, changed_paths, removed_paths, preserved_paths]
    missing_trustworthy_receipt: governed-migration-plan
    silent_consumer_migration: forbidden

markdown:
  grammar: CommonMark-0.31.2
  source_encoding:
    required: UTF-8
    invalid_diagnostic: markdown.utf8.invalid
    copied_invalid_bytes: forbidden
  source_envelope:
    complete_source_bytes: optional-front-matter-envelope-plus-commonmark-body
    opening_condition: first-line-exactly----
    opening_delimiter: "---"
    closing_delimiter: "---"
    closing_rule: first-later-line-exactly-closing-delimiter
    front_matter:
      grammar: YAML-1.2-Core
      document_count: 1
      root: non-empty-mapping
      unique_string_keys: required
      value_model: JSON-compatible
      anchors: forbidden
      aliases: forbidden
      merge_keys: forbidden
      custom_tags: forbidden
      arbitrary_core_key_meaning: forbidden
      profile_or_extension_keys_require_accepted_governance: true
      governed_orientation:
        applicability:
          default: required
          evidence_record:
            selector: declaration.type
            equals: evidence
            orientation_fields: exempt
          evidence_non_record:
            selector: bundle.non_records.kind
            equals: evidence
            orientation_fields: exempt
          exemption_from_path: forbidden
          safe_syntax_when_exempt_envelope_present: required
        scalar_string:
          type: string
          min_length: 1
          trim_must_equal_self: true
          line_breaks: forbidden
        created_at:
          type: string
          exact_serialization: YYYY-MM-DDTHH:mm:ssZ
          real_calendar_instant: required
          timezone: UTC
          fractional_seconds: forbidden
          generic_updated_at: undefined
        common:
          required_fields: [title, summary, created_at]
          fields:
            title:
              ref: markdown.source_envelope.front_matter.governed_orientation.scalar_string
              equals: commonmark-body-single-H1-comparison-string
            summary:
              ref: markdown.source_envelope.front_matter.governed_orientation.scalar_string
              semantic_adequacy_from_validation: false
            created_at:
              ref: markdown.source_envelope.front_matter.governed_orientation.created_at
        record:
          required_fields: [id, type, record_lifecycle, record_status]
          fields:
            id:
              equals: declaration.id
            type:
              equals: declaration.type
            record_lifecycle:
              equals: declaration.governance.lifecycle
            record_status:
              equals: declaration.governance.status
            title:
              equals: declaration.title
        lifecycle_record_task:
          applies_to_types: [design, decision, specification, realization]
          required_field: task
          field:
            ref: markdown.source_envelope.front_matter.governed_orientation.scalar_string
            resolves_to: same-bundle-task-non-record-task-id
          proves_operational_state: false
          proves_acceptance: false
          proves_confirmation: false
        design:
          applies_to_type: design
          required_fields: [task, design_disposition]
          dispositions: [active, adopted, rejected, superseded, withdrawn]
          provenance:
            active:
              required: []
              forbidden: [design_decisions, superseded_by, withdrawal_source]
            adopted:
              required: [design_decisions]
              forbidden: [superseded_by, withdrawal_source]
            rejected:
              required: [design_decisions]
              forbidden: [superseded_by, withdrawal_source]
            superseded:
              required: [superseded_by]
              optional: [design_decisions]
              forbidden: [withdrawal_source]
            withdrawn:
              required: [withdrawal_source]
              forbidden: [design_decisions, superseded_by]
          design_decisions:
            type: array
            min_items: 1
            unique: true
            items_resolve_to: same-bundle-decision-record-id
          superseded_by:
            type: array
            min_items: 1
            unique: true
            items_resolve_to: same-bundle-record-id
          withdrawal_source:
            closed: true
            required_fields: [kind, id]
            fields:
              kind:
                enum: [task, record]
              id:
                ref: markdown.source_envelope.front_matter.governed_orientation.scalar_string
            resolves_by_kind: true
          determines_record_governance: false
          determines_normative_authority: false
        realization:
          applies_to_type: realization
          required_fields: [task, confirmation_status]
          statuses: [unconfirmed, partially-confirmed, confirmed]
          confirmation_decisions:
            type: array
            min_items: 1
            unique: true
            items_resolve_to: same-bundle-decision-record-id
          unconfirmed_scope:
            ref: markdown.source_envelope.front_matter.governed_orientation.scalar_string
          conditions:
            unconfirmed:
              forbidden: [confirmation_decisions, unconfirmed_scope]
            partially-confirmed:
              required: [confirmation_decisions, unconfirmed_scope]
            confirmed:
              required: [confirmation_decisions]
              forbidden: [unconfirmed_scope]
          confirmation_from_fields: false
          confirmation_from_validation: false
        task_non_record:
          applies_to_kind: task
          required_fields: [task_id, task_status]
          task_id:
            ref: markdown.source_envelope.front_matter.governed_orientation.scalar_string
            unique_across_task_non_records: true
          task_status:
            enum: [active, deferred, completed]
          directory_state_inference: forbidden
          operational_authority: external-to-nkf
          applicability_gate:
            section_heading: Decision Applicability
            subsection_order: [applicable_decisions, mandatory_capabilities]
            applicable_decisions:
              heading: Applicable Decisions
              none_sentence: No accepted decision applies to this Task.
              table_header: [Reference, Kind, Carried Constraint]
              kind_enum: [record, external]
              record_reference:
                record_type: decision
                governance_status: accepted
                same_bundle: true
            mandatory_capabilities:
              heading: Mandatory Capabilities
              none_sentence: No mandatory capability is implicated by this Task.
              table_header: [Capability, Finding, Verification, Exception]
              finding_vocabulary: capability_findings
              verification_vocabulary: verification_levels
              verification_none_literal: none
              exception_none_literal: none
              exception_record_reference:
                record_type: decision
                governance_status: accepted
                same_bundle: true
            presence:
              active: required
              deferred: required
              completed: required
            completion_rule:
              applies_to_status: completed
              blocked_findings: [unsupported, unknown]
              blocked_when_exception_is: none
            confers_authority: none
            retrospective_gate_disclosure: required
        allowed_keys:
          closed_by_applicable_document_class: true
          common: [title, summary, created_at]
          record: [id, type, record_lifecycle, record_status]
          lifecycle_record: [task]
          design: [design_disposition, design_decisions, superseded_by, withdrawal_source]
          realization: [confirmation_status, confirmation_decisions, unconfirmed_scope]
          task_non_record: [task_id, task_status]
        reference_resolution:
          record_ids: exact-and-unique
          task_ids: exact-and-unique
          display-identifiers: forbidden
          unresolved_or_ambiguous: error
    commonmark_body:
      begins: immediately-after-closing-delimiter-line-ending
      envelope_participation: none
      owns_canonical_human_meaning: true
    complete_bytes_participate_in:
      - record-source-digest
      - validated-snapshot
      - applicable-security-scan
    invalid_diagnostic: markdown.frontmatter.invalid
  participating_headings:
    container: direct-child-of-document-root
    levels: [1, 2, 3]
    syntaxes: [atx, setext]
    nested_container_headings: content-only
    fenced_code_heading_like_text: content-only
  comparison_string:
    retain:
      - visible-text
      - image-alternative-text
      - code-span-text
    omit:
      - link-destinations
      - raw-html-tags
    escapes_and_entities: parsed-characters
    whitespace_runs: one-U+0020
    trim: true
    additional_unicode_normalization: none
    case_preservation: exact
  coverage:
    h1_count: 1
    h1_is_title_not_section: true
    every_h2_h3_exactly_one_section: true
    every_section_exactly_one_h2_h3: true
    duplicate_mapping: forbidden
    h3_requires_preceding_h2: true
    h2_heading_path: [self]
    h3_heading_path: [nearest-preceding-h2, self]
    occurrence: one-based-source-order-within-identical-complete-path
    h4_h5_h6: subordinate-content
    h4_h5_h6_before_mapped_h2_h3: invalid
    pre-first-h2_content:
      belongs_to_record: true
      satisfies_section_responsibility: false
  title_case:
    applies_to: [top-level-h1, top-level-h2, top-level-h3]
    unicode_version: 17.0.0
    operation: Default-Case-Conversion-toTitlecase
    word_boundaries: unicode-default
    locale_tailoring: none
    protected_ranges:
      - inline-code
      - nkf-owned-canonical-terms
      - bundle-canonical-terms
    all_words_converted: true
    hyphen_components_converted: true
    uncased_text_unchanged: true
    nkf_owned_canonical_terms: [NKF]
    canonical_match:
      code_points_and_case: exact
      boundary: unicode-word
      overlap: longest-first-then-left-to-right
  mermaid:
    fenced_info_string: mermaid
    content_kind: literal-markdown
    exact_bytes_in_source_digest: true
    belongs_to_containing_section: true
    heading_or_title_case_participation: false
    native_execution: forbidden
    native_rendering: not-required
    native_semantic_validation: none
    essential_meaning_available_without_rendering: required-human-review
    generated_diagram: provenance-bearing-projection

record:
  identity: nkf.record
  closed: true
  required_fields:
    - contract
    - id
    - type
    - body_contract
    - title
    - source
    - governance
    - scope
    - sections
    - relationships
  optional_fields:
    - provenance
    - external_authorities
    - entities
    - entity_relationships
    - bindings
    - extensions
  fields:
    contract:
      const: nkf.record
    id:
      ref: common.identifier
      unique_scope: bundle
    type:
      enum: [product, principle, concept, journey, domain, capability, technology, specification, design, decision, realization, evidence]
      extension_defined_namespaced_values: permitted-through-required-extension
    body_contract:
      enum: [nkf.product, nkf.principle, nkf.concept, nkf.journey, nkf.domain, nkf.capability, nkf.technology, nkf.specification, nkf.design, nkf.decision, nkf.realization, nkf.evidence]
      extension_defined_namespaced_values: permitted-through-required-extension
    title:
      type: string
      min_length: 1
      equals: markdown-h1
    source:
      ref: record.source
    governance:
      ref: record.governance
    scope:
      ref: record.scope
    sections:
      type: array
      min_items: 1
      items:
        ref: record.section
    relationships:
      type: array
      required: true
      may_be_empty: true
      items:
        ref: record.relationship
    provenance:
      ref: record.provenance
      omit_when_empty: true
    external_authorities:
      type: array
      items:
        ref: record.external_authority
      unique_by: id
      omit_when_empty: true
    entities:
      type: array
      items:
        ref: record.entity
      unique_by: id
      omit_when_empty: true
    entity_relationships:
      type: array
      items:
        ref: record.entity_relationship
      exact_duplicates: forbidden
      omit_when_empty: true
    bindings:
      type: array
      items:
        ref: record.binding
      exact_duplicates: forbidden
      omit_when_empty: true
    extensions:
      type: array
      unique_by: contract
      items:
        ref: common.extension_use
      omit_when_empty: true
  type_body_contract:
    product: nkf.product
    principle: nkf.principle
    concept: nkf.concept
    journey: nkf.journey
    domain: nkf.domain
    capability: nkf.capability
    technology: nkf.technology
    specification: nkf.specification
    design: nkf.design
    decision: nkf.decision
    realization: nkf.realization
    evidence: nkf.evidence
  source:
    closed: true
    required_fields: [path, digest]
    fields:
      path:
        ref: paths.knowledge_relative_file
        suffix: .md
        must_exist: true
        file_kind: regular-file
      digest:
        ref: common.digest
  governance:
    closed: true
    required_fields: [lifecycle, status, authority]
    optional_fields: [accepted_at]
    fields:
      lifecycle:
        enum: [living, immutable]
      status:
        enum: [draft, accepted, superseded, retired]
      authority:
        type: array
        min_items: 1
        unique_items: true
        items:
          ref: common.identifier
      accepted_at:
        type: string
        format: iso-8601-date
    declared_status_proves_acceptance: false
    accepted_at_proves_acceptance: false
  scope:
    closed: true
    required_fields: [root]
    optional_fields: [subjects]
    fields:
      root:
        ref: common.identifier
        equals: bundle.root.record
      subjects:
        type: array
        items:
          ref: common.identifier
        omit_when_empty: true
  section:
    closed: true
    required_fields: [id, heading_path, occurrence, authority, role]
    optional_fields: [responsibilities]
    fields:
      id:
        ref: common.identifier
        unique_scope: record
      heading_path:
        type: array
        min_items: 1
        items:
          type: string
          min_length: 1
        order_semantic: true
      occurrence:
        type: integer
        minimum: 1
      authority:
        enum: [accepted-meaning, proposal, unresolved, evidence]
      role:
        ref: vocabularies.section_roles
        allowed_by: record.body_contract
      responsibilities:
        type: array
        min_items: 1
        unique_items: true
        items:
          ref: common.identifier
        allowed_by: record.body_contract
        omit_when_empty: true
    semantic_h2_h3_mapping_complete: true
    one_mapping_per_semantic_heading: true
  relationship:
    closed: true
    required_fields: [type, target, source_section]
    fields:
      type:
        ref: vocabularies.record_relationship_types
      target:
        ref: common.identifier
        resolves_to: same-bundle-record
      source_section:
        ref: common.identifier
        resolves_to: declaring-record-section
    exact_duplicates: forbidden
  provenance:
    closed: true
    optional_fields: [producers, verifiers, sources, primary_observation]
    fields:
      producers:
        type: array
        items:
          ref: record.actor_event
      verifiers:
        type: array
        items:
          ref: record.actor_event
      sources:
        type: array
        items:
          ref: record.provenance_source
        unique_non_null_by: id
      primary_observation:
        ref: record.primary_observation
    omit_when_empty: true
  actor_event:
    closed: true
    required_fields: [actor]
    optional_fields: [at, method]
    fields:
      actor:
        ref: common.identifier
      at:
        type: string
        min_length: 1
        lexical_format: not-specified-by-nkf-0.1
      method:
        type: string
        min_length: 1
  provenance_source:
    closed: true
    required_fields: [locator]
    optional_fields: [id, title, author, observed_at, revision, last_modified_at, digest]
    fields:
      locator:
        type: string
        min_length: 1
      id:
        ref: common.identifier
      title:
        type: string
        min_length: 1
      author:
        type: string
        min_length: 1
      observed_at:
        type: string
        min_length: 1
        lexical_format: not-specified-by-nkf-0.1
      revision:
        type: string
        min_length: 1
      last_modified_at:
        type: string
        min_length: 1
        lexical_format: not-specified-by-nkf-0.1
      digest:
        ref: common.digest
  primary_observation:
    closed: true
    required_fields: [method, source_section]
    optional_fields: [observed_at]
    fields:
      method:
        type: string
        min_length: 1
      source_section:
        ref: common.identifier
        resolves_to: declaring-record-section
      observed_at:
        type: string
        min_length: 1
        lexical_format: not-specified-by-nkf-0.1
  external_authority:
    closed: true
    required_fields: [id, authority, relationship, source_section]
    optional_fields: [locator, resolution_rule]
    at_least_one: [locator, resolution_rule]
    fields:
      id:
        ref: common.identifier
      authority:
        type: string
        min_length: 1
      relationship:
        type: string
        min_length: 1
      source_section:
        ref: common.identifier
        resolves_to: declaring-record-section
      locator:
        type: string
        min_length: 1
      resolution_rule:
        type: string
        min_length: 1
  entity:
    closed: true
    required_fields: [id, kind, defining_section]
    optional_fields: [address]
    fields:
      id:
        ref: common.identifier
        unique_scope: record
      kind:
        ref: vocabularies.entity_kinds
        allowed_by: record.body_contract
      defining_section:
        ref: common.identifier
        resolves_to: declaring-record-section
      address:
        type: string
        min_length: 1
        identity: false
  entity_relationship:
    closed: true
    required_fields: [type, source, target, source_section]
    fields:
      type:
        ref: vocabularies.entity_relationship_types
      source:
        ref: common.entity_reference
        owner: declaring-record
      target:
        ref: common.entity_reference
      source_section:
        ref: common.identifier
        resolves_to: declaring-record-section
    self_relationship: forbidden
    exact_duplicates: forbidden
  binding:
    closed: true
    required_fields: [entity, realization, kind, source_section]
    optional_fields: [locator, resolution_rule, external_authority]
    at_least_one: [locator, resolution_rule]
    fields:
      entity:
        ref: common.entity_reference
      realization:
        ref: common.identifier
        equals: declaring-record-id
      kind:
        ref: vocabularies.binding_kinds
      source_section:
        ref: common.identifier
        resolves_to: declaring-record-section
      locator:
        type: string
        min_length: 1
      resolution_rule:
        type: string
        min_length: 1
      external_authority:
        ref: common.identifier
        resolves_to: declaring-record-external-authority
    declaring_body_contract: nkf.realization
  constraints:
    one_markdown_source: true
    source_digest_exact: true
    markdown_h1_count: 1
    title_matches_h1: true
    required_responsibility_coverage: true
    relationship_source_bound: true
    array_order_semantic:
      only: [section.heading_path]
    responsibility_emit_order: body-contract-order
    optional_empty_structures: omit
    presentation_field: forbidden

root_profiles:
  common:
    identity: nkf.common
    applies_automatically: true
    selectable: false
    allowed_body_contracts: [nkf.design, nkf.decision, nkf.realization, nkf.evidence]
    binding_kinds: [source, system, process, asset, implementation, provider, namespace, data, interface]
  selectable:
    nkf.profile.product:
      root:
        type: product
        body_contract: nkf.product
        lifecycle: living
      allowed_body_contracts: [nkf.product, nkf.principle, nkf.concept, nkf.journey, nkf.domain, nkf.capability, nkf.design, nkf.decision, nkf.realization, nkf.evidence]
      required_body_contracts: []
      record_part_of: product-domain-capability
      governed_artifacts: forbidden
      binding_kinds: [source, system, process, asset, implementation, provider, namespace, data, interface, agreement, deployment]
    nkf.profile.technology:
      root:
        type: technology
        body_contract: nkf.technology
        lifecycle: living
      allowed_body_contracts: [nkf.technology, nkf.specification, nkf.design, nkf.decision, nkf.realization, nkf.evidence]
      required_body_contracts: [nkf.specification]
      record_part_of: forbidden
      governed_artifacts: permitted
      binding_kinds: [source, system, process, asset, implementation, provider, namespace, data, interface]
  selection:
    count: 1
    fallback: forbidden
    implicit_default: forbidden
    general_or_generic_root: forbidden
    unsupported: fail-closed

vocabularies:
  section_authority:
    accepted-meaning: governs-only-when-exact-record-revision-accepted
    proposal: candidate-non-governing-meaning
    unresolved: explicit-open-or-undecided-meaning
    evidence: source-grounded-support-not-product-intent
  verification_levels:
    order: [data-validity, adapter-compatibility, runtime-behaviour, human-experience, production-suitability]
    meanings:
      data-validity: governed-inputs-well-formed-and-integrity-bound
      adapter-compatibility: consumer-loads-data-through-declared-contract
      runtime-behaviour: required-runtime-outcome-directly-observed
      human-experience: human-authority-directly-reviewed-experienced-result
      production-suitability: production-commercial-and-legal-suitability-established
    lower-level-claim-never-higher-level-success: true
  capability_findings:
    proven: capability-directly-verified-at-named-level
    unsupported: capability-established-as-not-supported
    unknown: capability-support-not-established
  record_relationship_types:
    part-of: source-is-governed-part-of-target
    defines: source-canonically-defines-meaning-used-by-target
    governs: source-constrains-target
    applies-to: source-is-applicable-to-target
    depends-on: source-requires-target-meaning
    extends: source-adds-compatible-meaning-to-target
    supersedes: source-replaces-target-for-declared-scope
    rationale-for: source-explains-target
    realizes: source-maps-target-to-durable-realization
    evidences: source-supplies-evidence-relevant-to-target
    references: source-points-without-stronger-relation
  section_roles:
    meanings:
      actor: participant-in-or-served-by-subject
      alternative: materially-relevant-other-option
      applicability: contexts-or-scope-where-meaning-applies
      behaviour: required-permitted-or-prohibited-conduct
      boundary: inclusion-exclusion-limit-non-goal-or-authority-boundary
      catalogue: organized-inventory-classification-portfolio-or-map
      condition: prerequisite-input-state-or-condition
      consequence: effect-or-implication-of-choice
      content: source-meaning-with-no-narrower-accurate-role
      context: background-circumstance-problem-or-operating-situation
      definition: statement-of-meaning-and-distinction
      dependency: required-reliance
      evidence: supporting-material
      evolution: maturity-change-migration-compatibility-or-retirement
      finding: source-supported-conclusion
      governing: governing-constraint-input-policy-rule-or-authority
      identity: stable-realization-identity-kind-or-characteristic
      interface: interaction-exchange-contract-boundary-or-connection
      interpretation: reasoned-meaning-from-observation-or-finding
      limitation: uncertainty-caveat-gap-or-applicability-limit
      mapping: durable-correspondence-between-governed-meaning-and-realization
      measure: success-failure-effectiveness-health-or-progress-criterion
      method: observation-collection-analysis-or-verification-procedure
      obligation: duty-requirement-compliance-or-commitment
      observation: directly-observed-or-source-reported-fact
      outcome: desired-expected-achieved-failed-or-recovered-result
      principle: concise-normative-product-principle
      rationale: reason-for-principle-decision-design-or-direction
      recovery: failure-rollback-interruption-restoration-or-safe-recovery
      relevance: bearing-on-governed-knowledge-claim-decision-or-question
      responsibility: ownership-accountability-or-responsibility-boundary
      risk: uncertainty-exposure-hazard-or-failure-mode
      source: origin-of-evidence
      trade-off: tension-cost-benefit-or-compromise
      transition: stage-decision-state-change-or-journey-movement
      trigger: initiating-event-or-circumstance
      unresolved: open-question-ambiguity-conflict-or-unsettled-matter
      validation: approach-criteria-or-proof-for-validation
    allowed_by_body:
      nkf.technology: [definition, context, actor, governing, boundary, catalogue, evolution, interface, obligation, risk, measure, unresolved, content]
      nkf.specification: [definition, governing, applicability, boundary, interface, validation, evolution, obligation, risk, unresolved, content]
      nkf.product: [definition, governing, boundary, catalogue, evolution, interface, obligation, measure, unresolved, content]
      nkf.principle: [principle, rationale, applicability, behaviour, boundary, trade-off, evidence, unresolved, content]
      nkf.concept: [definition, governing, boundary, catalogue, evolution, evidence, unresolved, content]
      nkf.journey: [governing, actor, trigger, boundary, transition, obligation, outcome, interface, measure, evidence, risk, unresolved, content]
      nkf.domain: [governing, boundary, catalogue, interface, obligation, risk, measure, evolution, unresolved, content]
      nkf.capability: [governing, actor, condition, outcome, boundary, obligation, dependency, measure, evidence, risk, unresolved, content]
      nkf.design: [context, boundary, governing, responsibility, interface, alternative, trade-off, risk, recovery, validation, evidence, unresolved, content]
      nkf.decision: [context, governing, applicability, rationale, alternative, consequence, trade-off, evidence, recovery, unresolved, content]
      nkf.realization: [identity, mapping, responsibility, boundary, interface, dependency, obligation, evidence, recovery, unresolved, content]
      nkf.evidence: [context, source, method, observation, finding, interpretation, limitation, boundary, relevance, evidence, unresolved, content]
    constraints:
      unresolved_role_requires_authority: unresolved
      content_role_responsibilities: forbidden
      role_proves_responsibility: false
      role_proves_semantic_adequacy: false
  entity_kinds:
    product:
      allowed_by: [nkf.product]
    technology:
      allowed_by: [nkf.technology]
    specification:
      allowed_by: [nkf.specification]
    contract:
      allowed_by: [nkf.technology, nkf.specification]
    rule:
      allowed_by: [nkf.specification, nkf.decision]
    diagnostic:
      allowed_by: [nkf.specification]
    principle:
      allowed_by: [nkf.principle]
    concept:
      allowed_by: [nkf.concept]
    actor:
      allowed_by: [nkf.product, nkf.concept, nkf.journey, nkf.domain, nkf.capability, nkf.technology, nkf.specification]
    beneficiary:
      allowed_by: [nkf.product, nkf.concept, nkf.journey, nkf.domain, nkf.capability]
    stage:
      allowed_by: [nkf.journey]
    decision-point:
      allowed_by: [nkf.journey]
    transition:
      allowed_by: [nkf.journey]
    outcome:
      allowed_by: [nkf.product, nkf.journey, nkf.capability]
    domain-concept:
      allowed_by: [nkf.concept, nkf.domain]
    domain-entity:
      allowed_by: [nkf.concept, nkf.domain]
    capability-input:
      allowed_by: [nkf.capability]
    capability-outcome:
      allowed_by: [nkf.capability]
    component:
      allowed_by: [nkf.design]
    interface:
      allowed_by: [nkf.domain, nkf.capability, nkf.technology, nkf.specification, nkf.design, nkf.realization]
    information-flow:
      allowed_by: [nkf.design]
    state:
      allowed_by: [nkf.concept, nkf.design]
    policy:
      allowed_by: [nkf.principle, nkf.domain, nkf.technology, nkf.specification, nkf.design, nkf.decision]
    decision-scope:
      allowed_by: [nkf.decision]
    system:
      allowed_by: [nkf.design, nkf.realization]
    source:
      allowed_by: [nkf.realization, nkf.evidence]
    process:
      allowed_by: [nkf.design, nkf.realization]
    asset:
      allowed_by: [nkf.realization]
    agreement:
      allowed_by: [nkf.realization]
    implementation:
      allowed_by: [nkf.realization]
    claim:
      allowed_by: [nkf.evidence]
    observation:
      allowed_by: [nkf.evidence]
  entity_relationship_types:
    part-of:
      acyclic: true
    defines: {}
    depends-on: {}
    governs: {}
    flows-to:
      cycles_permitted: true
    transitions-to:
      cycles_permitted: true
      source_kinds: [stage, transition, state]
      target_kinds: [stage, transition, state]
    realizes:
      source_body: nkf.realization
    evidences:
      source_body: nkf.evidence
    observes:
      source_body: nkf.evidence
      source_kind: observation
    references:
      stronger_known_type_preferred: true
  binding_kinds:
    source: source-controlled-location-or-artifact
    system: system-service-application-or-platform
    process: organizational-or-technical-process
    asset: durable-asset
    implementation: code-configuration-infrastructure-or-artifact
    provider:
      target: provider-owned-capability-registration-tenant-or-resource
      external_authority_required: true
    namespace: durable-namespace-or-resolution-domain
    data: dataset-schema-store-or-data-access-surface
    interface: api-event-integration-ui-or-interaction-surface
    agreement:
      meaning: governed-agreement-contract-or-commitment
      allowed_by_profile: [nkf.profile.product]
    deployment:
      meaning: durable-deployment-target-class-or-address
      allowed_by_profile: [nkf.profile.product]

body_contracts:
  nkf.technology:
    type: technology
    required_responsibilities: [technology-definition, purpose-and-problem, consumers-and-use-contexts, capabilities-and-contracts, scope-authority-and-boundaries, technology-map, versioning-compatibility-and-migration, distribution-support-and-security, evolution-and-retirement]
    lifecycle:
      required: living
    unique_profile_root: true
  nkf.specification:
    type: specification
    required_responsibilities: [specification-definition, authority-and-normative-status, scope-and-applicability, model-vocabulary-and-semantics, requirements-constraints-and-interfaces, validation-and-conformance, versioning-compatibility-and-migration, security-authority-and-operational-boundaries, unresolved-and-deferred-matters]
    governance:
      accepted_lifecycle: immutable
    required_by_profile: [nkf.profile.technology]
  nkf.product:
    type: product
    required_responsibilities: [product-definition, purpose, vision, people-served, needs-and-outcomes, boundaries, product-map]
    lifecycle:
      required: living
    unique_profile_root: true
  nkf.principle:
    type: principle
    required_responsibilities: [principle-statement, rationale, applicability, required-behaviour, boundaries, decision-and-trade-off-implications]
  nkf.concept:
    type: concept
    required_responsibilities: [definition, purpose-and-product-relevance, distinguishing-characteristics, inclusion-exclusion-and-ambiguity-boundaries, product-and-knowledge-relationships, current-maturity]
  nkf.journey:
    type: journey
    required_responsibilities: [purpose-and-desired-outcome, actors-and-beneficiaries, trigger-and-operating-context, start-end-and-scope-boundaries, meaningful-stages-decisions-and-transitions, needs-expectations-and-consequential-moments, success-failure-interruption-and-recovery, related-domains-and-capabilities]
  nkf.domain:
    type: domain
    required_responsibilities: [responsibility-and-product-purpose, value-and-people-served, scope-and-boundaries, owned-concepts-and-semantic-entities, capability-map, dependencies-interfaces-and-external-authority, obligations-risks-and-measures]
    hierarchy:
      part_of: product
      ultimately_reaches: product
  nkf.capability:
    type: capability
    required_responsibilities: [ability-statement, people-actors-and-outcomes, conditions-inputs-and-resulting-outcome, scope-and-non-capability-boundaries, governing-constraints-and-authority, dependencies-and-related-journeys, success-and-failure-conditions]
    hierarchy:
      part_of_exactly_one: domain
  nkf.design:
    type: design
    required_responsibilities: [design-kind-problem-and-scope, governing-inputs-and-constraints, proposed-direction, responsibilities-interactions-and-information-flows, alternatives-and-trade-offs, failure-safety-recovery-and-operations, validation-and-decision-evidence, unresolved-matters]
  nkf.decision:
    type: decision
    required_responsibilities: [context-and-problem, decision, scope-and-applicability, rationale, alternatives-considered, consequences-and-trade-offs]
    governance:
      accepted_lifecycle: immutable
  nkf.realization:
    type: realization
    required_responsibilities: [realization-identity-and-kind, governed-meaning-realized, durable-mapping, responsibilities-and-ownership-boundaries, interfaces-dependencies-locators-and-resolution, external-authority-and-operational-state-boundaries, compatibility-verification-and-recovery]
  nkf.evidence:
    type: evidence
    required_responsibilities: [question-claim-or-decision-context, sources-or-primary-observation-method, observations-and-findings, interpretation, limitations-and-uncertainty, applicability-and-boundaries, relevance-to-governed-knowledge]
    provenance_minimum:
      any_of: [provenance.sources, provenance.primary_observation]

hierarchy:
  record_part_of:
    acyclic: true
    profile_rules:
      nkf.profile.product:
        product_parent: forbidden
        domain_parent: product
        domain_ultimately_reaches: product
        capability_parent_exactly_one: domain
        other_type_participation: forbidden
      nkf.profile.technology:
        participation: forbidden
  every_record_scope_root: bundle.root.record
  hierarchy_participants_reach_root: true
  product_native_required_participants: [domain, capability]
  root_scope_creates_part_of: false

extensions:
  executable_identity: nkf.extension
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9]*(?:\\.[a-z](?:[a-z0-9-]*[a-z0-9])?){2,}$"
    reserved_first_namespace: nkf
    independent_version: forbidden
  core_supported_set: []
  authority_pair:
    markdown_precedence: true
    digest_bound: true
    required_executable_fields:
      - contract
      - nkf_version
      - id
      - application_sites
      - payload_shape
      - vocabularies
      - constraints
      - deterministic_validation
  catalog:
    type: array
    min_items_when_present: 1
    unique_by: id
    items:
      closed: true
      required_fields: [id, specification, executable]
      fields:
        id:
          ref: extensions.identifier
        specification:
          ref: extensions.artifact_reference
        executable:
          ref: extensions.artifact_reference
    artifacts_require:
      - exact-digest-resolution
      - executable-extension-id-match
      - executable-nkf-version-match
  artifact_reference:
    closed: true
    required_fields: [locator, digest]
    fields:
      locator:
        type: string
        min_length: 1
      digest:
        ref: common.digest
  support_requires:
    - resolve-specification
    - resolve-executable
    - verify-both-digests
    - verify-identity
    - verify-nkf-version
    - recognize-exact-executable-digest
    - implement-all-required-boundaries
  use:
    any_use_requires_non_empty_bundle_catalog: true
    contract_resolves_uniquely_through_catalog: true
    unique_by_contract_within_application_site: true
    order_semantic: false
    required_when_needed_for:
      - type
      - body-contract
      - authority
      - responsibility
      - relationship
      - governing-meaning
      - consequential-use
    namespaced_type_or_body_contract_requires_owner: true
    optional_may_supply_only:
      - nonessential-display
      - discovery
      - interoperability
      - advisory-data
  required_unsupported: fail-conformance-and-governing-use
  required_payload_invalid: fail-conformance
  optional_unsupported: preserve-report-unvalidated-and-continue-core
  supported_optional_payload_invalid: fail-conformance
  core_conflict: fail
  round_trip:
    json_data_model_loss: forbidden
    comments_required: false
    anchors_required: false
    aliases_required: false
    scalar_style_required: false
    whitespace_required: false
    key_order_required: false
    unable_to_preserve: read-only-or-fail

acceptance:
  universal_core_proof_field: none
  declarations_prove_acceptance: false
  verification:
    optional_operation: true
    required_evidence:
      - authoritative-event-or-immutable-decision-exists
      - actor-has-declared-authority
      - outcome-matches-claimed-status
      - exact-bundle-and-record-bound
      - exact-markdown-digest-bound
      - exact-declaration-revision-or-digest-bound
      - not-superseded-revoked-or-contradicted
    unavailable_result: not-verified
    conflicting_result: contradicted
  independent_axes:
    - declared-governance
    - acceptance-binding-verification
    - nkf-conformance
    - realization-confirmation
  governing_use_ready_requires:
    - applicable-accepted-status
    - acceptance-binding-verified
    - required-conformance-passed
    - no-governing-use-blocker

presentation:
  native_record_field: forbidden
  default_readable_form: canonical-markdown
  portable_metadata: separately-governed-optional-extension
  future_task: NKF-004
  may_add_or_suppress_governed_meaning: false
  required_for_consequential_interpretation: false

enforcement:
  schema:
    dialect: https://json-schema.org/draft/2020-12/schema
    paths:
      bundle: contracts/nkf/0.11/schemas/bundle.schema.json
      record: contracts/nkf/0.11/schemas/record.schema.json
      validation_result: contracts/nkf/0.11/schemas/validation-result.schema.json
    ids:
      bundle: urn:nkf:0.11:schema:bundle
      record: urn:nkf:0.11:schema:record
      validation_result: urn:nkf:0.11:schema:validation-result
    source_metadata:
      - nkf_version
      - markdown_path
      - markdown_digest
      - executable_path
      - executable_digest
    schema_self_digest_location: release-metadata
  layers:
    - json-schema
    - bundle-aware-checker
    - artifact-and-authority-resolver
    - human-semantic-review
  phases:
    - contracts
    - parse
    - schema
    - project
    - source
    - extension-resolution
    - bundle-graph
    - record-contract
    - security
    - authority-binding
    - result
  phase_states: [passed, failed, not-evaluated]
  unsafe_or_meaningless_later_phase: not-evaluated
  conformance_levels:
    structural:
      required_phases: [contracts, parse, schema, project, source, extension-resolution, bundle-graph, security]
      extension_scope: bundle-and-structurally-required-record-uses
    contract:
      includes: structural
      required_phases: [record-contract]
      extension_scope: requested-record
    full-bundle:
      includes: structural
      required_phases: [record-contract]
      record_scope: every-record
      extension_scope: every-record
  warnings_fail_native_conformance: false
  passing_secret_scan_proves_absence: false

diagnostics:
  shape:
    required_fields: [rule_id, severity, blocking, phase, message]
    optional_fields: [artifact, record_id, instance_pointer, source_section, remediation]
    fields:
      severity:
        enum: [error, warning]
      blocking:
        enum: [conformance, governing-use, none]
      phase:
        enum: [contracts, parse, schema, project, source, extension-resolution, bundle-graph, record-contract, security, authority-binding, result]
  stable_behavior: [rule_id, severity, blocking, semantic-trigger]
  non_stable_behavior: [message, remediation]
  warning_blocking: none
  optional_fields: omitted-not-null
  artifact_path: exact-project-relative-with-/
  sort_order: [phase, artifact, record-id, instance-pointer, source-section, rule-id]
  absent_optional_sort: first
  string_comparator: rfc8785-unsigned-utf16
  string_normalization: none
  string_case_folding: none
  complete_identity_duplicates: forbidden
  secret_or_copied_payload: forbidden
  implies_acceptance: false
