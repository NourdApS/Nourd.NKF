governed_validation_inputs:
  definition: exact-project-resources-whose-observed-state-participates-in-requested-validation
  ownership:
    core_defines_initial_set: true
    accepted_extensions_may_add_resource_kinds: true
    checker_ad_hoc_addition: forbidden
  contribution_aspects: [structural-state, exact-bytes]
  each_resource_contributes_only_applicable_validated_aspects: true
  core_initial_set:
    - fixed-.nourd-and-knowledge-structure-facts
    - exact-bundle-bytes-when-safely-readable
    - direct-declaration-directory-entry-facts
    - exact-safely-readable-.yaml-declaration-candidate-bytes
    - resolved-knowledge-root-and-recursive-markdown-paths-and-bytes
    - valid-declared-record-and-non-record-paths-including-missing-observations
    - valid-declared-technology-governed-artifact-paths-and-exact-bytes
    - examined-path-component-and-symlink-resolution-facts
    - project-contained-resources-added-by-involved-resolved-supported-extensions
  discovery:
    follows_phase_safety: true
    invalid_or_unsafe_path_traversal: forbidden
  excluded_unless_accepted_rule_adds:
    - validation-result-file
    - unrelated-.nourd-content
    - unreferenced-non-markdown-assets
    - external-authority-resources
    - operational-resources
  snapshot_inventory:
    identity: nkf.validation-snapshot
    nkf_version: "0.11"
    persisted: false
    closed: true
    required_fields: [contract, nkf_version, inputs]
    fields:
      contract:
        const: nkf.validation-snapshot
      nkf_version:
        const: "0.11"
      inputs:
        type: array
        order: exact-path-rfc8785-unsigned-utf16
        unique_by: exact-logical-path
        selector_merge: true
        items:
          closed: true
          required_fields: [path, direct_kind, resolution, resolved_path, final_kind, content_sha256]
          fields:
            path:
              type: string
              representation: exact-project-root-relative-with-/
            direct_kind:
              enum: [missing, regular-file, directory, symbolic-link, other]
            resolution:
              enum: [direct, contained, broken, cyclic, outside-project, outside-knowledge-root, not-applicable]
            resolved_path:
              type: [string, "null"]
              representation_when_present: exact-project-root-relative-with-/
            final_kind:
              enum: [regular-file, directory, other, "null"]
            content_sha256:
              type: [sha256, "null"]
              present_value_when: any-applicable-rule-validates-exact-bytes
    sorting:
      normalization: none
      case_folding: none
      comparator: rfc8785-unsigned-utf16
    canonicalization:
      encoding: UTF-8
      algorithm: rfc8785-jcs
    digest:
      algorithm: sha-256
      input: canonical-utf8-inventory
    persisted_result_fields: [algorithm, canonicalization, value, entry_count]

validation_result:
  identity: nkf.validation-result
  nkf_version: "0.11"
  path: .nourd/validation-result.json
  encoding:
    character_encoding: UTF-8
    bom: forbidden
    data_model: JSON
    root: one-object
    comments: forbidden
    duplicate_keys: forbidden
    non_json_values: forbidden
    member_order_semantic: false
    whitespace_semantic: false
  governed_knowledge: false
  inside_knowledge_root: false
  included_in_own_snapshot: false
  ordinarily_committed: false
  closed: true
  required_fields:
    - contract
    - nkf_version
    - execution
    - checker
    - contract_artifacts
    - request
    - bundle_id
    - profile
    - validated_snapshot
    - phases
    - conformance
    - records
    - governing_use
    - diagnostics
  fields:
    contract:
      const: nkf.validation-result
    nkf_version:
      const: "0.11"
    execution:
      ref: validation_result.execution
    checker:
      ref: validation_result.checker
    contract_artifacts:
      ref: validation_result.contract_artifacts
    request:
      ref: validation_result.request
    bundle_id:
      type: [common.identifier, "null"]
    profile:
      ref: validation_result.profile
    validated_snapshot:
      ref: validation_result.validated_snapshot
    phases:
      ref: validation_result.phases
    conformance:
      enum: [passed, failed]
    records:
      type: array
      unique_by: record_id
      order: exact-record-id-rfc8785-unsigned-utf16
      scope:
        structural: every-uniquely-identified-in-scope-record
        contract: only-uniquely-resolved-requested-record
        full-bundle: every-uniquely-identified-governed-record
        ambiguous_or_duplicate_identity: no-invented-or-merged-result
      items:
        ref: validation_result.record_result
    governing_use:
      enum: [ready, not-ready, not-evaluated]
    diagnostics:
      type: array
      items:
        ref: diagnostics.shape
      order: accepted-diagnostic-order
      complete_identity_duplicates: forbidden
  execution:
    closed: true
    required_fields: [id, runner, started_at, completed_at]
    fields:
      id:
        ref: common.lowercase_uuid
      runner:
        ref: common.portable_identity
      started_at:
        ref: common.utc_millisecond_timestamp
      completed_at:
        ref: common.utc_millisecond_timestamp
    completed_at_not_before_started_at: checker
  profile:
    closed: true
    required_fields: [identity, binding]
    fields:
      identity:
        type: [common.identifier, "null"]
      binding:
        enum: [verified, unsupported, not-evaluated]
    variants:
      verified:
        identity: supported-selectable-profile-identity
      unsupported:
        identity: present-non-null-unsupported-or-non-selectable-identity
      not-evaluated:
        identity: "null"
  checker:
    closed: true
    required_fields: [identity, digest]
    fields:
      identity:
        ref: common.portable_identity
      digest:
        ref: common.digest
    concrete_release_identity_and_digest: distribution-owned
  artifact_binding:
    closed: true
    required_fields: [expected_sha256, observed_sha256, binding]
    fields:
      expected_sha256:
        ref: common.digest.value
      observed_sha256:
        type: [common.digest.value, "null"]
      binding:
        enum: [verified, unavailable, mismatched]
    invariants:
      verified: observed-present-and-equals-expected
      unavailable: observed-null
      mismatched: observed-present-and-not-equal-expected
  schema_binding:
    extends: validation_result.artifact_binding
    required_additional_fields: [identity]
    fields:
      identity:
        type: string
        min_length: 1
  contract_artifacts:
    closed: true
    required_fields: [core, extensions]
    fields:
      core:
        closed: true
        required_fields: [specification, executable, schemas]
        fields:
          specification:
            ref: validation_result.artifact_binding
          executable:
            ref: validation_result.artifact_binding
          schemas:
            type: array
            exact_items_in_order:
              - identity: urn:nkf:0.11:schema:bundle
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.11:schema:record
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.11:schema:validation-result
                ref: validation_result.schema_binding
      extensions:
        type: array
        order: exact-extension-id-rfc8785-unsigned-utf16
        ambiguous_or_invalid_identity: forbidden
        items:
          closed: true
          required_fields: [id, specification, executable]
          fields:
            id:
              ref: extensions.identifier
            specification:
              ref: validation_result.artifact_binding
            executable:
              ref: validation_result.artifact_binding
  request:
    closed: true
    required_fields: [level, record_id, acceptance_binding]
    fields:
      level:
        enum: [structural, contract, full-bundle]
      record_id:
        type: [common.identifier, "null"]
      acceptance_binding:
        enum: [requested, not-requested]
    variants:
      structural:
        record_id: "null"
        acceptance_binding: not-requested
        persistence: transient
      contract:
        record_id: required-non-null
        target_resolution: exactly-one-uniquely-identified-governed-record
        unresolved_diagnostic: request.record.unresolved
        unresolved_record_result: omitted
        acceptance_binding: [requested, not-requested]
        persistence: transient
      full-bundle:
        record_id: "null"
        acceptance_binding: [requested, not-requested]
        persistence: replace-project-receipt
  validated_snapshot:
    closed: true
    required_fields: [algorithm, canonicalization, value, entry_count]
    fields:
      algorithm:
        const: sha-256
      canonicalization:
        const: rfc8785-jcs
      value:
        ref: common.digest.value
      entry_count:
        type: integer
        minimum: 0
  phases:
    type: array
    exact_items_in_order:
      - contracts
      - parse
      - schema
      - project
      - source
      - extension-resolution
      - bundle-graph
      - record-contract
      - security
      - authority-binding
      - result
    item:
      closed: true
      required_fields: [id, state]
      state: [passed, failed, not-evaluated]
    result_phase_state_in_emitted_result: passed
    inability_to_construct_valid_result: no-completed-result
    completed_conformance_failure: valid-result
  record_result:
    closed: true
    required_fields: [record_id, declared_governance, conformance, acceptance_binding, governing_use]
    fields:
      record_id:
        ref: common.identifier
      declared_governance:
        type: [record.governance, "null"]
      conformance:
        enum: [passed, failed, not-evaluated]
        meaning: requested-level-relative
      acceptance_binding:
        enum: [not-applicable, not-verified, verified, contradicted]
      governing_use:
        enum: [ready, not-ready, not-evaluated]
    invalid_governance:
      declared_governance: "null"
      acceptance_binding: not-verified
      governing_use: not-ready
  readiness:
    record:
      draft_superseded_retired: [not-applicable, not-ready]
      accepted_binding_unavailable_or_unperformed: [not-verified, not-evaluated]
      accepted_contradicted: [contradicted, not-ready]
      accepted_verified_conforming_unblocked: [verified, ready]
      any_conformance_or_governing_blocker: not-ready
    project_full_bundle:
      every_applicable_record_ready: ready
      any_record_not_ready: not-ready
      otherwise_any_record_not_evaluated: not-evaluated
    top_level:
      structural: not-evaluated
      contract:
        unique_target: target-record-governing-use
        missing_or_ambiguous_target: not-ready
      full-bundle: project-full-bundle-aggregate
  persistence:
    completed_full_bundle_replaces_previous: true
    failed_full_bundle_replaces_previous_pass: true
    structural_or_contract_write: forbidden
    atomic_replace: required
    local_history: none
    external_history: permitted
  currentness:
    nkf_verified_means: current-full-bundle-conformance-only
    requires:
      - matching-governed-validation-input-snapshot
      - current-core-specification-executable-and-schema-bindings
      - recognized-and-supported-checker-for-current-artifact-revision
    otherwise_status: verification-outdated
    outdated_receipt_remains: historical-operational-evidence
    universal_expiry: none
    external_authority_polling: none
    future_investigation: NKF-005
  excludes:
    - usernames
    - hostnames
    - absolute-project-paths
    - credentials
    - secrets
    - copied-operational-payloads
    - acceptance-assertion-from-conformance
    - realization-confirmation-from-conformance

release_distribution:
  initial_channel: github-release
  repository: "https://github.com/kaveh6202/Nourd.NKF.git"
  public_distribution: unresolved
  operational_state_authority: github
  manifest:
    identity: nkf.release-manifest
    nkf_version: "0.11"
    path: release-manifest.json
    encoding:
      character_encoding: UTF-8
      bom: forbidden
      data_model: JSON
      root: one-object
      comments: forbidden
      duplicate_keys: forbidden
      non_json_values: forbidden
      indentation_spaces: 2
      line_endings: LF
      final_lf: exactly-one
      trailing_whitespace: forbidden
      member_order: contract-order
    closed: true
    required_fields: [contract, nkf_version, source, checker, authority, schemas]
    fields:
      contract:
        const: nkf.release-manifest
      nkf_version:
        const: "0.11"
      source:
        ref: release_distribution.source
      checker:
        ref: release_distribution.checker
      authority:
        ref: release_distribution.authority
      schemas:
        ref: release_distribution.schemas
    omitted_fields:
      - manifest-self-digest
      - containing-archive-digest
      - asset-name
      - tag
      - release-url
      - publication-time
      - latest-status
      - mutable-github-state
  source:
    closed: true
    required_fields: [repository, release_commit, checker_confirmation]
    fields:
      repository:
        const: "https://github.com/kaveh6202/Nourd.NKF.git"
      release_commit:
        type: string
        pattern: '^[0-9a-f]{40}$'
      checker_confirmation:
        ref: release_distribution.checker_confirmation
  checker_confirmation:
    closed: true
    required_fields: [decision, path, digest, checker_source_commit]
    fields:
      decision:
        type: string
        pattern: '^ADR-[0-9]{4}$'
      path:
        type: string
        pattern: '^knowledge/decisions/[0-9]{4}-[a-z0-9]+(?:-[a-z0-9]+)*\.md$'
      digest:
        ref: common.digest
      checker_source_commit:
        type: string
        pattern: '^[0-9a-f]{40}$'
    decision_id_matches_path_prefix: packager-and-verifier
  checker:
    closed: true
    required_fields: [identity, path, digest, runtime]
    fields:
      identity:
        const: nourd-nkf-checker
      path:
        const: dist/nourd-nkf-checker.mjs
      digest:
        ref: common.digest
      runtime:
        ref: release_distribution.runtime
  runtime:
    closed: true
    required_fields: [name, minimum_major]
    fields:
      name:
        const: node
      minimum_major:
        const: 22
  authority:
    closed: true
    required_fields: [precedence, markdown, executable]
    fields:
      precedence:
        const: normative-markdown
      markdown:
        ref: release_distribution.markdown_artifact
      executable:
        ref: release_distribution.executable_artifact
  markdown_artifact:
    closed: true
    required_fields: [path, digest]
    fields:
      path:
        const: knowledge/specifications/nkf-0.11.md
      digest:
        ref: common.digest
  executable_artifact:
    closed: true
    required_fields: [path, digest]
    fields:
      path:
        const: contracts/nkf/0.11/nkf.yaml
      digest:
        ref: common.digest
  schema_artifact:
    closed: true
    required_fields: [identity, path, digest]
    fields:
      identity:
        type: string
      path:
        type: string
      digest:
        ref: common.digest
  schemas:
    type: array
    exact_items_in_order:
      - identity: urn:nkf:0.11:schema:bundle
        path: contracts/nkf/0.11/schemas/bundle.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.11:schema:record
        path: contracts/nkf/0.11/schemas/record.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.11:schema:release-manifest
        path: contracts/nkf/0.11/schemas/release-manifest.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.11:schema:validation-result
        path: contracts/nkf/0.11/schemas/validation-result.schema.json
        ref: release_distribution.schema_artifact
  schema:
    identity: urn:nkf:0.11:schema:release-manifest
    path: contracts/nkf/0.11/schemas/release-manifest.schema.json
    scope: release-package-enforcement-only
    project_declaration_schema: false
    governed_validation_input: false
    validation_result_contract_artifact: false
    self_digest_location: release-manifest
  archive:
    uploaded_distribution_asset_count: 1
    filename_pattern: '^nourd-nkf-sha256-[0-9a-f]{64}\.tar$'
    digest:
      algorithm: sha-256
      filename_value_must_equal_archive_digest: true
    format: ustar
    compression: none
    root: nourd-nkf
    entry_kind: regular-file-only
    explicit_directory_entries: forbidden
    entry_order: exact-ascii-path
    entries:
      - {path: contracts/nkf/0.11/nkf.yaml, mode: "0644"}
      - {path: contracts/nkf/0.11/schemas/bundle.schema.json, mode: "0644"}
      - {path: contracts/nkf/0.11/schemas/record.schema.json, mode: "0644"}
      - {path: contracts/nkf/0.11/schemas/release-manifest.schema.json, mode: "0644"}
      - {path: contracts/nkf/0.11/schemas/validation-result.schema.json, mode: "0644"}
      - {path: dist/nourd-nkf-checker.mjs, mode: "0755"}
      - {path: knowledge/specifications/nkf-0.11.md, mode: "0644"}
      - {path: release-manifest.json, mode: "0644"}
    forbidden:
      - symlink
      - hard-link
      - device
      - absolute-path
      - traversal
      - duplicate-path
      - case-colliding-path
      - unexpected-entry
    ustar:
      modification_time: 0
      uid: 0
      gid: 0
      user_name: ""
      group_name: ""
      link_name: ""
      magic_bytes_hex: "75 73 74 61 72 00"
      version_bytes_hex: "30 30"
      path_storage: name-field-only
      prefix_field: ""
      numeric_encoding: zero-padded-ascii-octal
      type_flag_byte_hex: "30"
      device_major: 0
      device_minor: 0
      file_size: derived-exact-byte-count
      header_checksum: derived-standard-ustar
      content_padding: zero-filled
      final_zero_blocks: 2
      trailing_bytes_after_final_blocks: forbidden
      base_256_numbers: forbidden
      pax_extensions: forbidden
  packaging:
    source_tree: clean-release-commit
    steps:
      - complete-accepted-development-check
      - build-checker-twice
      - verify-confirmed-checker-digest
      - verify-checker-confirmation-decision-path-digest-and-source-binding
      - verify-authority-and-schema-digests
      - construct-and-schema-validate-manifest
      - assemble-archive-twice
      - require-reproducible-checker-and-archive-digests
    failure_behavior: no-release-artifact
  consumer_pin:
    storage: consumer-dependency-or-tooling-configuration
    required_fields: [repository, archive-sha256]
    tag_and_asset_name: derived-from-archive-sha256
    cached_durable_locator: transport-only
    bundle_field: forbidden
    independently_trusted_archive_digest: required
  verification:
    order:
      - verify-archive-sha256
      - reject-unsafe-archive
      - strict-parse-manifest-and-bootstrap-fixed-contract-version-and-schema-entry
      - verify-release-manifest-schema-digest
      - compile-schema-and-validate-release-manifest
      - verify-other-manifest-bound-paths-and-digests
      - verify-checker-confirmation-provenance-when-evaluated
      - reject-missing-or-unexpected-file
      - invoke-checker
    failure:
      classification: execution-level
      checker_invocation: forbidden
      project_validation_result: forbidden
      nkf_verified_claim: forbidden
  github_release:
    uploaded_distribution_asset_count: 1
    github_generated_source_archives: excluded-non-distribution
    tag_pattern: '^release-sha256-[0-9a-f]{64}$'
    tag_digest_equals_archive_digest: true
    tag_target_equals_release_commit: true
    tag_kind: lightweight
    annotated_tag: forbidden
    preparation_state: draft
    publication_class: prerelease
    prepublication_reverification: required
    immutable_release_when_supported: should
    artifact_attestation:
      status: optional
      substitutes_for_archive_digest: false

security:
  prohibited:
    - live-credentials
    - access-tokens
    - private-keys
    - secrets
  scan_scope:
    byte_semantics: exact-utf8-source-bytes
    native_inputs:
      - .nourd/knowledge/bundle.yaml
      - every-direct-.yaml-declaration-candidate
      - every-recursive-markdown-under-knowledge-root
    governed_validation_inputs: true
    unsafe_path_following: forbidden
    additional_resource_kind_requires: accepted-extension-rule
  registry:
    matching: ascii-byte-case-sensitive
    exact_detector_classes:
      - complete-private-key-block
      - github-prefixed-token
      - openai-prefixed-token
    complete_private_key_block:
      header_form: five-hyphens-BEGIN-space-LABEL-five-hyphens
      footer_form: five-hyphens-END-space-same-LABEL-five-hyphens
      labels:
        - PRIVATE KEY
        - RSA PRIVATE KEY
        - EC PRIVATE KEY
        - DSA PRIVATE KEY
        - OPENSSH PRIVATE KEY
        - ENCRYPTED PRIVATE KEY
      ignored_between: [ascii-space, horizontal-tab, carriage-return, line-feed]
      remaining_alphabet: [A-Z, a-z, 0-9, +, /, =]
      minimum_remaining_bytes: 64
    github_prefixed_token:
      prefixes: [ghp_, gho_, ghu_, ghs_, ghr_]
      body_alphabet: [A-Z, a-z, 0-9]
      minimum_body_bytes: 36
      preceding_boundary_excludes: [A-Z, a-z, 0-9, _]
      following_boundary_excludes: [A-Z, a-z, 0-9]
    openai_prefixed_token:
      prefixes_longest_first: [sk-proj-, sk-]
      body_alphabet: [A-Z, a-z, 0-9, _, "-"]
      minimum_body_bytes: 20
      preceding_boundary_excludes: [A-Z, a-z, 0-9, _, "-"]
      following_boundary_excludes: [A-Z, a-z, 0-9, _, "-"]
  contextual_exemptions: none
  inline_ignore_or_allowlist: none
  nonmatching_placeholders:
    - "ghp_<REDACTED>"
    - "sk-..."
    - "${TOKEN}"
    - "<SECRET>"
  explicitly_nonblocking_without_additional_accepted_rule:
    - aws-access-key-identifier-alone
    - generic-password-looking-text
    - jwt
    - hash
    - digest
    - base64-string
    - entropy-finding
    - unregistered-provider-token
  diagnostic:
    rule_id: security.secret-pattern
    cardinality: at-most-one-per-logical-artifact
    severity: error
    blocking: conformance
    phase: security
    matched-value: forbidden
    surrounding-source: forbidden
    copied-payload: forbidden
  high_confidence_finding_fails_conformance: true
  passing_scan_proves_absence: false
  supplemental_scanners:
    native_result_participation: forbidden
    native_conformance_effect: forbidden
    accepted_namespaced_extension_rule: permitted
  registry_change_requires:
    - governed-nkf-decision
    - replacement-authority-pair
    - derived-fixtures-and-checker-update
    - governed-release
    - deliberate-consumer-migration
  sensitive_bundle_access_policy: out-of-scope

human_review:
  deterministic_validation_cannot_establish:
    - semantic-role-accuracy
    - responsibility-binding-accuracy
    - markdown-truth
    - markdown-adequacy
    - markdown-safety
    - governed-knowledge-completeness
    - evidence-support
    - deserved-acceptance
    - external-authority-currency
    - locator-currency
    - design-quality
    - realization-existence
    - realization-behavior
