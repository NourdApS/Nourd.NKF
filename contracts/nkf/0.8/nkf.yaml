          fields:
            relationship: {ref: vocabularies.graph_relationship_types}
            state: {enum: [reviewed, inapplicable]}
            basis: {ref: freshness.review_basis}
      applicability_coverage:
        type: array
        min_items: 1
        unique_by: [node, purpose]
        order: stable-node-reference-then-purpose-order
        exact_coverage: every-node-times-every-non-historical-purpose
        items:
          closed: true
          required_fields: [node, purpose, state, role, basis, revision, basis_digest, provenance]
          fields:
            node: {ref: common.node_reference}
            purpose: {enum: [change-impact, whole-root-readiness, consequential-use]}
            state: {enum: [eligible, inapplicable]}
            role: {enum: [governs, proposes, realizes, evidences, context, history]}
            basis: {ref: freshness.review_basis}
            revision: {ref: common.digest, binds: exact-judged-node-revision}
            basis_digest: {ref: common.digest, binds: exact-cited-basis-content-digest}
            provenance: {ref: freshness.judgment_provenance}
      decision_classifications:
        type: array
        unique_by: [decision, purpose]
        order: decision-id-then-purpose-order
        exact_coverage: every-accepted-decision-for-each-non-historical-purpose
        items: {ref: freshness.decision_classification}
      confirmation:
        closed: true
        required_fields: [reviewer, reviewed_at, claim, observations, limitations, disputed]
        optional_fields: [computed_closure, performed_set, transition]
        fields:
          reviewer:
            closed: true
            required_fields: [kind, id]
            fields:
              kind: {enum: [human, agent]}
              id: {type: string, min_length: 1}
          reviewed_at: {ref: common.utc_millisecond_timestamp}
          claim: {enum: [semantically-reviewed-whole-root, semantically-reviewed-delta, mechanically-concluded]}
          transition:
            closed: true
            required_fields: [task, from_state, to_state, predecessor_graph_revision]
            fields:
              task: {ref: common.identifier}
              from_state: {enum: [active, deferred, completed, cancelled]}
              to_state: {enum: [active, deferred, completed, cancelled]}
              predecessor_graph_revision: {ref: common.digest, binds: exact-concluded-from-baseline-graph-revision}
            required_exactly_when: claim-is-mechanically-concluded
          computed_closure:
            type: array
            unique_by: node
            order: stable-node-reference-order
            items: {ref: common.node_reference}
            required_exactly_when: claim-is-delta
          performed_set:
            type: array
            unique_by: node
            order: stable-node-reference-order
            items: {ref: common.node_reference}
            required_exactly_when: claim-is-delta
            admission: contains-computed-closure
          observations:
            type: array
            min_items: 1
            unique_by: id
            order: id-rfc8785-unsigned-utf16
            items: {ref: freshness.review_observation}
          limitations:
            type: array
            min_items: 1
            unique_items: true
            order: rfc8785-unsigned-utf16
            items: {type: string, min_length: 1}
          disputed: {type: boolean}
    confirmation:
      required_fields: [reviewer, reviewed_at, claim, observations, limitations, disputed]
      reviewer_kind: [human, agent]
      claim_enum: [semantically-reviewed-whole-root, semantically-reviewed-delta, mechanically-concluded]
      delta_claim_admission: performed-set-contains-tool-computed-closure
      mechanically_concluded_admission: graph-delta-from-bound-predecessor-baseline-is-exactly-the-closed-transition-vocabulary
      mechanically_concluded_judgments: all-carried-zero-performed
      mechanically_concluded_producer: deterministic-task-transition-only
      mechanically_concluded_semantic_provenance: nearest-predecessor-baseline-with-semantic-claim
      mechanically_concluded_reviewer: transition-operator
      observations_min_items: 1
      observations_exact_source_bound: true
      limitations_required: true
      disputed_const_for_ready: false
    relationship_coverage_states: [reviewed, inapplicable]
    applicability_coverage:
      every_node_and_non_historical_purpose: required
      states: [eligible, inapplicable]
      participation_roles: [governs, proposes, realizes, evidences, context, history]
      source_bound_basis: required
    semantic_completeness_from_checker: false
    invalid_states: [missing, outdated, disputed, ambiguous, coverage-incomplete, unsupported]
    invalid_result: unknown
    recovery: whole-root-semantic-review
    excluded_from_graph_revision: true
  receipt:
    contract: nkf.freshness-receipt
    nkf_version: "0.8"
    path_directory: .nourd/knowledge/freshness/receipts
    schema: urn:nkf:0.8:schema:freshness-receipt
    operational: true
    committed: false
    append_only: true
    id:
      prefix: freshness-
      hash: sha-256
      canonicalization: rfc8785-jcs
      input: every-field-except-id
    closed: true
    required_fields: [contract, nkf_version, id, context, result]
    fields:
      contract: {const: nkf.freshness-receipt}
      nkf_version: {const: "0.8"}
      id: {type: string, pattern: "^freshness-[0-9a-f]{64}$"}
      context: {ref: freshness.evaluation_context}
      result: {ref: freshness.evaluation_result}
    changed_input: makes-receipt-noncurrent-without-rewrite
    prohibited_content: [credentials, secrets, raw-external-payloads]
    excluded_from: [graph-revision, markdown-enumeration, conformance-unless-selected-as-input]
  readiness:
    states: [ready, not-ready, not-evaluated]
    purpose_rules:
      change-impact: [confirmed-current-graph-baseline, all-impact-selected-nodes-current, complete-applicable-decision-reconciliation, no-unresolved-conflict, no-pending-promotion-reconciliation, all-required-observations-and-reviews-bound]
      whole-root-readiness: [confirmed-current-graph-baseline, all-applicable-nodes-current, complete-applicable-decision-reconciliation, no-unresolved-conflict, no-pending-promotion-reconciliation, all-required-observations-and-reviews-bound]
      consequential-use: [confirmed-current-graph-baseline, all-target-closure-nodes-current, complete-applicable-decision-reconciliation, no-unresolved-conflict, no-pending-promotion-reconciliation, all-required-observations-and-reviews-bound]
      historical-reproduction: [selected-historical-receipt-binding-exact, receipt-inputs-reproduced, receipt-policy-and-evaluator-reproduced, no-current-baseline-required]
    distinct_from: [conformance, acceptance, authority-binding, realization-confirmation, governing-use]
    required_for: [task-completion-claim, candidate-sealing, release, adoption, declared-consequential-use]
  review_basis:
    closed: true
    required_fields: [node, source]
    fields:
      node: {ref: common.node_reference}
      source:
        one_of:
          - {closed: true, required_fields: [section], fields: {section: {ref: common.identifier}}}
          - {closed: true, required_fields: [heading], fields: {heading: {ref: common.heading_reference}}}
  source_binding:
    one_of:
      - {closed: true, required_fields: [kind, node, section], fields: {kind: {const: section}, node: {ref: common.node_reference, kind_in: [record, entity]}, section: {ref: common.identifier, resolves_to: source-node-owning-record-section}}}
      - {closed: true, required_fields: [kind, node, heading], fields: {kind: {const: heading}, node: {ref: common.node_reference, kind_const: document}, heading: {ref: common.heading_reference, resolves_to: source-document-heading}}}
  node_revision_entry:
    closed: true
    required_fields: [node, revision]
    fields:
      node: {ref: common.node_reference}
      revision: {ref: common.digest}
  normalized_edge:
    closed: true
    required_fields: [source, relationship, target, source_binding]
    fields:
      source: {ref: common.node_reference}
      relationship: {ref: vocabularies.graph_relationship_types}
      target: {ref: common.node_reference}
      source_binding: {ref: freshness.source_binding}
  review_observation:
    closed: true
    required_fields: [id, subject, basis, finding]
    fields:
      id: {ref: common.identifier}
      subject: {ref: common.node_reference}
      basis: {ref: freshness.review_basis}
      finding: {type: string, min_length: 1}
  decision_classification:
    closed: true
    required_fields: [decision, decision_digest, purpose, classification, basis, basis_digest, provenance]
    fields:
      decision: {ref: common.identifier, resolves_to: same-bundle-accepted-decision-record}
      decision_digest: {ref: common.digest, binds: exact-decision-declaration-digest-at-judgment}
      purpose: {enum: [change-impact, whole-root-readiness, consequential-use]}
      classification: {enum: [compatible, extends, supersedes, conflicts, not-applicable]}
      basis: {ref: freshness.review_basis}
      basis_digest: {ref: common.digest, binds: exact-cited-basis-content-digest-at-judgment}
      provenance: {ref: freshness.judgment_provenance}
  judgment_provenance:
    one_of:
      - {closed: true, required_fields: [performed], fields: {performed: {const: true}}}
      - closed: true
        required_fields: [carried]
        optional_fields: [transition]
        fields:
          carried:
            closed: true
            required_fields: [performed_in_graph_revision, performing_reviewer]
            fields:
              performed_in_graph_revision: {ref: common.digest}
              performing_reviewer: {ref: freshness.reviewer}
          transition:
            closed: true
            required_fields: [task, from_state, to_state]
            fields:
              task: {ref: common.identifier}
              from_state: {enum: [active, deferred, completed, cancelled]}
              to_state: {enum: [active, deferred, completed, cancelled]}
    carry_preconditions:
      - judged-node-revision-unchanged
      - basis-digest-unchanged
      - every-depended-rule-identical-under-accepted-version-delta-declaration
      - decision-declaration-digest-unchanged-for-decision-classifications
    conclusion_carry_preconditions:
      - node-source-digest-unchanged
      - every-judgment-basis-digest-unchanged
      - only-changed-revision-input-is-the-declared-state-value
      - every-depended-rule-identical-under-accepted-version-delta-declaration
      - transition-binding-recorded
    conclusion_carry_scope: exactly-the-transitioned-task-node-within-one-deterministic-transition
    depended_rules: policy-declared-judgment-dependencies-by-judgment-kind
    computed_by: tool-only
    reviewer_asserted_carry: forbidden
    failed_precondition: refuse
  reason_path:
    closed: true
    required_fields: [initial_change, target, nodes, relationships]
    fields:
      initial_change: {ref: freshness.changed_input}
      target: {ref: common.node_reference}
      nodes: {type: array, min_items: 1, items: {ref: common.node_reference}, order_semantic: true}
      relationships: {type: array, items: {ref: vocabularies.graph_relationship_types}, order_semantic: true}
    node_count_equals_relationship_count_plus_one: true
    first_node_matches_initial_change_when-node-kind: true
    last_node_equals_target: true
  cycle:
    closed: true
    required_fields: [nodes, relationships]
    fields:
      nodes: {type: array, min_items: 2, unique_items: true, items: {ref: common.node_reference}, order: canonical-minimum-rotation}
      relationships: {type: array, min_items: 2, items: {ref: vocabularies.graph_relationship_types}, order: follows-nodes}
    counts_equal: true
    canonical_rotation: lowest-whole-cycle-jcs-rfc8785-unsigned-utf16
  unknown:
    closed: true
    required_fields: [rule, subject]
    optional_fields: [node]
    fields:
      rule: {type: string, min_length: 1}
      subject: {type: string, min_length: 1}
      node: {ref: common.node_reference}
  observation:
    closed: true
    required_fields: [id, kind, subject, observed_revision, observed_at]
    fields:
      id: {ref: common.identifier}
      kind: {enum: [external, authority]}
      subject: {type: string, min_length: 1, resolves_by-kind: external-dependency-observation-id-or-authority-input-observation-id}
      observed_revision: {type: string, min_length: 1}
      observed_at: {ref: common.utc_millisecond_timestamp}
    external_observation_id_equals_dependency_observability_id: true
    external_observed_revision_compares_to_dependency_exact_revision: true
    authority_observation_id_equals_authority_input_observation_id: true
    authority_observed_revision_compares_to_authority_input_expected_revision: true
  evaluation_context:
    closed: true
    required_fields: [bundle, profile, baseline_graph_revision, candidate_graph_revision, evaluator, policy, purpose, candidate_universe, changed_inputs, targets, observations, baseline_state]
    optional_fields: [evaluation_time, historical_receipt]
    fields:
      bundle: {ref: common.identifier}
      profile: {enum: [nkf.profile.product, nkf.profile.technology]}
      baseline_graph_revision: {type: [common.digest, "null"]}
      candidate_graph_revision: {ref: common.digest}
      evaluator:
        closed: true
        required_fields: [id, digest]
        fields:
          id: {type: string, min_length: 1}
          digest: {ref: common.digest}
      policy:
        closed: true
        required_fields: [id, digest]
        fields:
          id: {const: nkf.freshness-policy.0.8}
          digest: {ref: common.digest}
      purpose: {enum: [change-impact, whole-root-readiness, consequential-use, historical-reproduction]}
      candidate_universe: {type: array, min_items: 1, unique_items: true, order: stable-node-reference-order, items: {ref: common.node_reference}}
      changed_inputs: {type: array, unique_items: true, order: stable-input-reference-order, items: {ref: freshness.changed_input}}
      targets: {type: array, unique_items: true, order: stable-node-reference-order, items: {ref: common.node_reference}}
      observations: {type: array, unique_by: id, order: id-rfc8785-unsigned-utf16, items: {ref: freshness.observation}}
      baseline_state: {enum: [confirmed, missing, outdated, disputed, ambiguous, coverage-incomplete, unsupported, not-evaluated]}
      evaluation_time: {ref: common.utc_millisecond_timestamp}
      historical_receipt: {type: string, pattern: "^freshness-[0-9a-f]{64}$"}
    constraints:
      expiry_requires_evaluation_time: true
      historical_reproduction_requires_historical_receipt: true
      other_purposes_forbid_historical_receipt: true
  changed_input:
    one_of:
      - {closed: true, required_fields: [kind, node], fields: {kind: {const: node}, node: {ref: common.node_reference}}}
      - {closed: true, required_fields: [kind, id], fields: {kind: {const: governed-artifact}, id: {ref: common.identifier}}}
      - {closed: true, required_fields: [kind, edge], fields: {kind: {const: authored-edge}, edge: {ref: freshness.normalized_edge}}}
      - {closed: true, required_fields: [kind, id], fields: {kind: {const: external-dependency}, id: {ref: common.identifier, resolves_to: same-bundle-external-dependency}}}
      - {closed: true, required_fields: [kind, id], fields: {kind: {const: authority-input}, id: {ref: common.identifier, resolves_to: same-bundle-authority-input}}}
      - {closed: true, required_fields: [kind, id], fields: {kind: {enum: [external-observation, authority-observation]}, id: {ref: common.identifier, resolves-by-kind: true}}}
  evaluation_result:
    closed: true
    required_fields: [projections, nodes, impact, cycles, decision_classifications, reviews, unknowns, readiness]
    fields:
      projections:
        closed: true
        required_fields: [full, applicable, current]
        fields:
          full: {type: array, unique_items: true, order: stable-node-reference-order, items: {ref: common.node_reference}}
          applicable: {type: array, unique_items: true, order: stable-node-reference-order, items: {ref: common.node_reference}}
          current: {type: array, unique_items: true, order: stable-node-reference-order, items: {ref: common.node_reference}}
        applicable_subset_of: full
        current_subset_of: applicable
      nodes: {type: array, order: stable-node-reference-order, items: {ref: validation_result.node_result}}
      impact:
        closed: true
        required_fields: [selected, reason_paths]
        fields:
          selected: {type: array, unique_items: true, order: stable-node-reference-order, items: {ref: common.node_reference}}
          reason_paths: {type: array, unique_items: true, order: shortest-then-whole-entry-jcs-rfc8785-unsigned-utf16, items: {ref: freshness.reason_path}}
      cycles: {type: array, unique_items: true, order: whole-entry-jcs-rfc8785-unsigned-utf16, items: {ref: freshness.cycle}}
      decision_classifications: {type: array, unique_by: [decision, purpose], order: decision-id-then-purpose-order, items: {ref: freshness.decision_classification}}
      reviews: {type: array, unique_by: id, order: id-rfc8785-unsigned-utf16, items: {ref: freshness.review_observation}}
      unknowns: {type: array, unique_items: true, order: whole-entry-jcs-rfc8785-unsigned-utf16, items: {ref: freshness.unknown}}
      readiness: {ref: validation_result.readiness_result}
    constraints:
      nodes_exact_coverage: evaluation-context-candidate-universe
      projection_membership_equals_node-results: true
      impact_selected_equals_node-impact-selected: true
      impact_reason_paths_equal_node-reason-paths: true
      decision_classifications_exact_required_coverage: true
      cycles_exact_detected_coverage: true

version_delta_declaration:
  contract: nkf.version-delta
  path: contracts/nkf/0.8/version-delta.yaml
  part_of: accepted-authority-set
  digest_bound: true
  closed: true
  required_fields: [contract, nkf_version, predecessor_version, predecessor_executable_digest, rules]
  fields:
    contract: {const: nkf.version-delta}
    nkf_version: {const: "0.8"}
    predecessor_version: {const: "0.71"}
    predecessor_executable_digest: {ref: common.digest, binds: exact-predecessor-executable-companion}
    rules:
      type: mapping
      key: rule-identifier
      exact_coverage: union-of-predecessor-and-current-rule-registries
      value:
        closed: true
        required_fields: [classification]
        optional_fields: [transform, renamed_from]
        fields:
          classification: {enum: [identical, mechanically-transformable, semantically-new]}
          transform:
            type: string
            min_length: 1
            required_exactly_when: classification-is-mechanically-transformable
            content: exact-named-transformation-and-proof-obligation
          renamed_from:
            type: string
            min_length: 1
            resolves_to: exact-predecessor-rule-identifier
      registry_only_rule_without_renamed_from: semantically-new
  seeded_by: deterministic-registry-diff
  non_identical_classifications_judged_by: named-reviewer
  accepted_with: authority-pair-acceptance
  updater_behavior:
    derives_permitted_actions: from-this-declaration-alone
    absent_incomplete_ambiguous_or_unsupported: refuse
  classifies: rules-never-knowledge-semantics

body_contracts:
  nkf.technology:
    type: technology
    required_responsibilities: [technology-definition, purpose-and-problem, consumers-and-use-contexts, capabilities-and-contracts, scope-authority-and-boundaries, technology-map, versioning-compatibility-and-migration, distribution-support-and-security, evolution-and-retirement]
    lifecycle:
      required: living
    unique_profile_root: true
  nkf.specification:
    type: specification
    required_responsibilities: [specification-definition, authority-and-normative-status, scope-and-applicability, model-vocabulary-and-semantics, requirements-constraints-and-interfaces, validation-and-conformance, versioning-compatibility-and-migration, security-authority-and-operational-boundaries, unresolved-and-deferred-matters]
    governance:
      accepted_lifecycle: immutable
    required_by_profile: [nkf.profile.technology]
  nkf.product:
    type: product
    required_responsibilities: [product-definition, purpose, vision, people-served, needs-and-outcomes, boundaries, product-map]
    lifecycle:
      required: living
    unique_profile_root: true
  nkf.principle:
    type: principle
    required_responsibilities: [principle-statement, rationale, applicability, required-behaviour, boundaries, decision-and-trade-off-implications]
  nkf.concept:
    type: concept
    required_responsibilities: [definition, purpose-and-product-relevance, distinguishing-characteristics, inclusion-exclusion-and-ambiguity-boundaries, product-and-knowledge-relationships, current-maturity]
  nkf.journey:
    type: journey
    required_responsibilities: [purpose-and-desired-outcome, actors-and-beneficiaries, trigger-and-operating-context, start-end-and-scope-boundaries, meaningful-stages-decisions-and-transitions, needs-expectations-and-consequential-moments, success-failure-interruption-and-recovery, related-domains-and-capabilities]
  nkf.domain:
    type: domain
    required_responsibilities: [responsibility-and-product-purpose, value-and-people-served, scope-and-boundaries, owned-concepts-and-semantic-entities, capability-map, dependencies-interfaces-and-external-authority, obligations-risks-and-measures]
    hierarchy:
      part_of: product
      ultimately_reaches: product
  nkf.capability:
    type: capability
    required_responsibilities: [ability-statement, people-actors-and-outcomes, conditions-inputs-and-resulting-outcome, scope-and-non-capability-boundaries, governing-constraints-and-authority, dependencies-and-related-journeys, success-and-failure-conditions]
    hierarchy:
      part_of_exactly_one: domain
  nkf.design:
    type: design
    required_responsibilities: [design-kind-problem-and-scope, governing-inputs-and-constraints, proposed-direction, responsibilities-interactions-and-information-flows, alternatives-and-trade-offs, failure-safety-recovery-and-operations, validation-and-decision-evidence, unresolved-matters]
  nkf.decision:
    type: decision
    required_responsibilities: [context-and-problem, decision, scope-and-applicability, rationale, alternatives-considered, consequences-and-trade-offs]
    governance:
      accepted_lifecycle: immutable
  nkf.realization:
    type: realization
    required_responsibilities: [realization-identity-and-kind, governed-meaning-realized, durable-mapping, responsibilities-and-ownership-boundaries, interfaces-dependencies-locators-and-resolution, external-authority-and-operational-state-boundaries, compatibility-verification-and-recovery]
  nkf.evidence:
    type: evidence
    required_responsibilities: [question-claim-or-decision-context, sources-or-primary-observation-method, observations-and-findings, interpretation, limitations-and-uncertainty, applicability-and-boundaries, relevance-to-governed-knowledge]
    provenance_minimum:
      any_of: [provenance.sources, provenance.primary_observation]

hierarchy:
  record_part_of:
    acyclic: true
    profile_rules:
      nkf.profile.product:
        product_parent: forbidden
        domain_parent: product
        domain_ultimately_reaches: product
        capability_parent_exactly_one: domain
        other_type_participation: forbidden
      nkf.profile.technology:
        participation: forbidden
  every_record_scope_root: bundle.root.record
  hierarchy_participants_reach_root: true
  product_native_required_participants: [domain, capability]
  root_scope_creates_part_of: false

extensions:
  executable_identity: nkf.extension
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9]*(?:\\.[a-z](?:[a-z0-9-]*[a-z0-9])?){2,}$"
    reserved_first_namespace: nkf
    independent_version: forbidden
  core_supported_set: []
  authority_pair:
    markdown_precedence: true
    digest_bound: true
    required_executable_fields:
      - contract
      - nkf_version
      - id
      - application_sites
      - payload_shape
      - vocabularies
      - constraints
      - deterministic_validation
  catalog:
    type: array
    min_items_when_present: 1
    unique_by: id
    items:
      closed: true
      required_fields: [id, specification, executable]
      fields:
        id:
          ref: extensions.identifier
        specification:
          ref: extensions.artifact_reference
        executable:
          ref: extensions.artifact_reference
    artifacts_require:
      - exact-digest-resolution
      - executable-extension-id-match
      - executable-nkf-version-match
  artifact_reference:
    closed: true
    required_fields: [locator, digest]
    fields:
      locator:
        type: string
        min_length: 1
      digest:
        ref: common.digest
  support_requires:
    - resolve-specification
    - resolve-executable
    - verify-both-digests
    - verify-identity
    - verify-nkf-version
    - recognize-exact-executable-digest
    - implement-all-required-boundaries
  use:
    any_use_requires_non_empty_bundle_catalog: true
    contract_resolves_uniquely_through_catalog: true
    unique_by_contract_within_application_site: true
    order_semantic: false
    required_when_needed_for:
      - type
      - body-contract
      - authority
      - responsibility
      - relationship
      - governing-meaning
      - consequential-use
    namespaced_type_or_body_contract_requires_owner: true
    optional_may_supply_only:
      - nonessential-display
      - discovery
      - interoperability
      - advisory-data
  required_unsupported: fail-conformance-and-governing-use
  required_payload_invalid: fail-conformance
  optional_unsupported: preserve-report-unvalidated-and-continue-core
  supported_optional_payload_invalid: fail-conformance
  core_conflict: fail
  round_trip:
    json_data_model_loss: forbidden
    comments_required: false
    anchors_required: false
    aliases_required: false
    scalar_style_required: false
    whitespace_required: false
    key_order_required: false
    unable_to_preserve: read-only-or-fail

acceptance:
  universal_core_proof_field: none
  declarations_prove_acceptance: false
  verification:
    optional_operation: true
    required_evidence:
      - authoritative-event-or-immutable-decision-exists
      - actor-has-declared-authority
      - outcome-matches-claimed-status
      - exact-bundle-and-record-bound
      - exact-markdown-digest-bound
      - exact-declaration-revision-or-digest-bound
      - not-superseded-revoked-or-contradicted
    unavailable_result: not-verified
    conflicting_result: contradicted
  independent_axes:
    - declared-governance
    - acceptance-binding-verification
    - nkf-conformance
    - realization-confirmation
  governing_use_ready_requires:
    - applicable-accepted-status
    - acceptance-binding-verified
    - required-conformance-passed
    - no-governing-use-blocker

presentation:
  native_record_field: forbidden
  default_readable_form: canonical-markdown
  portable_metadata: separately-governed-optional-extension
  future_task: NKF-004
  may_add_or_suppress_governed_meaning: false
  required_for_consequential_interpretation: false

enforcement:
  schema:
    dialect: https://json-schema.org/draft/2020-12/schema
    paths:
      bundle: contracts/nkf/0.8/schemas/bundle.schema.json
      record: contracts/nkf/0.8/schemas/record.schema.json
      graph_baseline: contracts/nkf/0.8/schemas/graph-baseline.schema.json
      freshness_receipt: contracts/nkf/0.8/schemas/freshness-receipt.schema.json
      freshness_policy: contracts/nkf/0.8/schemas/freshness-policy.schema.json
      validation_result: contracts/nkf/0.8/schemas/validation-result.schema.json
    ids:
      bundle: urn:nkf:0.8:schema:bundle
      record: urn:nkf:0.8:schema:record
      graph_baseline: urn:nkf:0.8:schema:graph-baseline
      freshness_receipt: urn:nkf:0.8:schema:freshness-receipt
      freshness_policy: urn:nkf:0.8:schema:freshness-policy
      validation_result: urn:nkf:0.8:schema:validation-result
    source_metadata:
      - nkf_version
      - markdown_path
      - markdown_digest
      - executable_path
      - executable_digest
    schema_self_digest_location: release-metadata
  layers:
    - json-schema
    - bundle-aware-checker
    - artifact-and-authority-resolver
    - human-semantic-review
  phases:
    - contracts
    - parse
    - schema
    - project
    - source
    - extension-resolution
    - bundle-graph
    - knowledge-graph
    - record-contract
    - freshness
    - security
    - authority-binding
    - result
  phase_states: [passed, failed, not-evaluated]
  unsafe_or_meaningless_later_phase: not-evaluated
  conformance_levels:
    structural:
      required_phases: [contracts, parse, schema, project, source, extension-resolution, bundle-graph, knowledge-graph, security]
      extension_scope: bundle-and-structurally-required-record-uses
    contract:
      includes: structural
      required_phases: [record-contract]
      extension_scope: requested-record
    full-bundle:
      includes: structural
      required_phases: [record-contract, freshness]
      record_scope: every-record-and-document-node
      extension_scope: every-record
  warnings_fail_native_conformance: false
  passing_secret_scan_proves_absence: false

identity_bullet_labels:
  closed: true
  case_insensitive: true
  bullet_forms: ["- **<label>:**", "- **<label>**"]
  labels:
    - Task
    - Status
    - Owner
    - Decision Authority
    - Design Disposition
    - Repository
    - Related Tasks
    - Version
    - Adopting Decision
    - Proposal Authority Effect
    - Proposal Evidence
    - Implementation Evidence
  evidence_scanned: false
  prose_restatement_detection: human-review

deep_link_references:
  closed: true
  applies_to: non-evidence-bodies
  exempt: [headings, code-fences, existing-links, self-document]
  grammars:
    - text form "ADR NNNN" naming a same-bundle decision record adr-NNNN
    - code span holding a same-bundle record identifier
    - text or code-span token equal to a same-bundle task identifier
  destination: referenced-document-exact-source-path
  prose_restatement_detection: human-review

guidance_versioning:
  marker_line_prefix: "NKF Version: "
  declared_version_must_equal_bundle: true
  absent_file: not-checked
  checked_paths:
    - .agents/skills/nkf-authoring/SKILL.md
    - .agents/skills/nkf-onboarding/SKILL.md
    - .claude/skills/nkf-authoring/SKILL.md
    - .claude/skills/nkf-onboarding/SKILL.md
    - integrations/ai/nkf-authoring-protocol.md
    - integrations/onboarding/nkf-onboarding-protocol.md
  # A guidance file's frontmatter description describes that file, so a version
  # literal there is a self-description and must be true. The body is
  # deliberately out of scope: window tables and stepping-stone chains name
  # earlier versions on purpose, and certifying prose agreement is not
  # something deterministic evaluation can do.
  self_description:
    scope: frontmatter-description-only
    frontmatter_delimiter: "---"
    key: description
    # A closed grammar, not a placeholder: two implementers must agree on the
    # exact literal form without consulting a reference implementation.
    version_literal_pattern: '\bNKF ([0-9]+\.[0-9]+)\b'
    pattern_syntax: ecma262-unicode
    pattern_case_sensitive: true
    captured_group: 1
    # The value may span lines. It is resolved by the YAML scalar the key
    # carries, so a block scalar or a quoted continuation is one value and is
    # matched whole; the surrounding frontmatter is never scanned.
    multi_line_value: resolved-as-one-yaml-scalar
    all_matches_checked: true
    must_equal_bundle: true
    body: not-checked
    absent_frontmatter: not-checked
    absent_key: not-checked
    absent_version_literal: not-checked
    checked_paths: {ref: guidance_versioning.checked_paths}
  # Every emitted guidance member is derived; none is ever an input to
  # producing another. This is the mechanical half of the correction, and it
  # certifies only that the version stated is this version.
  derivation:
    source: single-version-neutral-authored-source
    source_root: guidance-source
    source_manifest: guidance-source/manifest.yaml
    derived_member_classes: [authoring-protocol, onboarding-protocol, release-protocol, adoption-protocol, portable-skill, host-adapter-instruction]
    source_may_state_literal_version: false
    version_supplied_by: emission-target-only
    emitted_member_as_input: forbidden
    reproducible_from: [authored-source, target-version]
    # Scoped to versions produced under this rule. Versions published before
    # it are frozen bytes that no derivation reproduces, and claiming
    # otherwise would be false against the published NKF 0.71 set.
    regeneration_reproduces_exact_bytes_for: versions-published-under-this-contract
    predecessor_versions_published_before_this_contract: frozen-not-derived
    committed_bytes_differ_from_derivation: invalid
    proves_current_rule_meaning: false

