      id: {ref: common.identifier}
      authority: {type: string, min_length: 1}
      subject: {ref: common.node_reference}
      source_binding: {ref: freshness.source_binding, node_equals: subject}
      expected_revision: {type: string, min_length: 1}
      observation_id: {ref: common.identifier}
    id_unique_scope: bundle-authority-inputs
    observation_id_unique_scope: bundle-external-dependency-and-authority-input-observations
    native_network_resolution: forbidden
    contributes_to_graph_revision: exact-complete-normalized-entry
    changed_entry_initial_change: subject-node
  knowledge_graph:
    closed: true
    required_fields: [policy, baseline]
    fields:
      policy: {const: nkf.freshness-policy.0.8}
      baseline:
        const: .nourd/knowledge/freshness/baseline.yaml
  governed_artifact:
    closed: true
    required_fields: [id, kind, path, digest, record, source_section]
    fields:
      id:
        ref: common.identifier
      kind:
        enum: [executable-contract, schema, checker-source, test, fixture, build-tool, project-configuration]
      path:
        ref: paths.project_relative_file
        must_exist: true
        file_kind: regular-file
        must_be_outside_nourd: true
      digest:
        ref: common.digest
      record:
        ref: common.identifier
        resolves_to: same-bundle-realization-record
      source_section:
        ref: common.identifier
        resolves_to: governed-artifact-record-section
    unique_by: [id, lexical-path, resolved-physical-file, exact-entry]
    exact_bytes_in_validated_snapshot: true
    binding_integrity_proves_realization: false
  constraints:
    exactly_one_profile_root: true
    exactly_one_selectable_profile: true
    common_profile_selectable: false
    portable_topology_required: true
    every_markdown_exactly_one_representation: true
    non_markdown_enumeration_required: false
    non_markdown_enumeration_permitted: true
    array_order_semantic: false

paths:
  project_root:
    definition: directory-directly-containing-.nourd
