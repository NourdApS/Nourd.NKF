freshness:
  declaration:
    closed: true
    optional_fields: [expires_at, invalidation_triggers]
    at_least_one: [expires_at, invalidation_triggers]
    fields:
      expires_at: {ref: common.utc_millisecond_timestamp}
      invalidation_triggers:
        type: array
        min_items: 1
        unique_by: id
        order_semantic: false
        items:
          closed: true
          required_fields: [id, kind, subject, source_binding]
          fields:
            id: {ref: common.identifier}
            kind: {enum: [source-changed, artifact-changed, external-observation, authority-observation, manual]}
            subject: {type: string, min_length: 1}
            source_binding: {ref: freshness.source_binding}
          kind_subject_resolution:
            source-changed: same-bundle-node-reference-encoded-as-jcs
            artifact-changed: same-bundle-governed-artifact-id
            external-observation: same-bundle-external-dependency-observation-id
            authority-observation: same-bundle-authority-input-observation-id
            manual: exact-request-observation-id
    computed_result_authority: false
  graph:
    candidate_universe: all-record-document-and-entity-nodes
    cross_bundle_nodes: unsupported
    authored_edge_direction: canonical-semantic-direction
    authored_inverse: forbidden
    generated_inverses: required-when-policy-defines
    identity_from_path: forbidden
    external_url_as_identity: forbidden
  revisions:
    hash: sha-256
    canonicalization: rfc8785-jcs
    record_node:
      jcs_input:
        closed: true
        required_fields: [kind, id, source_sha256, declaration]
        fields:
          kind: {const: record}
          id: {ref: common.identifier}
          source_sha256: {ref: common.digest.value}
          declaration:
            closed: true
            optional_fields: [type, body_contract, title, governance, scope, sections, relationships, provenance, external_authorities, entities, entity_relationships, bindings, task, design_disposition, design_decisions, superseded_by, withdrawal_source, proposal_authority_effect, proposal_evidence, implementation_evidence, confirmation_status, confirmation_decisions, unconfirmed_scope, freshness, extensions]
      excluded_declaration_fields: [contract, id, source, legacy_lock, accepted_bootstrap_lock, prepublication_supersession_lock]
    document_node:
      jcs_input:
        closed: true
        required_fields: [kind, id, source_sha256, declaration]
        fields:
          kind: {const: document}
          id: {ref: common.identifier}
          source_sha256: {ref: common.digest.value}
          declaration:
            closed: true
            optional_fields: [kind, state, relationships, freshness, owner, decision_authority, related_tasks]
      excluded_fields: [path, stable_path, digest, reason, legacy_lock]
    entity_node:
      jcs_input:
        closed: true
        required_fields: [kind, record, entity, record_revision, declaration]
        fields:
          kind: {const: entity}
          record: {ref: common.identifier}
          entity: {ref: common.identifier}
          record_revision: {ref: common.digest.value}
          declaration: {ref: record.entity}
    graph:
      jcs_input:
        closed: true
        required_fields: [contract, nkf_version, bundle, profile, nodes, edges, external_dependencies, authority_inputs, policy]
        fields:
          contract: {const: nkf.graph-revision}
          nkf_version: {const: "0.8"}
          bundle: {ref: common.identifier}
          profile: {enum: [nkf.profile.product, nkf.profile.technology]}
          nodes: {type: array, unique_by: node, order: node-reference-jcs-by-rfc8785-unsigned-utf16, items: {ref: freshness.node_revision_entry}}
          edges: {type: array, unique_items: true, order: whole-entry-jcs-by-rfc8785-unsigned-utf16, items: {ref: freshness.normalized_edge}}
          external_dependencies: {type: array, unique_by: id, order: whole-entry-jcs-by-rfc8785-unsigned-utf16, items: {ref: bundle.external_dependency}}
          authority_inputs: {type: array, unique_by: id, order: whole-entry-jcs-by-rfc8785-unsigned-utf16, items: {ref: bundle.authority_input}}
          policy:
            closed: true
            required_fields: [id, sha256]
            fields:
              id: {const: nkf.freshness-policy.0.8}
              sha256: {ref: common.digest.value}
      exclude: [baseline, receipts, generated-navigation, backlinks, virtual-frontmatter, validation-results]
    array_normalization:
      preserve_declared_order: [record.sections, section.heading_path, provenance.sources, body-contract-arrays-explicitly-declared-ordered]
      every_other_projection_array: sort-item-jcs-by-rfc8785-unsigned-utf16-after-exact-duplicate-rejection
      string_normalization: none-beyond-field-contract
      optional_absence: omit-not-null
  policy:
    identity: nkf.freshness-policy.0.8
    path: contracts/nkf/0.8/freshness-policy.yaml
    digest:
      algorithm: sha-256
      value: a870dc037364776b927e93705655d3f4572407c65852c4e5a258aa7d5bafe4a4
    schema: urn:nkf:0.8:schema:freshness-policy
    closed: true
    required_fields: [contract, nkf_version, id, classes, purposes, mappings]
    optional_fields: [hard_events, historical_projection, unknown_mapping, repository_overrides, implementation_heuristics]
    field_contracts:
      contract: {const: nkf.freshness-policy}
      nkf_version: {const: "0.8"}
      id: {const: nkf.freshness-policy.0.8}
      classes: {exact_items_in_order: [hard, review, context, historical]}
      purposes: {exact_items_in_order: [change-impact, whole-root-readiness, consequential-use, historical-reproduction]}
      hard_events: {exact_items_in_order: [exact-revision-binding-mismatch, governed-artifact-binding-mismatch]}
      mappings:
        type: array
        exact_relationship_coverage: vocabularies.graph_relationship_types
        unique_by: relationship
        item:
          closed: true
          required_fields: [relationship, source_kinds, target_kinds, propagation, class, purposes]
          fields:
            relationship: {ref: vocabularies.graph_relationship_types}
            source_kinds: {type: array, min_items: 1, unique_items: true, items: {enum: [record, document, entity]}, equals: relationship-allowed-source-kinds}
            target_kinds: {type: array, min_items: 1, unique_items: true, items: {enum: [record, document, entity]}, equals: relationship-allowed-target-kinds}
            propagation: {enum: [source-to-target, target-to-source, both, none]}
            class: {enum: [review, context]}
            purposes: {type: array, min_items: 1, unique_items: true, order: policy-purpose-order}
      historical_projection:
        exact: {includes_all_authored_relationships: true, impact_expansion: false}
      unknown_mapping: {const: fail-closed}
      repository_overrides: {const: forbidden}
      implementation_heuristics: {const: forbidden}
    classes: [hard, review, context, historical]
    purposes: [change-impact, whole-root-readiness, consequential-use, historical-reproduction]
    hard_limit: exact-revision-or-governed-artifact-binding-mismatch-only
    unknown_mapping: fail-closed
    repository_override: forbidden
    implementation_heuristic: forbidden
  evaluation:
    context_required: [bundle, profile, baseline_graph_revision, candidate_graph_revision, evaluator, policy, purpose, candidate_universe, changed_inputs, targets, observations, baseline_state]
    evaluation_time:
      required_only_when_expiry_applies: true
      format: common.utc_millisecond_timestamp
    axes:
      applicability: [applicable, not-applicable, unknown]
      participation_role: [governs, proposes, realizes, evidences, context, history]
