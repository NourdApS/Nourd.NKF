  markdown_path: knowledge/specifications/nkf-0.8.md
  executable_path: contracts/nkf/0.8/nkf.yaml
  freshness_policy_path: contracts/nkf/0.8/freshness-policy.yaml
  version_delta_path: contracts/nkf/0.8/version-delta.yaml
  markdown_digest:
    algorithm: sha-256
    value: 6a5c571d6dcc1a00c52467095e8835458d829c67e5c9e72f9363fe66cec2982e
  freshness_policy_digest:
    algorithm: sha-256
    value: 7cfb1b40a8b6f86543cb7b6016c6e9b2c1159d2a748c1915d0e9bf51bb82afd4
  version_delta_digest:
    algorithm: sha-256
    value: cc17f23a44afcf56b107f3e76e4d761779a4225bd2f8955c51d9781193c9c8b9
  accepted_baseline:
    markdown_path: knowledge/specifications/nkf-0.71.md
    markdown_digest:
      algorithm: sha-256
      value: ec6d7fd733a989eb86580bd3a9d77405d3c02d5402429190ad8d171c4414ae98
    executable_path: contracts/nkf/0.71/nkf.yaml
