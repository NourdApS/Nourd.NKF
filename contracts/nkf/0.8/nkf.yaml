    binding.provider-authority.missing: {severity: error, blocking: conformance, phase: record-contract}
    extension.catalog-id.duplicate: {severity: error, blocking: conformance, phase: extension-resolution}
    extension.use-id.duplicate: {severity: error, blocking: conformance, phase: extension-resolution}
    extension.required.contract-unresolved: {severity: error, blocking: conformance, phase: extension-resolution}
    extension.required.contract-digest-mismatch: {severity: error, blocking: conformance, phase: extension-resolution}
    extension.required.contract-identity-mismatch: {severity: error, blocking: conformance, phase: extension-resolution}
    extension.required.unsupported: {severity: error, blocking: conformance, phase: extension-resolution}
    extension.payload.invalid: {severity: error, blocking: conformance, phase: extension-resolution}
    extension.core-conflict: {severity: error, blocking: conformance, phase: extension-resolution}
    extension.optional.unvalidated: {severity: warning, blocking: none, phase: extension-resolution}
    security.secret-pattern: {severity: error, blocking: conformance, phase: security}
    authority.binding.unavailable: {severity: warning, blocking: none, phase: authority-binding}
    authority.binding.contradicted: {severity: error, blocking: governing-use, phase: authority-binding}

governed_validation_inputs:
  definition: exact-project-resources-whose-observed-state-participates-in-requested-validation
  ownership:
    core_defines_initial_set: true
    accepted_extensions_may_add_resource_kinds: true
    checker_ad_hoc_addition: forbidden
  contribution_aspects: [structural-state, exact-bytes]
  each_resource_contributes_only_applicable_validated_aspects: true
  core_initial_set:
    - fixed-.nourd-and-knowledge-structure-facts
    - exact-bundle-bytes-when-safely-readable
    - direct-declaration-directory-entry-facts
    - exact-safely-readable-.yaml-declaration-candidate-bytes
    - resolved-knowledge-root-and-recursive-markdown-paths-and-bytes
    - valid-declared-record-and-non-record-paths-including-missing-observations
    - valid-declared-technology-governed-artifact-paths-and-exact-bytes
    - exact-graph-baseline-path-and-bytes-when-safely-readable
    - exact-request-selected-receipt-and-observation-paths-and-bytes
    - examined-path-component-and-symlink-resolution-facts
    - project-contained-resources-added-by-involved-resolved-supported-extensions
  discovery:
    follows_phase_safety: true
    invalid_or_unsafe_path_traversal: forbidden
  excluded_unless_accepted_rule_adds:
    - validation-result-file
    - unrelated-.nourd-content
    - unreferenced-non-markdown-assets
    - external-authority-resources
    - operational-resources
  snapshot_inventory:
    identity: nkf.validation-snapshot
    nkf_version: "0.8"
    persisted: false
    closed: true
    required_fields: [contract, nkf_version, inputs]
    fields:
      contract:
        const: nkf.validation-snapshot
      nkf_version:
        const: "0.8"
      inputs:
        type: array
        order: exact-path-rfc8785-unsigned-utf16
        unique_by: exact-logical-path
        selector_merge: true
        items:
          closed: true
          required_fields: [path, direct_kind, resolution, resolved_path, final_kind, content_sha256]
          fields:
            path:
              type: string
              representation: exact-project-root-relative-with-/
            direct_kind:
              enum: [missing, regular-file, directory, symbolic-link, other]
            resolution:
              enum: [direct, contained, broken, cyclic, outside-project, outside-knowledge-root, not-applicable]
            resolved_path:
              type: [string, "null"]
              representation_when_present: exact-project-root-relative-with-/
            final_kind:
              enum: [regular-file, directory, other, "null"]
            content_sha256:
              type: [sha256, "null"]
              present_value_when: any-applicable-rule-validates-exact-bytes
    sorting:
      normalization: none
      case_folding: none
      comparator: rfc8785-unsigned-utf16
    canonicalization:
      encoding: UTF-8
      algorithm: rfc8785-jcs
    digest:
      algorithm: sha-256
      input: canonical-utf8-inventory
    persisted_result_fields: [algorithm, canonicalization, value, entry_count]

validation_result:
  identity: nkf.validation-result
  nkf_version: "0.8"
  path: .nourd/validation-result.json
  encoding:
    character_encoding: UTF-8
    bom: forbidden
    data_model: JSON
    root: one-object
    comments: forbidden
    duplicate_keys: forbidden
    non_json_values: forbidden
    member_order_semantic: false
    whitespace_semantic: false
  governed_knowledge: false
  inside_knowledge_root: false
  included_in_own_snapshot: false
  ordinarily_committed: false
  closed: true
  required_fields:
    - contract
    - nkf_version
    - execution
    - checker
    - contract_artifacts
    - request
    - bundle_id
    - profile
    - validated_snapshot
    - phases
    - conformance
    - knowledge_graph
    - nodes
    - records
    - readiness
    - governing_use
    - diagnostics
  fields:
    contract:
      const: nkf.validation-result
    nkf_version:
      const: "0.8"
    execution:
      ref: validation_result.execution
    checker:
      ref: validation_result.checker
    contract_artifacts:
      ref: validation_result.contract_artifacts
    request:
      ref: validation_result.request
    bundle_id:
      type: [common.identifier, "null"]
    profile:
      ref: validation_result.profile
    validated_snapshot:
      ref: validation_result.validated_snapshot
    phases:
      ref: validation_result.phases
    conformance:
      enum: [passed, failed]
    knowledge_graph:
      ref: validation_result.knowledge_graph
    nodes:
      type: array
      unique_by: node
      order: stable-node-reference-order
      items: {ref: validation_result.node_result}
    records:
      type: array
      unique_by: record_id
      order: exact-record-id-rfc8785-unsigned-utf16
      scope:
        structural: every-uniquely-identified-in-scope-record
        contract: only-uniquely-resolved-requested-record
        full-bundle: every-uniquely-identified-governed-record
        ambiguous_or_duplicate_identity: no-invented-or-merged-result
      items:
        ref: validation_result.record_result
    readiness:
      ref: validation_result.readiness_result
    governing_use:
      enum: [ready, not-ready, not-evaluated]
    diagnostics:
      type: array
      items:
        ref: diagnostics.shape
      order: accepted-diagnostic-order
      complete_identity_duplicates: forbidden
  execution:
    closed: true
    required_fields: [id, runner, started_at, completed_at]
    fields:
      id:
        ref: common.lowercase_uuid
      runner:
        ref: common.portable_identity
      started_at:
        ref: common.utc_millisecond_timestamp
      completed_at:
        ref: common.utc_millisecond_timestamp
    completed_at_not_before_started_at: checker
  profile:
    closed: true
    required_fields: [identity, binding]
    fields:
      identity:
        type: [common.identifier, "null"]
      binding:
        enum: [verified, unsupported, not-evaluated]
    variants:
      verified:
        identity: supported-selectable-profile-identity
      unsupported:
        identity: present-non-null-unsupported-or-non-selectable-identity
      not-evaluated:
        identity: "null"
  checker:
    closed: true
    required_fields: [identity, digest]
    fields:
      identity:
        ref: common.portable_identity
      digest:
        ref: common.digest
    concrete_release_identity_and_digest: distribution-owned
  artifact_binding:
    closed: true
    required_fields: [expected_sha256, observed_sha256, binding]
    fields:
      expected_sha256:
        ref: common.digest.value
      observed_sha256:
        type: [common.digest.value, "null"]
      binding:
        enum: [verified, unavailable, mismatched]
    invariants:
      verified: observed-present-and-equals-expected
      unavailable: observed-null
      mismatched: observed-present-and-not-equal-expected
  schema_binding:
    extends: validation_result.artifact_binding
    required_additional_fields: [identity]
    fields:
      identity:
        type: string
        min_length: 1
  contract_artifacts:
    closed: true
    required_fields: [core, extensions]
    fields:
      core:
        closed: true
        required_fields: [specification, executable, freshness_policy, version_delta, schemas]
        fields:
          specification:
            ref: validation_result.artifact_binding
          executable:
            ref: validation_result.artifact_binding
          freshness_policy:
            ref: validation_result.artifact_binding
          version_delta:
            ref: validation_result.artifact_binding
          schemas:
            type: array
            exact_items_in_order:
              - identity: urn:nkf:0.8:schema:bundle
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.8:schema:record
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.8:schema:graph-baseline
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.8:schema:freshness-receipt
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.8:schema:freshness-policy
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.8:schema:validation-result
                ref: validation_result.schema_binding
      extensions:
        type: array
        order: exact-extension-id-rfc8785-unsigned-utf16
        ambiguous_or_invalid_identity: forbidden
        items:
          closed: true
          required_fields: [id, specification, executable]
          fields:
            id:
              ref: extensions.identifier
            specification:
              ref: validation_result.artifact_binding
            executable:
              ref: validation_result.artifact_binding
  request:
    closed: true
    required_fields: [level, record_id, acceptance_binding, purpose, require_readiness, changed_inputs, targets, observations, evaluation_time, historical_receipt]
    fields:
      level:
        enum: [structural, contract, full-bundle]
      record_id:
        type: [common.identifier, "null"]
      acceptance_binding:
        enum: [requested, not-requested]
      purpose:
        type: [string, "null"]
        enum_non_null: [change-impact, whole-root-readiness, consequential-use, historical-reproduction]
      require_readiness: {type: boolean}
      changed_inputs:
        type: array
        unique_items: true
        order: stable-input-reference-order
        items: {ref: freshness.changed_input}
      targets:
        type: array
        unique_items: true
        order: stable-node-reference-order
        items: {ref: common.node_reference}
      observations:
        type: array
        unique_by: id
        order: id-rfc8785-unsigned-utf16
        items: {ref: freshness.observation}
      evaluation_time: {type: [common.utc_millisecond_timestamp, "null"]}
      historical_receipt: {type: [string, "null"], pattern_non_null: "^freshness-[0-9a-f]{64}$"}
    variants:
      structural:
        record_id: "null"
        acceptance_binding: not-requested
        persistence: transient
        purpose: "null"
        require_readiness: false
      contract:
        record_id: required-non-null
        target_resolution: exactly-one-uniquely-identified-governed-record
        unresolved_diagnostic: request.record.unresolved
        unresolved_record_result: omitted
        acceptance_binding: [requested, not-requested]
        persistence: transient
      full-bundle:
        record_id: "null"
        acceptance_binding: [requested, not-requested]
        persistence: replace-project-receipt
    constraints:
      require_readiness_true_requires_non_null_purpose: true
      change_impact_requires_non_empty_changed_inputs: true
      consequential_use_requires_non_empty_targets: true
      other_current_purposes_require_empty_targets: true
      expiry_requires_non_null_evaluation_time: true
      no_applicable_expiry_requires_null_evaluation_time: true
      historical_reproduction_requires_non_null_historical_receipt: true
      other_purposes_require_null_historical_receipt: true
  validated_snapshot:
    closed: true
    required_fields: [algorithm, canonicalization, value, entry_count]
    fields:
      algorithm:
        const: sha-256
      canonicalization:
        const: rfc8785-jcs
      value:
        ref: common.digest.value
      entry_count:
        type: integer
        minimum: 0
  phases:
    type: array
    exact_items_in_order:
      - contracts
      - parse
      - schema
      - project
      - source
      - extension-resolution
      - bundle-graph
      - knowledge-graph
      - record-contract
      - freshness
      - security
      - authority-binding
      - result
    item:
      closed: true
      required_fields: [id, state]
      fields:
        id: {enum: [contracts, parse, schema, project, source, extension-resolution, bundle-graph, knowledge-graph, record-contract, freshness, security, authority-binding, result]}
        state: {enum: [passed, failed, not-evaluated]}
    result_phase_state_in_emitted_result: passed
    inability_to_construct_valid_result: no-completed-result
    completed_conformance_failure: valid-result
  knowledge_graph:
    closed: true
    required_fields: [policy, candidate_graph_revision, baseline_graph_revision, baseline_state, node_count, authored_edge_count, projection_counts]
    fields:
      policy:
        closed: true
        required_fields: [identity, digest, binding]
        fields:
          identity: {const: nkf.freshness-policy.0.8}
          digest: {ref: common.digest}
          binding: {enum: [verified, unavailable, mismatched]}
      candidate_graph_revision: {type: [common.digest, "null"]}
      baseline_graph_revision: {type: [common.digest, "null"]}
      baseline_state: {enum: [confirmed, missing, outdated, disputed, ambiguous, coverage-incomplete, unsupported, not-evaluated]}
      node_count: {type: integer, minimum: 0}
      authored_edge_count: {type: integer, minimum: 0}
      projection_counts:
        closed: true
        required_fields: [full, applicable, current]
        fields:
          full: {type: integer, minimum: 0}
          applicable: {type: integer, minimum: 0}
          current: {type: integer, minimum: 0}
    unevaluated_after_earlier_phase_failure:
      candidate_graph_revision: "null"
      baseline_graph_revision: "null"
      baseline_state: not-evaluated
      node_count: 0
      authored_edge_count: 0
      projection_counts: {full: 0, applicable: 0, current: 0}
      nodes: []
      readiness:
        state: not-evaluated
        baseline_graph_revision: "null"
        candidate_graph_revision: "null"
        blocking_nodes: []
        blocking_rules: []
      policy: exact-already-evaluated-contract-artifact-binding
      implies_empty_graph: false
    all_other_completed_results:
      candidate_graph_revision: common.digest
  node_result:
    closed: true
    required_fields: [node, revision, applicability, participation_role, authority_eligibility, authority_binding, freshness, conformance, impact_selected, reason_paths]
    fields:
      node: {ref: common.node_reference}
      revision: {ref: common.digest}
      applicability: {enum: [applicable, not-applicable, unknown]}
      participation_role: {type: [string, "null"], enum_non_null: [governs, proposes, realizes, evidences, context, history]}
      authority_eligibility: {enum: [eligible, ineligible, unknown]}
      authority_binding: {enum: [verified, not-verified, contradicted, not-applicable]}
      freshness:
        type: array
        unique_items: true
        order: [stale, expired, invalidated, unknown, current]
        items:
          closed: true
          required_fields: [result, reasons]
          fields:
            result: {enum: [current, stale, expired, invalidated, unknown]}
            reasons: {type: array, min_items: 1, unique_items: true, order: rfc8785-unsigned-utf16}
      conformance: {enum: [passed, failed, not-evaluated]}
      impact_selected: {type: boolean}
      reason_paths: {type: array, unique_items: true, order: shortest-then-whole-entry-jcs-rfc8785-unsigned-utf16, items: {ref: freshness.reason_path}}
    current_mutually_exclusive_with_noncurrent: true
    non_applicable_freshness_empty: true
  readiness_result:
    closed: true
    required_fields: [purpose, state, baseline_graph_revision, candidate_graph_revision, blocking_nodes, blocking_rules]
    fields:
      purpose: {type: [string, "null"], enum_non_null: [change-impact, whole-root-readiness, consequential-use, historical-reproduction]}
      state: {enum: [ready, not-ready, not-evaluated]}
      baseline_graph_revision: {type: [common.digest, "null"]}
      candidate_graph_revision: {type: [common.digest, "null"]}
      blocking_nodes: {type: array, unique_items: true, order: stable-node-reference-order, items: {ref: common.node_reference}}
      blocking_rules: {type: array, unique_items: true, order: rfc8785-unsigned-utf16, items: {type: string, min_length: 1}}
    ready_by_purpose:
      change-impact: [confirmed-baseline-for-candidate, all-impact-selected-current, complete-decision-reconciliation, no-unresolved-conflict, all-required-observations-and-reviews-bound]
      whole-root-readiness: [confirmed-baseline-for-candidate, all-applicable-current, complete-decision-reconciliation, no-unresolved-conflict, all-required-observations-and-reviews-bound]
      consequential-use: [confirmed-baseline-for-candidate, all-target-closure-current, complete-decision-reconciliation, no-unresolved-conflict, all-required-observations-and-reviews-bound]
      historical-reproduction: [selected-receipt-binding-exact, receipt-inputs-policy-and-evaluator-reproduced, no-current-baseline-required]
    implies: none-of-acceptance-conformance-authority-binding-or-realization-confirmation
  record_result:
    closed: true
    required_fields: [record_id, declared_governance, conformance, acceptance_binding, governing_use]
    fields:
      record_id:
        ref: common.identifier
      declared_governance:
        type: [record.governance, "null"]
      conformance:
        enum: [passed, failed, not-evaluated]
        meaning: requested-level-relative
      acceptance_binding:
        enum: [not-applicable, not-verified, verified, contradicted]
      governing_use:
        enum: [ready, not-ready, not-evaluated]
    invalid_governance:
      declared_governance: "null"
      acceptance_binding: not-verified
      governing_use: not-ready
  readiness:
    record:
      draft_superseded_retired: [not-applicable, not-ready]
      accepted_binding_unavailable_or_unperformed: [not-verified, not-evaluated]
      accepted_contradicted: [contradicted, not-ready]
      accepted_verified_conforming_unblocked: [verified, ready]
      any_conformance_or_governing_blocker: not-ready
    project_full_bundle:
      every_applicable_record_ready: ready
      any_record_not_ready: not-ready
      otherwise_any_record_not_evaluated: not-evaluated
    top_level:
      structural: not-evaluated
      contract:
        unique_target: target-record-governing-use
        missing_or_ambiguous_target: not-ready
      full-bundle: project-full-bundle-aggregate
  persistence:
    completed_full_bundle_replaces_previous: true
    failed_full_bundle_replaces_previous_pass: true
    structural_or_contract_write: forbidden
    atomic_replace: required
    local_history: none
    external_history: permitted
  currentness:
    nkf_verified_means: current-full-bundle-conformance-only
    nkf_ready_means: requested-contextual-knowledge-readiness-ready
    requires:
      - matching-governed-validation-input-snapshot
      - current-core-specification-executable-and-schema-bindings
      - recognized-and-supported-checker-for-current-artifact-revision
    otherwise_status: verification-outdated
    outdated_receipt_remains: historical-operational-evidence
    context_free_universal_expiry: none
    contextual_document_freshness: freshness
    external_authority_polling: none
    future_investigation: NKF-005
  excludes:
    - usernames
    - hostnames
    - absolute-project-paths
    - credentials
    - secrets
    - copied-operational-payloads
    - acceptance-assertion-from-conformance
    - realization-confirmation-from-conformance

governed_mechanics:
  declaration_mutation:
    input: complete-safe-yaml-document
    target_resolution:
      method: parsed-closed-shape-and-exact-field-path
      target_count: exactly-one
      rejects:
        - absent-target
        - duplicate-target
        - alias
        - custom-tag
        - merge-key
        - non-scalar-target
        - ambiguous-shape
        - unsupported-subject
    replacement:
      value: one-plain-or-quoted-yaml-scalar-parsing-to-exact-requested-value
      byte_scope: exact-target-scalar-source-range-only
      preserves: every-byte-outside-target-range
      forbidden:
        - regex-adjacency
        - textual-key-order-assumption
        - indentation-assumption
        - whole-document-reserialization
    proof_before_commit:
      - strict-reparse
      - exact-target-value
      - byte-identity-outside-target-range
      - subject-postcondition
      - applicable-project-postconditions
    failure_behavior: no-mutation
  result_truthfulness:
    successful_zero_change:
      allowed_exactly_when: every-requested-target-already-current-before-staging
    stale_subject:
      successful_mutation_requires: exact-positive-changed-subject-count-and-current-same-subject-postcondition
      zero-change-success: forbidden
    failed_postcondition:
      rollback: complete-operation-owned-pre-mutation-snapshot
      result: exact-failed-stage
    repeat_after_success:
      result: exact-current-or-no-change-state
      governed_byte_change: none
  command_subject_matrix:
    closed: true
    operations:
      repin:
        closed: true
        mutation_owner: structural-declaration-mutator
        semantic_input: selected-governed-subjects-or-all-supported-subjects
        subjects: [record-source, represented-document-source, governed-artifact]
        postconditions: [every-stale-digest-is-exact-current-sha256, every-unchanged-digest-was-already-current]
        success_result: {state: repinned, exact_counts: [records, documents, artifacts]}
        no_change_result: {state: repinned, exact_zero_counts: [records, documents, artifacts], permitted_only_when: every-supported-selected-subject-was-current}
        failure_result: {state: failed, exact_stage_and_diagnostic: required}
      linkify:
        closed: true
        mutation_owner: deep-link-rewriter-plus-structural-declaration-mutator
        semantic_input: accepted-same-bundle-reference-grammar-and-declared-identity-map
        subjects: [selected-mutable-record-markdown, selected-mutable-document-markdown, every-affected-declaration-digest]
        postconditions: [immutable-source-rejected, every-introduced-same-bundle-link-resolves, every-affected-digest-current]
        success_result: {state: linkified, exact_counts: [files, changed, repinned_records, repinned_documents]}
        no_change_result: {state: linkified, changed: 0, permitted_only_when: no-selected-source-required-rewrite-and-every-affected-digest-was-current}
        failure_result: {state: failed, exact_stage_and_diagnostic: required}
      task-transition:
        closed: true
        mutation_owner: task-state-transaction
        semantic_input: reviewer-authored-target-state-and-required-result
        subjects: [exact-task-document, declared-task-state, completion-or-cancellation-result, generated-state-navigation, affected-source-digests, governed-references, seal-completed-successor-baseline]
        postconditions: [knowledge-transaction-current, successor-baseline-sealed-in-the-same-transaction, transition-graph-delta-is-exactly-the-closed-transition-vocabulary, excess-transition-delta-fails-before-mutation, git-or-host-orchestration-reported-separately]
        success_result: {state: transitioned, exact_fields: [task, prior_task_status, task_status, generated_navigation, changed_subjects, graph_revision]}
        no_change_result: {state: current, permitted_only_when: exact-task-already-in-requested-state-and-required-result-current}
        failure_result: {state: failed, exact_knowledge_or_operational_stage_and_diagnostic: required}
      refs:
        closed: true
        mutation_owner: none-read-only
        semantic_input: declared-bundle
        subjects: [exact-declared-node-universe, exact-authored-relationship-universe]
        postconditions: [read-only, complete, deterministic]
        success_result: {state: exported, exact_fields: [knowledge_root, records, documents, decisions, tasks, relationships]}
        no_change_result: same-as-success-read-only
        failure_result: {state: failed, exact_stage_and_diagnostic: required}
      set:
        closed: true
        mutation_owner: none-read-only
        semantic_input: accepted-versioned-release-set
        subjects: [exact-versioned-release-set-coverage, exact-versioned-release-set-members]
        postconditions: [read-only, byte-identical-to-accepted-release-set-authority]
        success_result: {state: enumerated, exact_fields: [nkf_version, members]}
        no_change_result: same-as-success-read-only
        failure_result: {state: failed, exact_stage_and_diagnostic: required}
      review-scaffold:
        closed: true
        mutation_owner: none-read-only
        semantic_input: pending-claim-candidate-graph-predecessor-baseline-policy-and-accepted-version-delta-declaration
        subjects: [exact-candidate-node-universe, exact-computed-required-review-closure, exact-carriable-judgment-set]
        postconditions: [read-only, carried-judgments-prefilled-with-exact-provenance, required-fresh-set-emitted-with-empty-judgment-fields, no-state-role-classification-finding-claim-or-dispute-value-supplied]
        success_result: {state: scaffolded, exact_fields: [stage, nodes, carried, fresh]}
        no_change_result: same-as-success-read-only
        failure_result: {state: failed, exact_stage_and_diagnostic: required}
      record-scaffold:
        closed: true
        mutation_owner: none-read-only
        semantic_input: one-exact-markdown-source
        subjects: [exact-markdown-source, exact-derived-heading-structure]
        postconditions: [read-only, exact-digests-and-section-heading-paths-emitted, empty-semantic-fields, no-governance-relationship-authority-or-lifecycle-value-supplied]
        success_result: {state: scaffolded, exact_fields: [path, digest, sections]}
        no_change_result: same-as-success-read-only
        failure_result: {state: failed, exact_stage_and_diagnostic: required}
      identity-succession:
        closed: true
        mutation_owner: succession-transaction
        semantic_input: accepted-successor-identifier-and-recording-authority
        subjects: [exact-living-record-or-document, every-affected-declaration, baseline-bindings, generated-navigation, same-bundle-links]
        postconditions: [predecessor-identifier-resolvable-through-chain, succession-recorded-with-provenance, immutable-record-bytes-unchanged, no-cycle, no-live-identifier-reuse]
        success_result: {state: succeeded, exact_fields: [predecessor_id, successor_id, changed_subjects]}
        no_change_result: {state: current, permitted_only_when: exact-succession-already-recorded-and-current}
        failure_result: {state: failed, exact_stage_and_diagnostic: required}
      freshness-evaluation:
        closed: true
        mutation_owner: checker-result-and-receipt-transaction
        semantic_input: [exact-evaluation-request, reviewer-and-external-observations-when-required]
        subjects: [candidate-graph, confirmed-baseline, evaluation-policy, purpose, changed-inputs, targets, observations, freshness-receipt, validation-result]
        postconditions: [exact-impact-closure, complete-decision-reconciliation, revision-bound-receipt, requested-result-persistence-rule]
        success_result: {state: evaluated, exact_fields: [candidate_graph_revision, policy, purpose, receipt, freshness_results, readiness]}
        no_change_result: {state: evaluated-current, permitted_only_when: exact-context-and-current-persisted-receipt-already-match}
        failure_result: {state: failed, exact_stage_and-diagnostic: required, partial-receipt: forbidden}
      reviewed-baseline-seal:
        closed: true
        mutation_owner: baseline-seal-transaction
        semantic_input: named-reviewer-completed-whole-root-or-delta-review-or-transition-produced-conclusion-input
        subjects: [exact-candidate-node-universe, exact-authored-edges, external-dependencies, authority-inputs, relationship-coverage, applicability-coverage, decision-classifications, promotion-reconciliation, observations, limitations, disputed-state, graph-baseline]
        postconditions: [review-input-exact-coverage-and-bases-resolve, checker-candidate-graph-exactly-matches-review, every-carried-judgment-precondition-proven, delta-performed-set-contains-exact-computed-closure, conclusion-input-delta-is-exactly-the-closed-transition-vocabulary-with-zero-performed-judgments, resulting-baseline-schema-valid-and-confirmed]
        success_result: {state: sealed, exact_fields: [graph_revision, nodes, reviewer, reviewed_at]}
        no_change_result: {state: current, permitted_only_when: existing-confirmed-baseline-is-byte-identical-to-derived-result}
        failure_result: {state: failed, exact_stage_and-diagnostic: required, baseline-mutation: forbidden}
      adopt:
        closed: true
        mutation_owner: adopt-project-transaction
        semantic_input:
          onboard-or-install: [reviewed-onboarding-plan, exact-release-selection]
          non-breaking-upgrade: [exact-release-selection, separately-completed-exact-post-upgrade-review-of-the-computed-required-set-or-whole-root]
          current: [exact-release-selection]
          producer-promotion: [exact-accepted-serialized-promotion-input, exact-accepting-decision, exact-stage-proof, separately-completed-exact-post-promotion-delta-review-with-whole-root-recovery]
        subjects:
          common-installation: [version-declaration, release-pin, installed-checker, installed-adopter, host-integration, complete-gate]
          onboard-or-install-additional: [reviewed-onboarding-plan, complete-portable-topology, initial-native-declarations, generated-navigation, candidate-graph, confirmed-baseline]
          non-breaking-upgrade-additional: [rebound-contract-set, converted-digest-bound-baseline, post-upgrade-graph, post-upgrade-confirmed-baseline]
          current: [exact-complete-installed-integration]
          producer-promotion-additional: [candidate-evidence-document-representation, supplied-native-specification-declaration-destination, supplied-native-specification-declaration-content, written-promotion-reconciliation-entries, generated-navigation, post-promotion-graph, post-promotion-confirmed-baseline]
        postconditions:
          common: [complete-owned-rollback, requested-version-current]
          onboard-or-install: [reviewed-plan-applied-exactly, complete-topology-and-native-declarations-valid, confirmed-baseline-matches-exact-candidate-graph]
          non-breaking-upgrade: [all-canonical-markdown-bytes-preserved, contract-set-rebound-mechanically, every-carried-judgment-precondition-proven, computed-required-set-reviewed-before-seal, confirmed-baseline-matches-exact-post-upgrade-graph]
          current: [no-governed-byte-change, exact-selected-release-and-complete-integration-current]
          producer-promotion: [exact-candidate-evidence-representation-removed, exact-native-declaration-created-once-at-supplied-destination, accepted-input-and-decision-bindings-exact, source-executable-policy-and-version-delta-bytes-preserved, promotion-reconciliation-entries-written, generated-navigation-current, post-promotion-graph-and-baseline-match-separate-completed-review]
        internal_modes: [onboard, install, upgrade, producer-promotion, current]
        producer-promotion-availability:
          stages: [prepublication-isolated-exact-producer, postpublication-exact-live-producer]
          ordinary-non-producer: forbidden
        success_result_states: [onboarded, updated, current]
        producer-promotion-success-result: {state: updated, exact_fields: [stage, removed_evidence_document, created_declaration, graph_revision, baseline, changed_subjects]}
        no_change_result: {state: current, permitted_only_when: exact-selected-release-and-complete-integration-already-current}
        failure_result: {state: failed, exact_stage_and_diagnostic: required}
      release-verification:
        closed: true
        mutation_owner: none-read-only
        semantic_input: independently-trusted-archive-digest-and-optional-exact-source-root
        subjects: [archive, release-manifest, release-set, authority, freshness-policy, schemas, checker, adopter, license, notice, third-party-notices, source-commit]
        postconditions: [exact-archive-and-binding-verification, third-party-build-input-notice-completeness, checker-invoked-only-after-distribution-verification]
        success_result: {state: verified, exact-release-identities: required}
        no_change_result: same-as-success-read-only
        failure_result: {state: failed, checker_invocation: forbidden-before-distribution-verification}
    unlisted_subject_mutation: unsupported-and-fail-closed
  required_test_matrix:
    sibling_key_order_permutations: every-mutated-scalar
    cases:
      - idempotence
      - rollback-after-staged-write
      - unsupported-subject-kind
      - missing-target
      - mismatched-precondition
      - archive-tampering
      - release-pin-tampering
      - stale-digest-result-truthfulness
  prepublication_guidance_review:
    performed_before: candidate-archive-cut
    enumeration:
      source: set-operation-output-for-this-version
      authority: exact-release-set-members
      recollected_or-hand-maintained-list: forbidden
    full_reread:
      subjects: [authoring-protocol, onboarding-protocol, release-protocol, adoption-protocol, portable-skill, host-adapter-instruction]
      against: complete-accepted-rule-set-for-this-version
      rules_that_changed_only: insufficient
      correction_required_for: sentence-describing-a-rule-that-is-not-the-current-rule
    recorded:
      - enumerated-member-list
      - reviewed-digest-per-member
      - every-correction
    independent_audit_must_verify:
      - enumerated-member-list-present
      - reviewed-digest-present-per-member
      - every-correction-recorded
    audit_rejects: review-recording-only-the-version-rule-diff
    derivation_does_not_satisfy_this: true
    review_proves_current_rule_meaning: human-judgment-only
  prepublication_producer_rehearsal:
    target: isolated-copy-of-exact-candidate-source-repository
    initial_operation: exact-candidate-archive-adopt
    initial_operation_is_public_adoption: false
    repeat_adopt_state: current
    required_exercises:
      - every-command-subject-matrix-cell
      - ordinary-current-system-realization-edit-and-repin
      - record-and-document-add-remove-through-accepted-topology
      - governed-artifact-edit-and-repin
      - freshness-invalidation-review-receipt-reseal-and-baseline-replacement
      - complete-producer-gate-from-clean-dependencies
      - two-byte-identical-builds
      - two-byte-identical-archives
      - exact-release-set-and-licensing-notice-verification
      - rollback-and-tamper-rejection
      - fresh-independent-audit
    requires_completed_before_cut:
      - prepublication-guidance-review
    binds_exact:
      - source-commit
      - authority-markdown
      - executable-companion
      - freshness-policy
      - schemas
      - release-set
      - checker
      - adopter
      - archive
      - license
      - notice
      - third-party-notices
      - resulting-project-snapshot
    byte_change_invalidates_prior:
      - exercise
      - audit
      - technical-confirmation
    publication_requires: separate-authorization-for-exact-audited-bytes
    postpublication_producer_adopt:
      purpose: [public-recommendation, acquisition, immutable-byte-identity, installed-current-state]
      may_be_first-functional-exercise: false

release_distribution:
  initial_channel: github-release
  repository: "https://github.com/NourdApS/Nourd.NKF.git"
  public_distribution: unresolved
  operational_state_authority: github
  manifest:
    identity: nkf.release-manifest
    nkf_version: "0.8"
    path: release-manifest.json
    encoding:
      character_encoding: UTF-8
      bom: forbidden
      data_model: JSON
      root: one-object
      comments: forbidden
      duplicate_keys: forbidden
      non_json_values: forbidden
      indentation_spaces: 2
      line_endings: LF
      final_lf: exactly-one
      trailing_whitespace: forbidden
      member_order: contract-order
    closed: true
    required_fields: [contract, nkf_version, source, checker, authority, freshness_policy, version_delta, schemas, licensing, files]
    fields:
      contract:
        const: nkf.release-manifest
      nkf_version:
        const: "0.8"
      source:
        ref: release_distribution.source
      checker:
        ref: release_distribution.checker
      authority:
        ref: release_distribution.authority
      freshness_policy:
        ref: release_distribution.freshness_policy
      version_delta:
        ref: release_distribution.version_delta
      schemas:
        ref: release_distribution.schemas
      licensing:
        ref: release_distribution.licensing
      files:
        ref: release_distribution.files
    omitted_fields:
      - manifest-self-digest
      - containing-archive-digest
      - asset-name
      - tag
      - release-url
      - publication-time
      - latest-status
      - mutable-github-state
      - audit-evidence
      - technical-confirmation
      - publication-authorization
    post_audit_governance_binding:
      location: outside-release-archive-and-manifest
      may_bind: [release-commit, archive-digest, checker-digest, audit-evidence]
      may_change_archive_bytes: false
    technical_confirmation_decision:
      timing: after-clean-fresh-independent-audit-and-before-publication
      form: post-audit-outside-the-archive-governance-record
      binds: [exact-release-commit, exact-archive-digest, exact-checker-digest, exact-adopter-digest, exact-audit-evidence]
      mandatory_for_every_release: true
      waiver: none
      invalid_without_bound_audit: true
      publication_without_it: protocol-violation
      review_binding_effect: none-by-contract
  source:
    closed: true
    required_fields: [repository, release_commit]
    fields:
      repository:
        const: "https://github.com/NourdApS/Nourd.NKF.git"
      release_commit:
        type: string
        pattern: '^[0-9a-f]{40}$'
    checker_build_source: release_commit
  checker:
    closed: true
    required_fields: [identity, path, digest, runtime]
    fields:
      identity:
        const: nourd-nkf-checker
      path:
        const: dist/nourd-nkf-checker.mjs
      digest:
        ref: common.digest
      runtime:
        ref: release_distribution.runtime
  runtime:
    closed: true
    required_fields: [name, minimum_major]
    fields:
      name:
        const: node
      minimum_major:
        const: 22
  authority:
    closed: true
    required_fields: [precedence, markdown, executable]
    fields:
      precedence:
        const: normative-markdown
      markdown:
        ref: release_distribution.markdown_artifact
      executable:
        ref: release_distribution.executable_artifact
  markdown_artifact:
    closed: true
    required_fields: [path, digest]
    fields:
      path:
        const: knowledge/specifications/nkf-0.8.md
      digest:
        ref: common.digest
  executable_artifact:
    closed: true
    required_fields: [path, digest]
    fields:
      path:
        const: contracts/nkf/0.8/nkf.yaml
      digest:
        ref: common.digest
  freshness_policy:
    closed: true
    required_fields: [identity, path, digest]
    fields:
      identity: {const: nkf.freshness-policy.0.8}
      path: {const: contracts/nkf/0.8/freshness-policy.yaml}
      digest: {ref: common.digest}
  version_delta:
    closed: true
    required_fields: [contract, path, digest]
    fields:
      contract: {const: nkf.version-delta}
      path: {const: contracts/nkf/0.8/version-delta.yaml}
      digest: {ref: common.digest}
  schema_artifact:
    closed: true
    required_fields: [identity, path, digest]
    fields:
      identity:
        type: string
      path:
        type: string
      digest:
        ref: common.digest
  schemas:
    type: array
    exact_items_in_order:
      - identity: urn:nkf:0.8:schema:bundle
        path: contracts/nkf/0.8/schemas/bundle.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.8:schema:record
        path: contracts/nkf/0.8/schemas/record.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.8:schema:graph-baseline
        path: contracts/nkf/0.8/schemas/graph-baseline.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.8:schema:freshness-receipt
        path: contracts/nkf/0.8/schemas/freshness-receipt.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.8:schema:freshness-policy
        path: contracts/nkf/0.8/schemas/freshness-policy.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.8:schema:release-manifest
        path: contracts/nkf/0.8/schemas/release-manifest.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.8:schema:validation-result
        path: contracts/nkf/0.8/schemas/validation-result.schema.json
        ref: release_distribution.schema_artifact
  licensing_artifact:
    closed: true
    required_fields: [path, digest]
    fields:
      path:
        ref: release_distribution.release_path
      digest:
        ref: common.digest
  licensing:
    closed: true
    required_fields: [spdx, license, notice, third_party_notices]
    fields:
      spdx:
        const: Apache-2.0
      license:
        ref: release_distribution.license_artifact
      notice:
        ref: release_distribution.notice_artifact
      third_party_notices:
        ref: release_distribution.third_party_notices_artifact
    exact_requirements:
      license:
        path: LICENSE
        standard_text: unmodified-apache-license-2.0
        sha256: cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30
      notice:
        path: NOTICE
        informational_only: true
        adds_restrictions: false
        sha256: 48023a31a53e68e9c51358d5ee313dc5f705df1caf4f24f2f2818b372bf5a4e6
      third_party_notices:
        path: THIRD_PARTY_NOTICES.md
        derivation: exact-checker-and-adopter-build-input-graphs
        complete-copyright-permission-attribution-and-disclaimer-retention: required
        unsupported-or-extra-component: forbidden
    legal_claim_boundary:
      proves-company-title: false
      changes-third-party-license: false
  license_artifact:
    closed: true
    required_fields: [path, digest]
    fields:
      path: {const: LICENSE}
      digest: {ref: common.digest}
  notice_artifact:
    closed: true
    required_fields: [path, digest]
    fields:
      path: {const: NOTICE}
      digest: {ref: common.digest}
  third_party_notices_artifact:
    closed: true
    required_fields: [path, digest]
    fields:
      path: {const: THIRD_PARTY_NOTICES.md}
      digest: {ref: common.digest}
  release_path:
    type: string
    safe_relative_release_path: true
  file_artifact:
    closed: true
    required_fields: [path, mode, digest]
    fields:
      path:
        ref: release_distribution.release_path
      mode:
        value_by_path:
          dist/nourd-nkf-checker.mjs: "0755"
          otherwise: "0644"
      digest:
        ref: common.digest
  files:
    type: array
    min_items: 1
    order: exact-release-set-order-excluding-release-manifest
    exact_membership: release_distribution.release_set.members-excluding-release-manifest
    items:
      ref: release_distribution.file_artifact
    unique_paths: true
    checker_authority_freshness_policy_schema_and_licensing_bindings_match: required
  schema:
    identity: urn:nkf:0.8:schema:release-manifest
    path: contracts/nkf/0.8/schemas/release-manifest.schema.json
    scope: release-package-enforcement-only
    project_declaration_schema: false
    governed_validation_input: false
    validation_result_contract_artifact: false
    self_digest_location: release-manifest
  release_set:
    path: contracts/nkf/0.8/release-set.yaml
    identity: nkf.release-set
    closed: true
    required_fields: [contract, nkf_version, coverage, members]
    fields:
      contract:
        const: nkf.release-set
      nkf_version:
        const: "0.8"
      coverage:
        ref: release_distribution.release_set.coverage
      members:
        ref: release_distribution.release_set.members
    class:
      enum:
        - normative-specification
        - executable-companion
        - evaluation-policy
        - version-delta-declaration
        - repository-license
        - repository-notice
        - third-party-notices
        - release-set-contract
        - release-manifest
        - derived-schema
        - checker
        - adopter
        - authoring-protocol
        - onboarding-protocol
        - release-protocol
        - adoption-protocol
        - portable-skill
        - host-adapter-instruction
        - product-fixture
        - technology-fixture
        - product-public-example
        - technology-public-example
        - public-documentation
    selector:
      closed: true
      required_fields: [class, selection, path]
      fields:
        class:
          ref: release_distribution.release_set.class
        selection:
          enum: [exact-file, recursive-regular-files, generated-release-manifest]
        path:
          ref: release_distribution.release_path
    coverage:
      type: array
      min_items: 1
      items:
        ref: release_distribution.release_set.selector
      order: exact-class-then-ascii-path
      unique_paths: true
      selector_paths_disjoint: true
      required_classes: exact-release_distribution.release_set.class-enum
      class_minimum_matches: 1
      selection_rules:
        exact-file: existing-regular-file-in-clean-built-source
        recursive-regular-files: every-recursive-regular-file-beneath-existing-non-empty-source-directory
        generated-release-manifest: exact-release-manifest.json-only
      links_devices_unsafe_paths_empty_recursive_and_multiple_matches: forbidden
    member:
      closed: true
      required_fields: [path, class, mode]
      fields:
        path:
          ref: release_distribution.release_path
        class:
          ref: release_distribution.release_set.class
        mode:
          value_by_path:
            dist/nourd-nkf-checker.mjs: "0755"
            otherwise: "0644"
    members:
      type: array
      min_items: 1
      items:
        ref: release_distribution.release_set.member
      order: exact-ascii-path
      unique_paths: true
      exact_union_of_coverage_after_deterministic_builds: true
      member_class_matches_selector: required
      includes_self: true
      includes_release_manifest: true
      required_member_classes: exact-release_distribution.release_set.class-enum
      source_provenance_verification: reproduce-exact-coverage-union-from-clean-release-commit
      extraction_only_verification: verify-content-addressed-enumeration-class-presence-modes-membership-and-manifest-bindings
    sole_consumers:
      - archive-construction
      - manifest-construction
      - release-verification
      - internal-exact-candidate-adopt
      - public-adopt
      - deterministic-set-operation
      - public-documentation-verification
    second-hand-maintained-membership-list: forbidden
  archive:
    uploaded_distribution_asset_count: 1
    filename_pattern: '^nourd-nkf-sha256-[0-9a-f]{64}\.tar$'
    digest:
      algorithm: sha-256
      filename_value_must_equal_archive_digest: true
    format: ustar
    compression: none
    root: nourd-nkf
    entry_kind: regular-file-only
    explicit_directory_entries: forbidden
    entry_order: exact-ascii-path
    member_source: release_distribution.release_set.members
    exact_membership_and_modes: required
    forbidden:
      - symlink
      - hard-link
      - device
      - absolute-path
      - traversal
      - duplicate-path
      - case-colliding-path
      - unexpected-entry
    ustar:
      modification_time: 0
      uid: 0
      gid: 0
      user_name: ""
      group_name: ""
      link_name: ""
      magic_bytes_hex: "75 73 74 61 72 00"
      version_bytes_hex: "30 30"
      path_storage: name-field-only
      prefix_field: ""
      numeric_encoding: zero-padded-ascii-octal
      type_flag_byte_hex: "30"
      device_major: 0
      device_minor: 0
      file_size: derived-exact-byte-count
      header_checksum: derived-standard-ustar
      content_padding: zero-filled
      final_zero_blocks: 2
      trailing_bytes_after_final_blocks: forbidden
      base_256_numbers: forbidden
      pax_extensions: forbidden
  packaging:
    source_tree: clean-release-commit
    steps:
      - complete-prepublication-producer-rehearsal-and-independent-audit
      - complete-accepted-development-check
      - build-checker-twice
      - require-byte-identical-checker-builds-from-release-commit
      - verify-authority-and-schema-digests
      - verify-exact-license-notice-and-third-party-build-input-notices
      - reproduce-release-set-coverage-and-verify-sole-membership-enumeration
      - construct-and-schema-validate-manifest
      - assemble-archive-twice
      - require-reproducible-checker-and-archive-digests
    failure_behavior: no-release-artifact
  consumer_pin:
    storage: consumer-dependency-or-tooling-configuration
    required_fields: [repository, archive-sha256]
    tag_and_asset_name: derived-from-archive-sha256
    cached_durable_locator: transport-only
    bundle_field: forbidden
    independently_trusted_archive_digest: required
  verification:
    order:
      - verify-archive-sha256
      - reject-unsafe-archive
      - strict-parse-manifest-and-bootstrap-fixed-contract-version-and-schema-entry
      - verify-release-manifest-schema-digest
      - compile-schema-and-validate-release-manifest
      - verify-release-set-and-required-member-classes
      - verify-release-set-coverage-and-member-class-bindings
      - verify-manifest-files-match-release-set-excluding-manifest
      - verify-all-pre-manifest-paths-modes-and-digests
      - verify-manifest-licensing-bindings-and-exact-license-notice-and-third-party-notices
      - verify-release-commit-and-reproducible-checker-when-source-provenance-is-evaluated
      - reject-missing-or-unexpected-file
      - invoke-checker
    failure:
      classification: execution-level
      checker_invocation: forbidden
      project_validation_result: forbidden
      nkf_verified_claim: forbidden
  github_release:
    uploaded_distribution_asset_count: 1
    github_generated_source_archives: excluded-non-distribution
