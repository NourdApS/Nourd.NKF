security:
  prohibited:
    - live-credentials
    - access-tokens
    - private-keys
    - secrets
  scan_scope:
    byte_semantics: exact-utf8-source-bytes
    native_inputs:
      - .nourd/knowledge/bundle.yaml
      - every-direct-.yaml-declaration-candidate
      - every-recursive-markdown-under-knowledge-root
    governed_validation_inputs: true
    unsafe_path_following: forbidden
    additional_resource_kind_requires: accepted-extension-rule
  registry:
    matching: ascii-byte-case-sensitive
    exact_detector_classes:
      - complete-private-key-block
      - github-prefixed-token
      - openai-prefixed-token
    complete_private_key_block:
      header_form: five-hyphens-BEGIN-space-LABEL-five-hyphens
      footer_form: five-hyphens-END-space-same-LABEL-five-hyphens
      labels:
        - PRIVATE KEY
        - RSA PRIVATE KEY
        - EC PRIVATE KEY
        - DSA PRIVATE KEY
        - OPENSSH PRIVATE KEY
        - ENCRYPTED PRIVATE KEY
      ignored_between: [ascii-space, horizontal-tab, carriage-return, line-feed]
      remaining_alphabet: [A-Z, a-z, 0-9, +, /, =]
      minimum_remaining_bytes: 64
    github_prefixed_token:
      prefixes: [ghp_, gho_, ghu_, ghs_, ghr_]
      body_alphabet: [A-Z, a-z, 0-9]
      minimum_body_bytes: 36
      preceding_boundary_excludes: [A-Z, a-z, 0-9, _]
      following_boundary_excludes: [A-Z, a-z, 0-9]
    openai_prefixed_token:
      prefixes_longest_first: [sk-proj-, sk-]
      body_alphabet: [A-Z, a-z, 0-9, _, "-"]
      minimum_body_bytes: 20
      preceding_boundary_excludes: [A-Z, a-z, 0-9, _, "-"]
      following_boundary_excludes: [A-Z, a-z, 0-9, _, "-"]
  contextual_exemptions: none
  inline_ignore_or_allowlist: none
  nonmatching_placeholders:
    - "ghp_<REDACTED>"
    - "sk-..."
    - "${TOKEN}"
    - "<SECRET>"
  explicitly_nonblocking_without_additional_accepted_rule:
    - aws-access-key-identifier-alone
    - generic-password-looking-text
    - jwt
    - hash
    - digest
    - base64-string
    - entropy-finding
    - unregistered-provider-token
  diagnostic:
    rule_id: security.secret-pattern
    cardinality: at-most-one-per-logical-artifact
    severity: error
    blocking: conformance
    phase: security
    matched-value: forbidden
    surrounding-source: forbidden
    copied-payload: forbidden
  high_confidence_finding_fails_conformance: true
  passing_scan_proves_absence: false
  supplemental_scanners:
    native_result_participation: forbidden
    native_conformance_effect: forbidden
    accepted_namespaced_extension_rule: permitted
  registry_change_requires:
    - governed-nkf-decision
    - replacement-authority-pair
    - derived-fixtures-and-checker-update
    - governed-release
    - deliberate-consumer-migration
  sensitive_bundle_access_policy: out-of-scope

human_review:
  deterministic_validation_cannot_establish:
    - semantic-role-accuracy
    - responsibility-binding-accuracy
    - markdown-truth
    - markdown-adequacy
    - markdown-safety
    - governed-knowledge-completeness
    - evidence-support
    - deserved-acceptance
    - external-authority-currency
    - locator-currency
    - design-quality
    - realization-existence
    - realization-behavior
    - graph-semantic-completeness
    - relationship-semantic-truth
    - decision-classification-truth
    - semantic-review-quality
    - reviewer-authority
