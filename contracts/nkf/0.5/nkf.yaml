      boundary: inclusion-exclusion-limit-non-goal-or-authority-boundary
      catalogue: organized-inventory-classification-portfolio-or-map
      condition: prerequisite-input-state-or-condition
      consequence: effect-or-implication-of-choice
      content: source-meaning-with-no-narrower-accurate-role
      context: background-circumstance-problem-or-operating-situation
      definition: statement-of-meaning-and-distinction
      dependency: required-reliance
      evidence: supporting-material
      evolution: maturity-change-migration-compatibility-or-retirement
      finding: source-supported-conclusion
      governing: governing-constraint-input-policy-rule-or-authority
      identity: stable-realization-identity-kind-or-characteristic
      interface: interaction-exchange-contract-boundary-or-connection
      interpretation: reasoned-meaning-from-observation-or-finding
      limitation: uncertainty-caveat-gap-or-applicability-limit
      mapping: durable-correspondence-between-governed-meaning-and-realization
      measure: success-failure-effectiveness-health-or-progress-criterion
      method: observation-collection-analysis-or-verification-procedure
      obligation: duty-requirement-compliance-or-commitment
      observation: directly-observed-or-source-reported-fact
      outcome: desired-expected-achieved-failed-or-recovered-result
      principle: concise-normative-product-principle
