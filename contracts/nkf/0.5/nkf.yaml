governed_validation_inputs:
  definition: exact-project-resources-whose-observed-state-participates-in-requested-validation
  ownership:
    core_defines_initial_set: true
    accepted_extensions_may_add_resource_kinds: true
    checker_ad_hoc_addition: forbidden
  contribution_aspects: [structural-state, exact-bytes]
  each_resource_contributes_only_applicable_validated_aspects: true
  core_initial_set:
    - fixed-.nourd-and-knowledge-structure-facts
    - exact-bundle-bytes-when-safely-readable
    - direct-declaration-directory-entry-facts
    - exact-safely-readable-.yaml-declaration-candidate-bytes
    - resolved-knowledge-root-and-recursive-markdown-paths-and-bytes
    - valid-declared-record-and-non-record-paths-including-missing-observations
    - valid-declared-technology-governed-artifact-paths-and-exact-bytes
    - exact-graph-baseline-path-and-bytes-when-safely-readable
    - exact-request-selected-receipt-and-observation-paths-and-bytes
    - examined-path-component-and-symlink-resolution-facts
    - project-contained-resources-added-by-involved-resolved-supported-extensions
  discovery:
    follows_phase_safety: true
    invalid_or_unsafe_path_traversal: forbidden
  excluded_unless_accepted_rule_adds:
    - validation-result-file
    - unrelated-.nourd-content
    - unreferenced-non-markdown-assets
    - external-authority-resources
    - operational-resources
  snapshot_inventory:
    identity: nkf.validation-snapshot
    nkf_version: "0.5"
    persisted: false
    closed: true
    required_fields: [contract, nkf_version, inputs]
    fields:
      contract:
        const: nkf.validation-snapshot
      nkf_version:
        const: "0.5"
      inputs:
        type: array
        order: exact-path-rfc8785-unsigned-utf16
        unique_by: exact-logical-path
        selector_merge: true
        items:
          closed: true
          required_fields: [path, direct_kind, resolution, resolved_path, final_kind, content_sha256]
          fields:
            path:
              type: string
              representation: exact-project-root-relative-with-/
            direct_kind:
              enum: [missing, regular-file, directory, symbolic-link, other]
            resolution:
              enum: [direct, contained, broken, cyclic, outside-project, outside-knowledge-root, not-applicable]
            resolved_path:
              type: [string, "null"]
              representation_when_present: exact-project-root-relative-with-/
            final_kind:
              enum: [regular-file, directory, other, "null"]
            content_sha256:
              type: [sha256, "null"]
              present_value_when: any-applicable-rule-validates-exact-bytes
    sorting:
      normalization: none
      case_folding: none
      comparator: rfc8785-unsigned-utf16
    canonicalization:
      encoding: UTF-8
      algorithm: rfc8785-jcs
    digest:
      algorithm: sha-256
      input: canonical-utf8-inventory
    persisted_result_fields: [algorithm, canonicalization, value, entry_count]

validation_result:
  identity: nkf.validation-result
  nkf_version: "0.5"
  path: .nourd/validation-result.json
  encoding:
    character_encoding: UTF-8
    bom: forbidden
    data_model: JSON
    root: one-object
    comments: forbidden
    duplicate_keys: forbidden
    non_json_values: forbidden
    member_order_semantic: false
    whitespace_semantic: false
  governed_knowledge: false
  inside_knowledge_root: false
  included_in_own_snapshot: false
  ordinarily_committed: false
  closed: true
  required_fields:
    - contract
    - nkf_version
    - execution
    - checker
    - contract_artifacts
    - request
    - bundle_id
    - profile
    - validated_snapshot
    - phases
    - conformance
    - knowledge_graph
    - nodes
    - records
    - readiness
    - governing_use
    - diagnostics
  fields:
    contract:
      const: nkf.validation-result
    nkf_version:
      const: "0.5"
    execution:
      ref: validation_result.execution
    checker:
      ref: validation_result.checker
    contract_artifacts:
      ref: validation_result.contract_artifacts
    request:
      ref: validation_result.request
    bundle_id:
      type: [common.identifier, "null"]
    profile:
      ref: validation_result.profile
    validated_snapshot:
      ref: validation_result.validated_snapshot
    phases:
      ref: validation_result.phases
    conformance:
      enum: [passed, failed]
    knowledge_graph:
      ref: validation_result.knowledge_graph
    nodes:
      type: array
      unique_by: node
      order: stable-node-reference-order
      items: {ref: validation_result.node_result}
    records:
      type: array
      unique_by: record_id
      order: exact-record-id-rfc8785-unsigned-utf16
      scope:
        structural: every-uniquely-identified-in-scope-record
        contract: only-uniquely-resolved-requested-record
        full-bundle: every-uniquely-identified-governed-record
        ambiguous_or_duplicate_identity: no-invented-or-merged-result
      items:
        ref: validation_result.record_result
    readiness:
      ref: validation_result.readiness_result
    governing_use:
      enum: [ready, not-ready, not-evaluated]
    diagnostics:
      type: array
      items:
        ref: diagnostics.shape
      order: accepted-diagnostic-order
      complete_identity_duplicates: forbidden
  execution:
    closed: true
    required_fields: [id, runner, started_at, completed_at]
    fields:
      id:
        ref: common.lowercase_uuid
      runner:
        ref: common.portable_identity
      started_at:
        ref: common.utc_millisecond_timestamp
      completed_at:
        ref: common.utc_millisecond_timestamp
    completed_at_not_before_started_at: checker
  profile:
    closed: true
    required_fields: [identity, binding]
    fields:
      identity:
        type: [common.identifier, "null"]
      binding:
        enum: [verified, unsupported, not-evaluated]
    variants:
      verified:
        identity: supported-selectable-profile-identity
      unsupported:
        identity: present-non-null-unsupported-or-non-selectable-identity
      not-evaluated:
        identity: "null"
  checker:
    closed: true
    required_fields: [identity, digest]
    fields:
      identity:
        ref: common.portable_identity
      digest:
        ref: common.digest
    concrete_release_identity_and_digest: distribution-owned
  artifact_binding:
    closed: true
    required_fields: [expected_sha256, observed_sha256, binding]
    fields:
      expected_sha256:
        ref: common.digest.value
      observed_sha256:
        type: [common.digest.value, "null"]
      binding:
        enum: [verified, unavailable, mismatched]
    invariants:
      verified: observed-present-and-equals-expected
      unavailable: observed-null
      mismatched: observed-present-and-not-equal-expected
  schema_binding:
    extends: validation_result.artifact_binding
    required_additional_fields: [identity]
    fields:
      identity:
        type: string
        min_length: 1
  contract_artifacts:
    closed: true
    required_fields: [core, extensions]
    fields:
      core:
        closed: true
        required_fields: [specification, executable, freshness_policy, schemas]
        fields:
          specification:
            ref: validation_result.artifact_binding
          executable:
            ref: validation_result.artifact_binding
          freshness_policy:
            ref: validation_result.artifact_binding
          schemas:
            type: array
            exact_items_in_order:
              - identity: urn:nkf:0.5:schema:bundle
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.5:schema:record
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.5:schema:graph-baseline
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.5:schema:freshness-receipt
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.5:schema:freshness-policy
                ref: validation_result.schema_binding
              - identity: urn:nkf:0.5:schema:validation-result
                ref: validation_result.schema_binding
      extensions:
        type: array
        order: exact-extension-id-rfc8785-unsigned-utf16
        ambiguous_or_invalid_identity: forbidden
        items:
          closed: true
          required_fields: [id, specification, executable]
          fields:
            id:
              ref: extensions.identifier
            specification:
              ref: validation_result.artifact_binding
            executable:
              ref: validation_result.artifact_binding
  request:
    closed: true
    required_fields: [level, record_id, acceptance_binding, purpose, require_readiness, changed_inputs, targets, observations, evaluation_time, historical_receipt]
    fields:
      level:
        enum: [structural, contract, full-bundle]
      record_id:
        type: [common.identifier, "null"]
      acceptance_binding:
        enum: [requested, not-requested]
      purpose:
        type: [string, "null"]
        enum_non_null: [change-impact, whole-root-readiness, consequential-use, historical-reproduction]
      require_readiness: {type: boolean}
      changed_inputs:
        type: array
        unique_items: true
        order: stable-input-reference-order
        items: {ref: freshness.changed_input}
      targets:
        type: array
        unique_items: true
        order: stable-node-reference-order
        items: {ref: common.node_reference}
      observations:
        type: array
        unique_by: id
        order: id-rfc8785-unsigned-utf16
        items: {ref: freshness.observation}
      evaluation_time: {type: [common.utc_millisecond_timestamp, "null"]}
      historical_receipt: {type: [string, "null"], pattern_non_null: "^freshness-[0-9a-f]{64}$"}
    variants:
      structural:
        record_id: "null"
        acceptance_binding: not-requested
        persistence: transient
        purpose: "null"
        require_readiness: false
      contract:
        record_id: required-non-null
        target_resolution: exactly-one-uniquely-identified-governed-record
        unresolved_diagnostic: request.record.unresolved
        unresolved_record_result: omitted
        acceptance_binding: [requested, not-requested]
        persistence: transient
      full-bundle:
        record_id: "null"
        acceptance_binding: [requested, not-requested]
        persistence: replace-project-receipt
    constraints:
      require_readiness_true_requires_non_null_purpose: true
      change_impact_requires_non_empty_changed_inputs: true
      consequential_use_requires_non_empty_targets: true
      other_current_purposes_require_empty_targets: true
      expiry_requires_non_null_evaluation_time: true
      no_applicable_expiry_requires_null_evaluation_time: true
      historical_reproduction_requires_non_null_historical_receipt: true
      other_purposes_require_null_historical_receipt: true
  validated_snapshot:
    closed: true
    required_fields: [algorithm, canonicalization, value, entry_count]
    fields:
      algorithm:
        const: sha-256
      canonicalization:
        const: rfc8785-jcs
      value:
        ref: common.digest.value
      entry_count:
        type: integer
        minimum: 0
  phases:
    type: array
    exact_items_in_order:
      - contracts
      - parse
      - schema
      - project
      - source
      - extension-resolution
      - bundle-graph
      - knowledge-graph
      - record-contract
      - freshness
      - security
      - authority-binding
      - result
    item:
      closed: true
      required_fields: [id, state]
      fields:
        id: {enum: [contracts, parse, schema, project, source, extension-resolution, bundle-graph, knowledge-graph, record-contract, freshness, security, authority-binding, result]}
        state: {enum: [passed, failed, not-evaluated]}
    result_phase_state_in_emitted_result: passed
    inability_to_construct_valid_result: no-completed-result
    completed_conformance_failure: valid-result
  knowledge_graph:
    closed: true
    required_fields: [policy, candidate_graph_revision, baseline_graph_revision, baseline_state, node_count, authored_edge_count, projection_counts]
    fields:
      policy:
        closed: true
        required_fields: [identity, digest, binding]
        fields:
          identity: {const: nkf.freshness-policy.0.5}
          digest: {ref: common.digest}
          binding: {enum: [verified, unavailable, mismatched]}
      candidate_graph_revision: {ref: common.digest}
      baseline_graph_revision: {type: [common.digest, "null"]}
      baseline_state: {enum: [confirmed, missing, outdated, disputed, ambiguous, unsupported, not-evaluated]}
      node_count: {type: integer, minimum: 0}
      authored_edge_count: {type: integer, minimum: 0}
      projection_counts:
        closed: true
        required_fields: [full, applicable, current]
        fields:
          full: {type: integer, minimum: 0}
          applicable: {type: integer, minimum: 0}
          current: {type: integer, minimum: 0}
  node_result:
    closed: true
    required_fields: [node, revision, applicability, participation_role, authority_eligibility, authority_binding, freshness, conformance, impact_selected, reason_paths]
    fields:
      node: {ref: common.node_reference}
      revision: {ref: common.digest}
      applicability: {enum: [applicable, not-applicable, unknown]}
      participation_role: {type: [string, "null"], enum_non_null: [governs, proposes, realizes, evidences, context, history]}
      authority_eligibility: {enum: [eligible, ineligible, unknown]}
      authority_binding: {enum: [verified, not-verified, contradicted, not-applicable]}
      freshness:
        type: array
        unique_items: true
        order: [stale, expired, invalidated, unknown, current]
        items:
          closed: true
          required_fields: [result, reasons]
          fields:
            result: {enum: [current, stale, expired, invalidated, unknown]}
            reasons: {type: array, min_items: 1, unique_items: true, order: rfc8785-unsigned-utf16}
      conformance: {enum: [passed, failed, not-evaluated]}
      impact_selected: {type: boolean}
      reason_paths: {type: array, unique_items: true, order: shortest-then-whole-entry-jcs-rfc8785-unsigned-utf16, items: {ref: freshness.reason_path}}
    current_mutually_exclusive_with_noncurrent: true
    non_applicable_freshness_empty: true
  readiness_result:
    closed: true
    required_fields: [purpose, state, baseline_graph_revision, candidate_graph_revision, blocking_nodes, blocking_rules]
    fields:
      purpose: {type: [string, "null"], enum_non_null: [change-impact, whole-root-readiness, consequential-use, historical-reproduction]}
      state: {enum: [ready, not-ready, not-evaluated]}
      baseline_graph_revision: {type: [common.digest, "null"]}
      candidate_graph_revision: {type: [common.digest, "null"]}
      blocking_nodes: {type: array, unique_items: true, order: stable-node-reference-order, items: {ref: common.node_reference}}
      blocking_rules: {type: array, unique_items: true, order: rfc8785-unsigned-utf16, items: {type: string, min_length: 1}}
    ready_by_purpose:
      change-impact: [confirmed-baseline-for-candidate, all-impact-selected-current, complete-decision-reconciliation, no-unresolved-conflict, all-required-observations-and-reviews-bound]
      whole-root-readiness: [confirmed-baseline-for-candidate, all-applicable-current, complete-decision-reconciliation, no-unresolved-conflict, all-required-observations-and-reviews-bound]
      consequential-use: [confirmed-baseline-for-candidate, all-target-closure-current, complete-decision-reconciliation, no-unresolved-conflict, all-required-observations-and-reviews-bound]
      historical-reproduction: [selected-receipt-binding-exact, receipt-inputs-policy-and-evaluator-reproduced, no-current-baseline-required]
    implies: none-of-acceptance-conformance-authority-binding-or-realization-confirmation
  record_result:
    closed: true
    required_fields: [record_id, declared_governance, conformance, acceptance_binding, governing_use]
    fields:
      record_id:
        ref: common.identifier
      declared_governance:
        type: [record.governance, "null"]
      conformance:
        enum: [passed, failed, not-evaluated]
        meaning: requested-level-relative
      acceptance_binding:
        enum: [not-applicable, not-verified, verified, contradicted]
      governing_use:
        enum: [ready, not-ready, not-evaluated]
    invalid_governance:
      declared_governance: "null"
      acceptance_binding: not-verified
      governing_use: not-ready
  readiness:
    record:
      draft_superseded_retired: [not-applicable, not-ready]
      accepted_binding_unavailable_or_unperformed: [not-verified, not-evaluated]
      accepted_contradicted: [contradicted, not-ready]
      accepted_verified_conforming_unblocked: [verified, ready]
      any_conformance_or_governing_blocker: not-ready
    project_full_bundle:
      every_applicable_record_ready: ready
      any_record_not_ready: not-ready
      otherwise_any_record_not_evaluated: not-evaluated
    top_level:
      structural: not-evaluated
      contract:
        unique_target: target-record-governing-use
        missing_or_ambiguous_target: not-ready
      full-bundle: project-full-bundle-aggregate
  persistence:
    completed_full_bundle_replaces_previous: true
    failed_full_bundle_replaces_previous_pass: true
    structural_or_contract_write: forbidden
    atomic_replace: required
    local_history: none
    external_history: permitted
  currentness:
    nkf_verified_means: current-full-bundle-conformance-only
    nkf_ready_means: requested-contextual-knowledge-readiness-ready
    requires:
      - matching-governed-validation-input-snapshot
      - current-core-specification-executable-and-schema-bindings
      - recognized-and-supported-checker-for-current-artifact-revision
    otherwise_status: verification-outdated
    outdated_receipt_remains: historical-operational-evidence
    context_free_universal_expiry: none
    contextual_document_freshness: freshness
    external_authority_polling: none
    future_investigation: NKF-005
  excludes:
    - usernames
    - hostnames
    - absolute-project-paths
    - credentials
    - secrets
    - copied-operational-payloads
    - acceptance-assertion-from-conformance
    - realization-confirmation-from-conformance

release_distribution:
  initial_channel: github-release
  repository: "https://github.com/kaveh6202/Nourd.NKF.git"
  public_distribution: unresolved
  operational_state_authority: github
  manifest:
    identity: nkf.release-manifest
    nkf_version: "0.5"
    path: release-manifest.json
    encoding:
      character_encoding: UTF-8
      bom: forbidden
      data_model: JSON
      root: one-object
      comments: forbidden
      duplicate_keys: forbidden
      non_json_values: forbidden
      indentation_spaces: 2
      line_endings: LF
      final_lf: exactly-one
      trailing_whitespace: forbidden
      member_order: contract-order
    closed: true
    required_fields: [contract, nkf_version, source, checker, authority, freshness_policy, schemas, files]
    fields:
      contract:
        const: nkf.release-manifest
      nkf_version:
        const: "0.5"
      source:
        ref: release_distribution.source
      checker:
        ref: release_distribution.checker
      authority:
        ref: release_distribution.authority
      freshness_policy:
        ref: release_distribution.freshness_policy
      schemas:
        ref: release_distribution.schemas
      files:
        ref: release_distribution.files
    omitted_fields:
      - manifest-self-digest
      - containing-archive-digest
      - asset-name
      - tag
      - release-url
      - publication-time
      - latest-status
      - mutable-github-state
      - audit-evidence
      - technical-confirmation
      - publication-authorization
    post_audit_governance_binding:
      location: outside-release-archive-and-manifest
      may_bind: [release-commit, archive-digest, checker-digest]
      may_change_archive_bytes: false
  source:
    closed: true
    required_fields: [repository, release_commit]
    fields:
      repository:
        const: "https://github.com/kaveh6202/Nourd.NKF.git"
      release_commit:
        type: string
        pattern: '^[0-9a-f]{40}$'
    checker_build_source: release_commit
  checker:
    closed: true
    required_fields: [identity, path, digest, runtime]
    fields:
      identity:
        const: nourd-nkf-checker
      path:
        const: dist/nourd-nkf-checker.mjs
      digest:
        ref: common.digest
      runtime:
        ref: release_distribution.runtime
  runtime:
    closed: true
    required_fields: [name, minimum_major]
    fields:
      name:
        const: node
      minimum_major:
        const: 22
  authority:
    closed: true
    required_fields: [precedence, markdown, executable]
    fields:
      precedence:
        const: normative-markdown
      markdown:
        ref: release_distribution.markdown_artifact
      executable:
        ref: release_distribution.executable_artifact
  markdown_artifact:
    closed: true
    required_fields: [path, digest]
    fields:
      path:
        const: knowledge/specifications/nkf-0.5.md
      digest:
        ref: common.digest
  executable_artifact:
    closed: true
    required_fields: [path, digest]
    fields:
      path:
        const: contracts/nkf/0.5/nkf.yaml
      digest:
        ref: common.digest
  freshness_policy:
    closed: true
    required_fields: [identity, path, digest]
    fields:
      identity: {const: nkf.freshness-policy.0.5}
      path: {const: contracts/nkf/0.5/freshness-policy.yaml}
      digest: {ref: common.digest}
  schema_artifact:
    closed: true
    required_fields: [identity, path, digest]
    fields:
      identity:
        type: string
      path:
        type: string
      digest:
        ref: common.digest
  schemas:
    type: array
    exact_items_in_order:
      - identity: urn:nkf:0.5:schema:bundle
        path: contracts/nkf/0.5/schemas/bundle.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.5:schema:record
        path: contracts/nkf/0.5/schemas/record.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.5:schema:graph-baseline
        path: contracts/nkf/0.5/schemas/graph-baseline.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.5:schema:freshness-receipt
        path: contracts/nkf/0.5/schemas/freshness-receipt.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.5:schema:freshness-policy
        path: contracts/nkf/0.5/schemas/freshness-policy.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.5:schema:release-manifest
        path: contracts/nkf/0.5/schemas/release-manifest.schema.json
        ref: release_distribution.schema_artifact
      - identity: urn:nkf:0.5:schema:validation-result
        path: contracts/nkf/0.5/schemas/validation-result.schema.json
        ref: release_distribution.schema_artifact
  release_path:
    type: string
    safe_relative_release_path: true
  file_artifact:
    closed: true
    required_fields: [path, mode, digest]
    fields:
      path:
        ref: release_distribution.release_path
      mode:
        value_by_path:
          dist/nourd-nkf-checker.mjs: "0755"
          otherwise: "0644"
      digest:
        ref: common.digest
  files:
    type: array
    min_items: 1
    order: exact-release-set-order-excluding-release-manifest
    exact_membership: release_distribution.release_set.members-excluding-release-manifest
    items:
      ref: release_distribution.file_artifact
    unique_paths: true
    checker_authority_freshness_policy_and_schema_bindings_match: required
  schema:
    identity: urn:nkf:0.5:schema:release-manifest
    path: contracts/nkf/0.5/schemas/release-manifest.schema.json
    scope: release-package-enforcement-only
    project_declaration_schema: false
    governed_validation_input: false
    validation_result_contract_artifact: false
    self_digest_location: release-manifest
  release_set:
    path: contracts/nkf/0.5/release-set.yaml
    identity: nkf.release-set
    closed: true
    required_fields: [contract, nkf_version, coverage, members]
    fields:
      contract:
        const: nkf.release-set
      nkf_version:
        const: "0.5"
      coverage:
        ref: release_distribution.release_set.coverage
      members:
        ref: release_distribution.release_set.members
    class:
      enum:
        - normative-specification
        - executable-companion
        - evaluation-policy
        - release-set-contract
        - release-manifest
        - derived-schema
        - checker
        - adopter
        - authoring-protocol
        - onboarding-protocol
        - release-protocol
        - adoption-protocol
        - portable-skill
        - host-adapter-instruction
        - product-fixture
        - technology-fixture
        - product-public-example
        - technology-public-example
        - public-documentation
    selector:
      closed: true
      required_fields: [class, selection, path]
      fields:
        class:
          ref: release_distribution.release_set.class
        selection:
          enum: [exact-file, recursive-regular-files, generated-release-manifest]
        path:
          ref: release_distribution.release_path
    coverage:
      type: array
      min_items: 1
      items:
        ref: release_distribution.release_set.selector
      order: exact-class-then-ascii-path
      unique_paths: true
      selector_paths_disjoint: true
      required_classes: exact-release_distribution.release_set.class-enum
      class_minimum_matches: 1
      selection_rules:
        exact-file: existing-regular-file-in-clean-built-source
        recursive-regular-files: every-recursive-regular-file-beneath-existing-non-empty-source-directory
        generated-release-manifest: exact-release-manifest.json-only
      links_devices_unsafe_paths_empty_recursive_and_multiple_matches: forbidden
    member:
      closed: true
      required_fields: [path, class, mode]
      fields:
        path:
          ref: release_distribution.release_path
        class:
          ref: release_distribution.release_set.class
        mode:
          value_by_path:
            dist/nourd-nkf-checker.mjs: "0755"
            otherwise: "0644"
    members:
      type: array
      min_items: 1
      items:
        ref: release_distribution.release_set.member
      order: exact-ascii-path
      unique_paths: true
      exact_union_of_coverage_after_deterministic_builds: true
      member_class_matches_selector: required
      includes_self: true
      includes_release_manifest: true
      required_member_classes: exact-release_distribution.release_set.class-enum
      source_provenance_verification: reproduce-exact-coverage-union-from-clean-release-commit
      extraction_only_verification: verify-content-addressed-enumeration-class-presence-modes-membership-and-manifest-bindings
    sole_consumers:
      - archive-construction
      - manifest-construction
      - release-verification
      - internal-exact-candidate-adopt
      - public-adopt
      - deterministic-set-operation
      - public-documentation-verification
    second-hand-maintained-membership-list: forbidden
  archive:
    uploaded_distribution_asset_count: 1
    filename_pattern: '^nourd-nkf-sha256-[0-9a-f]{64}\.tar$'
    digest:
      algorithm: sha-256
      filename_value_must_equal_archive_digest: true
    format: ustar
    compression: none
    root: nourd-nkf
    entry_kind: regular-file-only
    explicit_directory_entries: forbidden
    entry_order: exact-ascii-path
    member_source: release_distribution.release_set.members
    exact_membership_and_modes: required
    forbidden:
      - symlink
      - hard-link
      - device
      - absolute-path
      - traversal
      - duplicate-path
      - case-colliding-path
      - unexpected-entry
    ustar:
      modification_time: 0
      uid: 0
      gid: 0
      user_name: ""
      group_name: ""
      link_name: ""
      magic_bytes_hex: "75 73 74 61 72 00"
      version_bytes_hex: "30 30"
      path_storage: name-field-only
      prefix_field: ""
      numeric_encoding: zero-padded-ascii-octal
      type_flag_byte_hex: "30"
      device_major: 0
      device_minor: 0
      file_size: derived-exact-byte-count
      header_checksum: derived-standard-ustar
      content_padding: zero-filled
      final_zero_blocks: 2
      trailing_bytes_after_final_blocks: forbidden
      base_256_numbers: forbidden
      pax_extensions: forbidden
  packaging:
    source_tree: clean-release-commit
    steps:
      - complete-accepted-development-check
      - build-checker-twice
      - require-byte-identical-checker-builds-from-release-commit
      - verify-authority-and-schema-digests
      - reproduce-release-set-coverage-and-verify-sole-membership-enumeration
      - construct-and-schema-validate-manifest
      - assemble-archive-twice
      - require-reproducible-checker-and-archive-digests
    failure_behavior: no-release-artifact
  consumer_pin:
    storage: consumer-dependency-or-tooling-configuration
    required_fields: [repository, archive-sha256]
    tag_and_asset_name: derived-from-archive-sha256
    cached_durable_locator: transport-only
    bundle_field: forbidden
    independently_trusted_archive_digest: required
  verification:
    order:
      - verify-archive-sha256
      - reject-unsafe-archive
      - strict-parse-manifest-and-bootstrap-fixed-contract-version-and-schema-entry
      - verify-release-manifest-schema-digest
      - compile-schema-and-validate-release-manifest
      - verify-release-set-and-required-member-classes
      - verify-release-set-coverage-and-member-class-bindings
      - verify-manifest-files-match-release-set-excluding-manifest
      - verify-all-pre-manifest-paths-modes-and-digests
      - verify-release-commit-and-reproducible-checker-when-source-provenance-is-evaluated
      - reject-missing-or-unexpected-file
      - invoke-checker
    failure:
      classification: execution-level
      checker_invocation: forbidden
      project_validation_result: forbidden
      nkf_verified_claim: forbidden
  github_release:
    uploaded_distribution_asset_count: 1
    github_generated_source_archives: excluded-non-distribution
    tag_pattern: '^release-sha256-[0-9a-f]{64}$'
    tag_digest_equals_archive_digest: true
    tag_target_equals_release_commit: true
    tag_kind: lightweight
    annotated_tag: forbidden
    preparation_state: draft
    publication_class: prerelease
    prepublication_reverification: required
    immutable_release_when_supported: should
    artifact_attestation:
      status: optional
      substitutes_for_archive_digest: false

compatibility:
  supported_predecessors:
    - from_nkf_version: "0.1"
      to_nkf_version: "0.5"
      classification: breaking
      migration_required: true
      repository_owner_approval_before_mutation: required
    - from_nkf_version: "0.2"
      to_nkf_version: "0.5"
      classification: breaking
      migration_required: true
      repository_owner_approval_before_mutation: required
    - from_nkf_version: "0.3"
      to_nkf_version: "0.5"
      classification: breaking
      migration_required: true
      repository_owner_approval_before_mutation: required
    - from_nkf_version: "0.4"
      to_nkf_version: "0.5"
      classification: breaking
      migration_required: true
      repository_owner_approval_before_mutation: required
    - from_nkf_version: "0.5"
      to_nkf_version: "0.5"
      classification: non-breaking
      migration_required: false
      repository_owner_approval_before_mutation: not-required
  migration_0_5:
    preserve_canonical_markdown_bytes: required
    preserve_existing_task_and_design_paths: required
    document_node_allocation:
      existing_task: preserve-exact-task-id-as-document-id
      new_task: explicit-task-id-equals-document-id
      other_document: document-prefix-plus-sha256-bundle-id-NUL-initial-path
      collision_missing-or-unsafe-task-id: fail-before-mutation
      persisted: required
    lifecycle_state_conversion: declaration-owned
    legacy_lock:
      required_for: preserved-source-with-now-forbidden-mutable-state-key
      source_digest: exact
      predecessor_state: exact-complete-present-mutable-state-projection
      initial_declaration_state: exact-complete-converted-declaration-projection
      predecessor-to-initial-conversion: exact-bundle-legacy-lock-conversion-rules
      authority_mapping: required-exactly-for-record-decision-authority
    generated_navigation:
      task_paths: tasks/by-state
      design_paths: designs/by-disposition
      canonical_markdown_rewrite: forbidden
    graph_candidate: required
    semantic_whole_root_review: required
    named_reviewer: human-or-agent
    confirmed_baseline_before-seal: required
    mechanical_tool_may_infer-semantic-completeness: false
  operation_and_release_order_authority: versioned-release-and-adoption-protocols

security:
  prohibited:
    - live-credentials
    - access-tokens
    - private-keys
    - secrets
  scan_scope:
    byte_semantics: exact-utf8-source-bytes
    native_inputs:
      - .nourd/knowledge/bundle.yaml
      - every-direct-.yaml-declaration-candidate
      - every-recursive-markdown-under-knowledge-root
    governed_validation_inputs: true
    unsafe_path_following: forbidden
    additional_resource_kind_requires: accepted-extension-rule
  registry:
    matching: ascii-byte-case-sensitive
    exact_detector_classes:
      - complete-private-key-block
      - github-prefixed-token
      - openai-prefixed-token
    complete_private_key_block:
      header_form: five-hyphens-BEGIN-space-LABEL-five-hyphens
      footer_form: five-hyphens-END-space-same-LABEL-five-hyphens
      labels:
        - PRIVATE KEY
        - RSA PRIVATE KEY
        - EC PRIVATE KEY
        - DSA PRIVATE KEY
        - OPENSSH PRIVATE KEY
        - ENCRYPTED PRIVATE KEY
      ignored_between: [ascii-space, horizontal-tab, carriage-return, line-feed]
      remaining_alphabet: [A-Z, a-z, 0-9, +, /, =]
      minimum_remaining_bytes: 64
    github_prefixed_token:
      prefixes: [ghp_, gho_, ghu_, ghs_, ghr_]
      body_alphabet: [A-Z, a-z, 0-9]
      minimum_body_bytes: 36
      preceding_boundary_excludes: [A-Z, a-z, 0-9, _]
      following_boundary_excludes: [A-Z, a-z, 0-9]
    openai_prefixed_token:
      prefixes_longest_first: [sk-proj-, sk-]
      body_alphabet: [A-Z, a-z, 0-9, _, "-"]
      minimum_body_bytes: 20
      preceding_boundary_excludes: [A-Z, a-z, 0-9, _, "-"]
      following_boundary_excludes: [A-Z, a-z, 0-9, _, "-"]
  contextual_exemptions: none
  inline_ignore_or_allowlist: none
  nonmatching_placeholders:
    - "ghp_<REDACTED>"
    - "sk-..."
    - "${TOKEN}"
    - "<SECRET>"
  explicitly_nonblocking_without_additional_accepted_rule:
    - aws-access-key-identifier-alone
    - generic-password-looking-text
    - jwt
    - hash
    - digest
    - base64-string
    - entropy-finding
    - unregistered-provider-token
  diagnostic:
    rule_id: security.secret-pattern
    cardinality: at-most-one-per-logical-artifact
    severity: error
    blocking: conformance
    phase: security
    matched-value: forbidden
    surrounding-source: forbidden
    copied-payload: forbidden
  high_confidence_finding_fails_conformance: true
  passing_scan_proves_absence: false
  supplemental_scanners:
    native_result_participation: forbidden
    native_conformance_effect: forbidden
    accepted_namespaced_extension_rule: permitted
  registry_change_requires:
    - governed-nkf-decision
    - replacement-authority-pair
    - derived-fixtures-and-checker-update
    - governed-release
    - deliberate-consumer-migration
  sensitive_bundle_access_policy: out-of-scope

human_review:
  deterministic_validation_cannot_establish:
    - semantic-role-accuracy
    - responsibility-binding-accuracy
    - markdown-truth
    - markdown-adequacy
    - markdown-safety
    - governed-knowledge-completeness
    - evidence-support
    - deserved-acceptance
    - external-authority-currency
    - locator-currency
    - design-quality
    - realization-existence
    - realization-behavior
    - graph-semantic-completeness
    - relationship-semantic-truth
    - decision-classification-truth
    - semantic-review-quality
    - reviewer-authority
