contract: nkf.contract-set
nkf_version: "0.5"

authority:
  precedence: normative-markdown
  markdown_path: knowledge/specifications/nkf-0.5.md
  executable_path: contracts/nkf/0.5/nkf.yaml
  markdown_digest:
    algorithm: sha-256
    value: d93e8da4e3abeb7d047d15351f2003d2d242596790fb7db94be994b7e88499dc
  accepted_baseline:
    markdown_path: knowledge/specifications/nkf-0.4.md
    markdown_digest:
      algorithm: sha-256
      value: 7298d1a55dcd74d4cc96368648aadbd6a70b5cf4c62d2a1c7f528e7c9181bab1
    executable_path: contracts/nkf/0.4/nkf.yaml
    executable_digest:
      algorithm: sha-256
      value: a84fcc1e99567b6716e3281efedbbc87c978ffa465cd4cb5d8cac1d46ad0d217
  governing_decisions:
    - ADR-0001
    - ADR-0002
    - ADR-0003
    - ADR-0005
    - ADR-0006
    - ADR-0007
    - ADR-0008
    - ADR-0009
    - ADR-0010
    - ADR-0011
    - ADR-0012
    - ADR-0013
    - ADR-0014
    - ADR-0015
    - ADR-0016
    - ADR-0017
    - ADR-0018
    - ADR-0019
    - ADR-0020
    - ADR-0021
    - ADR-0022
    - ADR-0024
    - ADR-0025
    - ADR-0026
    - ADR-0027
    - ADR-0028
    - ADR-0029
    - ADR-0032
    - ADR-0034
    - ADR-0035
    - ADR-0036
    - ADR-0038
    - ADR-0039
    - ADR-0042
    - ADR-0043
    - ADR-0044
    - ADR-0045
    - ADR-0049
    - ADR-0050
    - ADR-0053
    - ADR-0054
    - ADR-0055
    - ADR-0056
    - ADR-0058
    - ADR-0071
    - ADR-0072
    - ADR-0073
    - ADR-0076
    - ADR-0077
    - ADR-0078
    - ADR-0079
    - ADR-0109
    - ADR-0113
    - ADR-0115
  conflict_behavior: fail-closed
  semantic_acceptance_from_validation: false
  realization_confirmation_from_validation: false

versioning:
  coordinate: major-minor
  current: "0.5"
  stable_reserved: "1.0"
  candidate:
    mutable_until: authenticated-publication
    byte_changes_before_publication: permitted
    prior_exact_byte_claims_after_change: not-applicable
  freeze:
    trigger: authenticated-publication-of-exact-content-addressed-archive-and-manifest-under-release-tag
    applies_to: every-complete-set-member
    consumer_adoption_required: false
    later_member_change_requires_new_nkf_version: true
    in_place_replace_delete_overwrite_or_rebind: forbidden
  defective_release:
    recommendation_removal: permitted
    withdrawn_or_superseded_status: permitted-operationally
    immutable_release_history_preserved: required
  non_allocating_operational_records:
    - task-lifecycle
    - audit-evidence
    - recommendation-state
    - publication-observations

native_checker_invocation:
  candidate_project_root:
    type: directory
  project_nourd_precondition:
    path: .nourd
    base: candidate-project-root
    evaluated_before_validation: true
    required_direct_entry: true
    resolution:
      must_be_safe: true
      final_kind: directory
      must_be_inside_candidate_project_root: true
    failure:
      classification: execution-level
      native_diagnostic: none
      validation_result_construction: forbidden
      validation_result_persistence: forbidden
      create_replace_or_repair: forbidden
      unsafe_path_following: forbidden

yaml_data_model:
  encoding: UTF-8
  yaml_version: "1.2"
  model: JSON-compatible
  document_count: 1
  root_type: mapping
  string_keys_only: true
  permitted_values:
    - "null"
    - boolean
    - finite-number
    - string
    - array
    - mapping
  duplicate_keys: forbidden
  custom_tags: forbidden
  merge_keys: forbidden
  anchors: forbidden
  aliases: forbidden
  comments_semantic: false
  whitespace_semantic: false
  constructors: forbidden
  environment_interpolation: forbidden
  parse_time_external_resolution: forbidden

common:
  identifier:
    type: string
    min_length: 1
    lexical_grammar: unspecified
  portable_identity:
    type: string
    min_length: 1
    max_length: 256
    pattern: "^[^\\u0000-\\u001f\\u007f]+$"
  lowercase_uuid:
    type: string
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  utc_millisecond_timestamp:
    type: string
    format: date-time
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:(?:[0-5][0-9]|60)\\.[0-9]{3}Z$"
  digest:
    closed: true
    required_fields: [algorithm, value]
    fields:
      algorithm:
        const: sha-256
      value:
        type: string
        pattern: "^[0-9a-f]{64}$"
  entity_reference:
    closed: true
    required_fields: [record, entity]
    fields:
      record:
        ref: common.identifier
      entity:
        ref: common.identifier
    resolution: same-bundle-declared-entity
  node_reference:
    one_of:
      - closed: true
        required_fields: [kind, id]
        fields:
          kind: {const: record}
          id: {ref: common.identifier, resolves_to: same-bundle-record-node}
      - closed: true
        required_fields: [kind, id]
        fields:
          kind: {const: document}
          id: {ref: common.identifier, resolves_to: same-bundle-document-node}
      - closed: true
        required_fields: [kind, record, entity]
        fields:
          kind: {const: entity}
          record: {ref: common.identifier, resolves_to: same-bundle-record}
          entity: {ref: common.identifier, resolves_to: entity-in-referenced-record}
    path_identity: forbidden
    cross_bundle: unsupported
  heading_reference:
    closed: true
    required_fields: [heading_path, occurrence]
    fields:
      heading_path:
        type: array
        min_items: 1
        items: {type: string, min_length: 1}
        order_semantic: true
      occurrence: {type: integer, minimum: 1}
    resolution: same-commonmark-comparison-as-record-sections
  task_or_record_reference:
    one_of:
      - closed: true
        required_fields: [kind, id]
        fields:
          kind: {const: task-document}
          id: {ref: common.identifier, resolves_to: same-bundle-task-document-node}
      - closed: true
        required_fields: [kind, id]
        fields:
          kind: {const: record}
          id: {ref: common.identifier, resolves_to: same-bundle-record}
  extension_use:
    closed: true
    required_fields: [contract, requirement, payload]
    fields:
      contract:
        ref: extensions.identifier
      requirement:
        enum: [required, optional]
      payload:
        type: any-json-compatible-value

bundle:
  identity: nkf.bundle
  manifest_path: .nourd/knowledge/bundle.yaml
  closed: true
  required_fields:
    - nkf_version
    - contract
    - id
    - root
    - knowledge_root
    - non_records
    - knowledge_graph
  optional_fields:
    - canonical_terms
    - governed_artifacts
    - external_dependencies
    - authority_inputs
    - extension_contracts
    - extensions
  forbidden_legacy_fields:
    - product_record
    - record_contract
    - markdown_root
    - records_root
    - required_extensions
  fields:
    nkf_version:
      const: "0.5"
    contract:
      const: nkf.bundle
    id:
      ref: common.identifier
    root:
      closed: true
      required_fields: [record, profile]
      fields:
        record:
          ref: common.identifier
          resolves_to: unique-profile-root-record
        profile:
          ref: common.identifier
          resolves_to: supported-selectable-root-profile
    knowledge_root:
      ref: paths.knowledge_root
    non_records:
      type: array
      required: true
      may_be_empty: true
      order_semantic: false
      items:
        ref: bundle.non_record
    knowledge_graph:
      ref: bundle.knowledge_graph
    canonical_terms:
      type: array
      min_items: 1
      unique_items: true
      order_semantic: false
      items:
        type: string
        min_length: 1
        leading_or_trailing_whitespace: forbidden
        internal_whitespace: one-U+0020
        markdown_markup: forbidden
        casing: exact
      omit_when_empty: true
      core_terms: [NKF]
      core_conflict_comparison: unicode-17-default-caseless-matching
    governed_artifacts:
      type: array
      min_items: 1
      unique_by: id
      order_semantic: false
      items:
        ref: bundle.governed_artifact
      allowed_by_profile: [nkf.profile.technology]
      omit_when_empty: true
    external_dependencies:
      type: array
      min_items: 1
      unique_by: id
      order_semantic: false
      items: {ref: bundle.external_dependency}
      omit_when_empty: true
    authority_inputs:
      type: array
      min_items: 1
      unique_by: id
      order_semantic: false
      items: {ref: bundle.authority_input}
      omit_when_empty: true
    extension_contracts:
      ref: extensions.catalog
      omit_when_empty: true
    extensions:
      type: array
      unique_by: contract
      items:
        ref: common.extension_use
      omit_when_empty: true
  non_record:
    closed: true
    required_fields: [path, kind]
    optional_fields: [reason, document]
    fields:
      path:
        ref: paths.knowledge_relative_file
        must_exist: true
        file_kind: regular-file
      kind:
        enum: [navigation, task, evidence, generated, redirect, other]
      reason:
        type: string
        min_length: 1
        required_when:
          field: kind
          equals: other
      document:
        ref: bundle.document
    document_requirement:
      task: required
      evidence: required
      navigation: optional
      other: optional
      generated: forbidden
      redirect: forbidden
    path_unique_after_resolution: true
    may_conflict_with_record_source: false
    document_id_collides_with_record_id: forbidden
  document:
    closed: true
    required_fields: [id, stable_path, digest, relationships]
    optional_fields: [state, freshness, owner, decision_authority, related_tasks, legacy_lock]
    fields:
      id:
        ref: common.identifier
        unique_scope: bundle-record-and-document-nodes
        stable_across_path_change: true
      stable_path:
        ref: paths.knowledge_relative_file
        equals: enclosing-non-record-path
        canonical_path_change_after-onboarding-or-migration: forbidden
      digest:
        ref: common.digest
        binds: exact-non-record-markdown-bytes
      state:
        ref: bundle.document_state
      relationships:
        type: array
        required: true
        may_be_empty: true
        order_semantic: false
        items: {ref: bundle.document_relationship}
      freshness:
        ref: freshness.declaration
      owner: {type: string, min_length: 1}
      decision_authority: {type: string, min_length: 1}
      related_tasks:
        type: array
        min_items: 1
        unique_items: true
        order_semantic: false
        items: {ref: common.identifier, resolves_to: same-bundle-task-document-node}
      legacy_lock:
        ref: bundle.legacy_lock
    kind_variants:
      task:
        required_fields: [state]
        permitted_optional_fields: [freshness, owner, decision_authority, related_tasks, legacy_lock]
        required_state_vocabulary: task-status
      evidence:
        forbidden_fields: [state, owner, decision_authority, related_tasks]
        permitted_optional_fields: [freshness, legacy_lock]
      navigation:
        forbidden_fields: [state, owner, decision_authority, related_tasks]
        permitted_optional_fields: [freshness, legacy_lock]
      other:
        forbidden_fields: [state, owner, decision_authority, related_tasks]
        permitted_optional_fields: [freshness, legacy_lock]
    identity_generation:
      task_migration:
        source: exact-existing-task-id
        equals: document-id
        missing_unsafe_or_conflicting: fail-before-mutation
        silent_rename: forbidden
      task_native_0_5:
        source: explicit-stable-task-id-at-creation
        equals: document-id
      every_other_migrated_document:
        prefix: document-
        digest: sha-256
        input: utf8-bundle-id-then-NUL-then-initial-knowledge-relative-path
      allocation_occurs_once: true
      path_participates_after_allocation: false
  document_state:
    closed: true
    required_fields: [vocabulary, value]
    optional_fields: [basis]
    fields:
      vocabulary: {enum: [task-status]}
      value: {enum: [active, deferred, completed, cancelled]}
      basis:
        type: array
        min_items: 1
        unique_items: true
        order_semantic: false
        items: {ref: common.task_or_record_reference}
  document_relationship:
    closed: true
    required_fields: [type, target, source_heading]
    fields:
      type: {ref: vocabularies.graph_relationship_types}
      target: {ref: common.node_reference}
      source_heading: {ref: common.heading_reference, resolves_to: declaring-document-heading}
    exact_duplicates: forbidden
    authored_inverse: forbidden
  legacy_lock:
    closed: true
    required_fields: [predecessor_version, source_digest, predecessor_state, initial_declaration_state]
    optional_fields: [authority_mapping]
    fields:
      predecessor_version: {enum: ["0.1", "0.2", "0.3", "0.4"]}
      source_digest: {ref: common.digest}
      predecessor_state:
        closed: true
        at_least_one: [record_lifecycle, record_status, decision_authority, task, design_disposition, design_decisions, superseded_by, withdrawal_source, proposal_authority_effect, proposal_evidence, implementation_evidence, confirmation_status, confirmation_decisions, unconfirmed_scope, task_id, task_status, owner, related_tasks]
        optional_fields: [record_lifecycle, record_status, decision_authority, task, design_disposition, design_decisions, superseded_by, withdrawal_source, proposal_authority_effect, proposal_evidence, implementation_evidence, confirmation_status, confirmation_decisions, unconfirmed_scope, task_id, task_status, owner, related_tasks]
        fields:
          record_lifecycle: {enum: [living, immutable]}
          record_status: {enum: [draft, accepted, superseded, retired]}
          decision_authority: {type: string, min_length: 1}
          task: {ref: common.identifier}
          design_disposition: {enum: [active, adopted, rejected, superseded, withdrawn]}
          design_decisions: {type: array, min_items: 1, unique_items: true, order_semantic: false, items: {ref: common.identifier}}
          superseded_by: {type: array, min_items: 1, unique_items: true, order_semantic: false, items: {ref: common.identifier}}
          withdrawal_source: {closed: true, required_fields: [kind, id], fields: {kind: {enum: [task, record]}, id: {ref: common.identifier}}}
          proposal_authority_effect: {type: string, min_length: 1}
          proposal_evidence: {type: string, min_length: 1}
          implementation_evidence: {type: string, min_length: 1}
          confirmation_status: {enum: [unconfirmed, partially-confirmed, confirmed]}
          confirmation_decisions: {type: array, min_items: 1, unique_items: true, order_semantic: false, items: {ref: common.identifier}}
          unconfirmed_scope: {type: string, min_length: 1}
          task_id: {ref: common.identifier}
          task_status: {enum: [active, deferred, completed, cancelled]}
          owner: {type: string, min_length: 1}
          related_tasks: {type: array, min_items: 1, unique_items: true, order_semantic: false, items: {ref: common.identifier}}
      initial_declaration_state:
        closed: true
        at_least_one: [governance, task, design_disposition, design_decisions, superseded_by, withdrawal_source, proposal_authority_effect, proposal_evidence, implementation_evidence, confirmation_status, confirmation_decisions, unconfirmed_scope, document_state, owner, decision_authority, related_tasks]
        optional_fields: [governance, task, design_disposition, design_decisions, superseded_by, withdrawal_source, proposal_authority_effect, proposal_evidence, implementation_evidence, confirmation_status, confirmation_decisions, unconfirmed_scope, document_state, owner, decision_authority, related_tasks]
        fields:
          governance: {ref: record.governance}
          task: {ref: common.identifier}
          design_disposition: {enum: [active, adopted, rejected, superseded, withdrawn]}
          design_decisions: {type: array, min_items: 1, unique_items: true, order_semantic: false, items: {ref: common.identifier}}
          superseded_by: {type: array, min_items: 1, unique_items: true, order_semantic: false, items: {ref: common.identifier}}
          withdrawal_source: {closed: true, required_fields: [kind, id], fields: {kind: {enum: [task, record]}, id: {ref: common.identifier}}}
          proposal_authority_effect: {type: string, min_length: 1}
          proposal_evidence: {type: string, min_length: 1}
          implementation_evidence: {type: string, min_length: 1}
          confirmation_status: {enum: [unconfirmed, partially-confirmed, confirmed]}
          confirmation_decisions: {type: array, min_items: 1, unique_items: true, order_semantic: false, items: {ref: common.identifier}}
          unconfirmed_scope: {type: string, min_length: 1}
          document_state: {ref: bundle.document_state}
          owner: {type: string, min_length: 1}
          decision_authority: {type: string, min_length: 1}
          related_tasks: {type: array, min_items: 1, unique_items: true, order_semantic: false, items: {ref: common.identifier}}
      authority_mapping:
        closed: true
        required_fields: [source_value, authority_ids, approved_by]
        fields:
          source_value: {type: string, min_length: 1, equals: predecessor-state-decision-authority}
          authority_ids: {type: array, min_items: 1, unique_items: true, order_semantic: false, items: {ref: common.identifier}, equals: initial-declaration-state-governance-authority}
          approved_by: {const: repository-owner}
        required_exactly_when: predecessor-is-record-and-carries-decision-authority
        forbidden_when: predecessor-is-document
    source_digest_equals: enclosing-record-source-digest-or-document-digest
    predecessor_state_equals_exact-source-frontmatter-mutable-state-projection: true
    initial_declaration_state_equals_exact-post-migration-declaration-projection: true
    conversion_rules:
      record_lifecycle: governance.lifecycle
      record_status: governance.status
      decision_authority:
        record: governance.authority-from-explicit-migration-authority-mapping
        document: document.decision_authority-exact-predecessor-string
      task: record.task
      design_disposition: record.design_disposition
      design_decisions: record.design_decisions
      superseded_by: record.superseded_by
      withdrawal_source: record.withdrawal_source
      proposal_authority_effect: record.proposal_authority_effect
      proposal_evidence: record.proposal_evidence
      implementation_evidence: record.implementation_evidence
      confirmation_status: record.confirmation_status
      confirmation_decisions: record.confirmation_decisions
      unconfirmed_scope: record.unconfirmed_scope
      task_id: document.id
      task_status: document.state.value-with-vocabulary-task-status
      owner: document.owner
      related_tasks: document.related_tasks
    authority_mapping_does_not_prove_authority: true
    exact_conversion_or-missing-target-field-or-authority-mapping: fail-before-mutation
    source_byte_change_removes_exemption: true
    lifecycle_frontmatter_current_authority: false
  accepted_bootstrap_lock:
    closed: true
    required_fields: [predecessor_version, source_digest, accepting_decision, predecessor_state, current_state]
    fields:
      predecessor_version: {const: "0.4"}
      source_digest: {ref: common.digest}
      accepting_decision:
        closed: true
        required_fields: [id, digest]
        fields:
          id: {ref: common.identifier, resolves_to: same-bundle-accepted-decision-record}
          digest: {ref: common.digest}
      predecessor_state:
        closed: true
        required_fields: [record_lifecycle, record_status, decision_authority, task]
        fields:
          record_lifecycle: {const: living}
          record_status: {const: draft}
          decision_authority: {type: string, min_length: 1, equals: exact-source-frontmatter-value}
          task: {const: NKF-026}
      current_state:
        closed: true
        required_fields: [lifecycle, status]
        fields:
          lifecycle: {const: immutable}
          status: {const: accepted}
    source_digest_equals: enclosing-record-source-digest
    accepting_decision_digest_equals: resolved-decision-source-digest
    accepting_decision_exactly_accepts: enclosing-record-source-and-nkf-0.5-executable-companion
    only_for: version-canonical-nkf-0.5-specification
    predecessor_frontmatter_current_authority: false
    validation_or_lock_proves_acceptance: false
  external_dependency:
    closed: true
    required_fields: [id, authority, dependent, relationship, source_binding, source, revision, observability]
    fields:
      id: {ref: common.identifier}
      authority: {type: string, min_length: 1}
      dependent: {ref: common.node_reference}
      relationship: {const: depends-on}
      source_binding:
        one_of:
          - {closed: true, required_fields: [kind, node, section], fields: {kind: {const: section}, node: {ref: common.node_reference, kind_in: [record, entity]}, section: {ref: common.identifier, resolves_to: source-node-owning-record-section}}}
          - {closed: true, required_fields: [kind, node, heading], fields: {kind: {const: heading}, node: {ref: common.node_reference, kind_const: document}, heading: {ref: common.heading_reference, resolves_to: source-document-heading}}}
        node_equals: dependent
      source:
        closed: true
        at_least_one: [repository, bundle]
        optional_fields: [repository, bundle]
        fields:
          repository: {type: string, min_length: 1}
          bundle: {ref: common.identifier}
      revision:
        closed: true
        required_fields: [exact]
        fields: {exact: {type: string, min_length: 1}}
      observability:
        closed: true
        required_fields: [observation_id]
        fields: {observation_id: {ref: common.identifier}}
    native_network_resolution: forbidden
    id_unique_scope: bundle-external-dependencies
    graph_edge: false
    contributes_to_graph_revision: exact-complete-normalized-entry
    changed_entry_initial_change: dependent-node
  authority_input:
    closed: true
    required_fields: [id, authority, subject, source_binding, expected_revision, observation_id]
    fields:
      id: {ref: common.identifier}
      authority: {type: string, min_length: 1}
      subject: {ref: common.node_reference}
      source_binding: {ref: freshness.source_binding, node_equals: subject}
      expected_revision: {type: string, min_length: 1}
      observation_id: {ref: common.identifier}
    id_unique_scope: bundle-authority-inputs
    observation_id_unique_scope: bundle-external-dependency-and-authority-input-observations
    native_network_resolution: forbidden
    contributes_to_graph_revision: exact-complete-normalized-entry
    changed_entry_initial_change: subject-node
  knowledge_graph:
    closed: true
    required_fields: [policy, baseline]
    fields:
      policy: {const: nkf.freshness-policy.0.5}
      baseline:
        const: .nourd/knowledge/freshness/baseline.yaml
  governed_artifact:
    closed: true
    required_fields: [id, kind, path, digest, record, source_section]
    fields:
      id:
        ref: common.identifier
      kind:
        enum: [executable-contract, schema, checker-source, test, fixture, build-tool, project-configuration]
      path:
        ref: paths.project_relative_file
        must_exist: true
        file_kind: regular-file
        must_be_outside_nourd: true
      digest:
        ref: common.digest
      record:
        ref: common.identifier
        resolves_to: same-bundle-realization-record
      source_section:
        ref: common.identifier
        resolves_to: governed-artifact-record-section
    unique_by: [id, lexical-path, resolved-physical-file, exact-entry]
    exact_bytes_in_validated_snapshot: true
    binding_integrity_proves_realization: false
  constraints:
    exactly_one_profile_root: true
    exactly_one_selectable_profile: true
    common_profile_selectable: false
    portable_topology_required: true
    every_markdown_exactly_one_representation: true
    non_markdown_enumeration_required: false
    non_markdown_enumeration_permitted: true
    array_order_semantic: false

paths:
  project_root:
    definition: directory-directly-containing-.nourd
    identity: false
    git_repository_required: false
  declaration_directory:
    path: .nourd/knowledge/records
    flat: true
    files:
      encoding: UTF-8
      suffix: .yaml
      regular_files_only: true
      one_record_per_file: true
      filename_convention: <record-id>.yaml
      filename_mismatch: warning
      identity_source: record.id
  knowledge_root:
    type: string
    min_length: 1
    base: project-root
    target_kind: directory
    must_be_inside_project: true
    must_be_outside_nourd: true
    forbidden:
      absolute: true
      empty_segment: true
      dot_segment: true
      parent_segment: true
      environment_expansion: true
      tilde_expansion: true
  knowledge_relative_file:
    type: string
    min_length: 1
    base: knowledge-root
    separator: /
    must_resolve_inside_knowledge_root: true
    forbidden:
      absolute: true
      leading_slash: true
      windows_drive_prefix: true
      unc_prefix: true
      backslash_separator: true
      empty_segment: true
      dot_segment: true
      parent_segment: true
      nul: true
      ascii_control: true
      environment_expansion: true
      tilde_expansion: true
    spelling: exact
    case: exact
    windows_reserved_names_rule: none
    unicode_case_folding_rule: none
  project_relative_file:
    type: string
    min_length: 1
    base: project-root
    separator: /
    must_resolve_inside_project: true
    must_be_outside_nourd: true
    forbidden:
      absolute: true
      leading_slash: true
      windows_drive_prefix: true
      unc_prefix: true
      backslash_separator: true
      empty_segment: true
      dot_segment: true
      parent_segment: true
      nul: true
      ascii_control: true
      environment_expansion: true
      tilde_expansion: true
    spelling: exact
    case: exact
  symlinks:
    policy: generally-prohibited
    broken: error
    cyclic: error
    target_outside_project: error
    target_outside_knowledge_root_for_knowledge_path: error
    contained: warning
    contained_read_permitted: true
    final_target_kind_enforced: true
    duplicate_physical_file_checks: true
  locators:
    are_paths: false
    are_identity: false
    universal_syntax: unspecified
    automatic_unsafe_dereference: forbidden

portable_topology:
  owner: nkf.common
  applies_to_profiles: [nkf.profile.product, nkf.profile.technology]
  continuing_conformance: true
  required_paths:
    - {path: README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: tasks/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: tasks/by-state/active.md, representation: non-record, kind: generated, frontmatter: forbidden}
    - {path: tasks/by-state/deferred.md, representation: non-record, kind: generated, frontmatter: forbidden}
    - {path: tasks/by-state/completed.md, representation: non-record, kind: generated, frontmatter: forbidden}
    - {path: tasks/by-state/cancelled.md, representation: non-record, kind: generated, frontmatter: forbidden}
    - {path: designs/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: designs/by-disposition/active.md, representation: non-record, kind: generated, frontmatter: forbidden}
    - {path: designs/by-disposition/adopted.md, representation: non-record, kind: generated, frontmatter: forbidden}
    - {path: designs/by-disposition/rejected.md, representation: non-record, kind: generated, frontmatter: forbidden}
    - {path: designs/by-disposition/superseded.md, representation: non-record, kind: generated, frontmatter: forbidden}
    - {path: designs/by-disposition/withdrawn.md, representation: non-record, kind: generated, frontmatter: forbidden}
    - {path: decisions/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: specifications/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: realizations/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: realizations/current-system.md, representation: record, type: realization, body_contract: nkf.realization, count: 1}
    - {path: realizations/current/README.md, representation: non-record, kind: navigation, frontmatter: required}
    - {path: evidence/README.md, representation: non-record, kind: evidence, frontmatter: evidence-exempt}
  path_safety:
    file_kind: regular-file
    symlink: forbidden
    duplicate_physical_target: forbidden
    multiple_representation: forbidden
  topology_link_resolution:
    participation: satisfies-required-managed-map-or-lifecycle-index-target
    commonmark_node: link
    images: excluded
    autolinks: excluded
    scheme: forbidden
    authority: forbidden
    query: forbidden
    fragment: forbidden
    percent_escape: forbidden
    backslash: forbidden
    nul: forbidden
    ascii_control: forbidden
    separator: /
    base: containing-markdown-directory
    lexical_parent_segments: permitted-while-normalized-target-inside-knowledge-root
    target_spelling: exact
    other_links: ignored-for-topology
  canonical_map:
    path: README.md
    single_authority_copy: true
    competing_generated_pattern: "^README-[0-9]+\\.md$"
    competing_generated_declared: forbidden
    managed_block:
      count: 1
      start_line: "<!-- nkf-navigation:start -->"
      end_line: "<!-- nkf-navigation:end -->"
      heading:
        level: 2
        text: NKF Navigation
        direct_child: true
        count: 1
        same_heading_outside_block: forbidden
      required_targets:
        - profile-root-source
        - tasks/README.md
        - designs/README.md
        - decisions/README.md
        - specifications/README.md
        - realizations/README.md
        - realizations/current-system.md
        - evidence/README.md
      target_count: exactly-once
      target_base: canonical-map-directory
      target_spelling: exact
      target_containment: knowledge-root
      target_resolution: declared-native-source
    outside_managed_block:
      ownership: project
      native_validation_rewrite: forbidden
  lifecycle_navigation:
    task:
      representation: non-record
      state_source: bundle.non_records.document.state
      source_path_role: stable-locator
      new_source_directory: tasks/items/
      legacy_source_paths: frozen-at-migration
      indexes:
        active: tasks/by-state/active.md
        deferred: tasks/by-state/deferred.md
        completed: tasks/by-state/completed.md
        cancelled: tasks/by-state/cancelled.md
      matching_items: exactly-once
      parent_index: tasks/README.md
      parent_targets: [tasks/by-state/active.md, tasks/by-state/deferred.md, tasks/by-state/completed.md, tasks/by-state/cancelled.md]
    design:
      representation: record
      disposition_source: record.design_disposition
      source_path_role: stable-locator
      new_source_directory: designs/items/
      legacy_source_paths: frozen-at-migration
      indexes:
        active: designs/by-disposition/active.md
        adopted: designs/by-disposition/adopted.md
        rejected: designs/by-disposition/rejected.md
        superseded: designs/by-disposition/superseded.md
        withdrawn: designs/by-disposition/withdrawn.md
      matching_items: exactly-once
      parent_index: designs/README.md
      parent_targets: [designs/by-disposition/active.md, designs/by-disposition/adopted.md, designs/by-disposition/rejected.md, designs/by-disposition/superseded.md, designs/by-disposition/withdrawn.md]
    decision:
      representation: record
      placement: decisions/
      index: decisions/README.md
      matching_items: exactly-once
    specification:
      representation: record
      placement: specifications/
      index: specifications/README.md
      matching_items: exactly-once
      selected_profile_permissions_apply: true
    realization:
      current_system:
        path: realizations/current-system.md
        count: 1
      supporting_current_placement: realizations/current/
      supporting_current_index: realizations/current/README.md
      matching_supporting_items: exactly-once
      parent_index: realizations/README.md
      parent_targets: [realizations/current-system.md, realizations/current/README.md]
    evidence:
      index: evidence/README.md
      exhaustive_file_links_required: false
      required_area_target: direct-child-directory-containing-represented-evidence-markdown-at-any-depth
      required_area_target_count: exactly-once
      required_area_target_resolution: safe-directory-inside-knowledge-root
    metadata_precedes_path_inference: true
    path_assigns_semantic_state: false
    state_change_moves_source: forbidden
    state_change_rewrites_inbound_links: forbidden
    generated_navigation_replacement: required
  preserved_material:
    unresolved_native_promotion: forbidden
    noncanonical_path_permitted_when_non-record: true
    deliberately_promoted_native_knowledge_requires_stable-declared-path: true
  initial_onboarding:
    supported_categories: [category-1-empty, category-2-tiny-knowledge]
    common_topology: complete
    active_task:
      placement: tasks/items/
      map_target_during_onboarding: required
    profile_scaffolds:
      nkf.profile.product:
        root: {preferred_path: product.md, governance: draft}
      nkf.profile.technology:
        root: {preferred_path: technology.md, governance: draft}
        specification: {preferred_path: specifications/initial-specification.md, governance: draft, map_target_during_onboarding: required}
    occupied_preferred_path:
      inspected_safe_selected_path_may_remain: true
      filesystem_path_defines_identity: false
    canonical_map:
      absent: generate
      existing: reconcile-same-document
      suffix_allocation: forbidden
      ambiguous: fail-before-mutation
      outside_managed_block_bytes: preserve-unless-explicit-candidate-change
    baseline:
      generated_mechanically: forbidden
      named_human_or_agent_whole-root-review: required
      exact_review_evidence: required
      confirmation_required_before_seal: true
      missing_confirmation: not-ready
  predecessor_repair:
    command: repair-topology
    eligible_predecessors: [NKF-013, NKF-015]
    trusted_receipt_required: true
    candidate_outside_project: true
    seal_required: true
    staged_full_bundle_validation: true
    rollback_required: true
    idempotent_result: no-update
    competing_map_removal:
      receipt_path_match: required
      current_byte_match: required
      drift: fail-human-resolution
      consumer_authored_content: preserve-and-fail-human-resolution
    receipt_fields: [predecessor_release, successor_release, created_paths, changed_paths, removed_paths, preserved_paths]
    missing_trustworthy_receipt: governed-migration-plan
    silent_consumer_migration: forbidden
  version_0_5_migration:
    supported_predecessors: ["0.1", "0.2", "0.3", "0.4"]
    compatibility: breaking
    repository_owner_approval: required-before-mutation
    preserve_all_canonical_markdown_bytes: true
    preserve_existing_task_and_design_paths: true
    allocate_document_ids: deterministic-and-persisted
    lifecycle_source: yaml-declaration
    predecessor_frontmatter:
      source_with_now-forbidden-mutable-state-key: legacy-locked-inert
      source-already-matching-native-envelope: no-lock
    version_canonical_specification_after_exact_acceptance: accepted-bootstrap-locked
    graph_candidate_generation: required
    whole_root_semantic_review: required-before-seal
    named_human_or_agent_reviewer: required
    baseline_confirmation: required-before-seal
    silent_semantic_confirmation: forbidden

markdown:
  grammar: CommonMark-0.31.2
  source_encoding:
    required: UTF-8
    invalid_diagnostic: markdown.utf8.invalid
    copied_invalid_bytes: forbidden
  source_envelope:
    complete_source_bytes: optional-front-matter-envelope-plus-commonmark-body
    opening_condition: first-line-exactly----
    opening_delimiter: "---"
    closing_delimiter: "---"
    closing_rule: first-later-line-exactly-closing-delimiter
    front_matter:
      grammar: YAML-1.2-Core
      document_count: 1
      root: non-empty-mapping
      unique_string_keys: required
      value_model: JSON-compatible
      anchors: forbidden
      aliases: forbidden
      merge_keys: forbidden
      custom_tags: forbidden
      arbitrary_core_key_meaning: forbidden
      profile_or_extension_keys_require_accepted_governance: true
      governed_orientation:
        applicability:
          default: required
          evidence_record:
            selector: declaration.type
            equals: evidence
            orientation_fields: exempt
          evidence_non_record:
            selector: bundle.non_records.kind
            equals: evidence
            orientation_fields: exempt
          exemption_from_path: forbidden
          safe_syntax_when_exempt_envelope_present: required
        scalar_string:
          type: string
          min_length: 1
          trim_must_equal_self: true
          line_breaks: forbidden
        created_at:
          type: string
          exact_serialization: YYYY-MM-DDTHH:mm:ssZ
          real_calendar_instant: required
          timezone: UTC
          fractional_seconds: forbidden
          generic_updated_at: undefined
        common:
          required_fields: [title, summary, created_at]
          fields:
            title:
              ref: markdown.source_envelope.front_matter.governed_orientation.scalar_string
              equals: commonmark-body-single-H1-comparison-string
            summary:
              ref: markdown.source_envelope.front_matter.governed_orientation.scalar_string
              semantic_adequacy_from_validation: false
            created_at:
              ref: markdown.source_envelope.front_matter.governed_orientation.created_at
        record:
          required_fields: [id, type]
          optional_fields: []
          fields:
            id:
              equals: declaration.id
            type:
              equals: declaration.type
            title:
              equals: declaration.title
        mutable_state_keys:
          forbidden: [record_lifecycle, record_status, decision_authority, task, design_disposition, design_decisions, superseded_by, withdrawal_source, proposal_authority_effect, proposal_evidence, implementation_evidence, confirmation_status, confirmation_decisions, unconfirmed_scope, task_id, task_status, owner, related_tasks]
          authority: yaml-declarations-only
          read_only_virtual_projection: permitted-with-source-revision
        legacy_locked:
          requires: exact-migration-receipt-predecessor-source-digest-predecessor-state-and-initial-declaration-state
          mutable_keys: inert-historical-bytes
          current_state_authority: false
          source_change_removes_exemption: true
        accepted_bootstrap_locked:
          only_for: version-canonical-nkf-0.5-specification
          requires: exact-accepted-bootstrap-lock-and-accepting-decision
          exact_predecessor_state: {record_lifecycle: living, record_status: draft, task: NKF-026, decision_authority: exact-source-frontmatter-value}
          exact_current_declaration_state: {lifecycle: immutable, status: accepted}
          mutable_keys: inert-historical-bytes
          current_state_authority: false
          source_change_forbidden: true
        allowed_keys:
          closed_by_applicable_document_class: true
          common: [title, summary, created_at]
          record: [id, type]
        reference_resolution:
          record_ids: exact-and-unique
          display-identifiers: forbidden
          unresolved_or_ambiguous: error
    commonmark_body:
      begins: immediately-after-closing-delimiter-line-ending
      envelope_participation: none
      owns_canonical_human_meaning: true
    complete_bytes_participate_in:
      - record-source-digest
      - validated-snapshot
      - applicable-security-scan
    invalid_diagnostic: markdown.frontmatter.invalid
  task_body:
    applies_to: bundle.non_records-kind-task
    identity_source: bundle.non_records.document.id
    state_source: bundle.non_records.document.state
    directory_state_inference: forbidden
    operational_authority: external-to-nkf
    applicability_gate:
      section_heading: Decision Applicability
      subsection_order: [applicable_decisions, mandatory_capabilities]
      applicable_decisions:
        heading: Applicable Decisions
        none_sentence: No accepted decision applies to this Task.
        table_header: [Reference, Kind, Carried Constraint]
        kind_enum: [record, external]
        record_reference:
          record_type: decision
          governance_status: accepted
          same_bundle: true
      mandatory_capabilities:
        heading: Mandatory Capabilities
        none_sentence: No mandatory capability is implicated by this Task.
        table_header: [Capability, Finding, Verification, Exception]
        finding_vocabulary: capability_findings
        verification_vocabulary: verification_levels
        verification_none_literal: none
        exception_none_literal: none
        exception_record_reference:
          record_type: decision
          governance_status: accepted
          same_bundle: true
      presence:
        active: required
        deferred: required
        completed: required
        cancelled: required
      completion_rule:
        applies_to_status: completed
        blocked_findings: [unsupported, unknown]
        blocked_when_exception_is: none
      confers_authority: none
      retrospective_gate_disclosure: required
  participating_headings:
    container: direct-child-of-document-root
    levels: [1, 2, 3]
    syntaxes: [atx, setext]
    nested_container_headings: content-only
    fenced_code_heading_like_text: content-only
  comparison_string:
    retain:
      - visible-text
      - image-alternative-text
      - code-span-text
    omit:
      - link-destinations
      - raw-html-tags
    escapes_and_entities: parsed-characters
    whitespace_runs: one-U+0020
    trim: true
    additional_unicode_normalization: none
    case_preservation: exact
  coverage:
    h1_count: 1
    h1_is_title_not_section: true
    every_h2_h3_exactly_one_section: true
    every_section_exactly_one_h2_h3: true
    duplicate_mapping: forbidden
    h3_requires_preceding_h2: true
    h2_heading_path: [self]
    h3_heading_path: [nearest-preceding-h2, self]
    occurrence: one-based-source-order-within-identical-complete-path
    h4_h5_h6: subordinate-content
    h4_h5_h6_before_mapped_h2_h3: invalid
    pre-first-h2_content:
      belongs_to_record: true
      satisfies_section_responsibility: false
  title_case:
    applies_to: [top-level-h1, top-level-h2, top-level-h3]
    unicode_version: 17.0.0
    operation: Default-Case-Conversion-toTitlecase
    word_boundaries: unicode-default
    locale_tailoring: none
    protected_ranges:
      - inline-code
      - nkf-owned-canonical-terms
      - bundle-canonical-terms
    all_words_converted: true
    hyphen_components_converted: true
    uncased_text_unchanged: true
    nkf_owned_canonical_terms: [NKF]
    canonical_match:
      code_points_and_case: exact
      boundary: unicode-word
      overlap: longest-first-then-left-to-right
  mermaid:
    fenced_info_string: mermaid
    content_kind: literal-markdown
    exact_bytes_in_source_digest: true
    belongs_to_containing_section: true
    heading_or_title_case_participation: false
    native_execution: forbidden
    native_rendering: not-required
    native_semantic_validation: none
    essential_meaning_available_without_rendering: required-human-review
    generated_diagram: provenance-bearing-projection

record:
  identity: nkf.record
  closed: true
  required_fields:
    - contract
    - id
    - type
    - body_contract
    - title
    - source
    - governance
    - scope
    - sections
    - relationships
  optional_fields:
    - provenance
    - external_authorities
    - entities
    - entity_relationships
    - bindings
    - task
    - design_disposition
    - design_decisions
    - superseded_by
    - withdrawal_source
    - proposal_authority_effect
    - proposal_evidence
    - implementation_evidence
    - confirmation_status
    - confirmation_decisions
    - unconfirmed_scope
    - freshness
    - legacy_lock
    - accepted_bootstrap_lock
    - extensions
  fields:
    contract:
      const: nkf.record
    id:
      ref: common.identifier
      unique_scope: bundle
    type:
      enum: [product, principle, concept, journey, domain, capability, technology, specification, design, decision, realization, evidence]
      extension_defined_namespaced_values: permitted-through-required-extension
    body_contract:
      enum: [nkf.product, nkf.principle, nkf.concept, nkf.journey, nkf.domain, nkf.capability, nkf.technology, nkf.specification, nkf.design, nkf.decision, nkf.realization, nkf.evidence]
      extension_defined_namespaced_values: permitted-through-required-extension
    title:
      type: string
      min_length: 1
      equals: markdown-h1
    source:
      ref: record.source
    governance:
      ref: record.governance
    scope:
      ref: record.scope
    sections:
      type: array
      min_items: 1
      items:
        ref: record.section
    relationships:
      type: array
      required: true
      may_be_empty: true
      items:
        ref: record.relationship
    provenance:
      ref: record.provenance
      omit_when_empty: true
    external_authorities:
      type: array
      items:
        ref: record.external_authority
      unique_by: id
      omit_when_empty: true
    entities:
      type: array
      items:
        ref: record.entity
      unique_by: id
      omit_when_empty: true
    entity_relationships:
      type: array
      items:
        ref: record.entity_relationship
      exact_duplicates: forbidden
      omit_when_empty: true
    bindings:
      type: array
      items:
        ref: record.binding
      exact_duplicates: forbidden
      omit_when_empty: true
    task:
      ref: common.identifier
      resolves_to: same-bundle-task-document-node
    design_disposition:
      enum: [active, adopted, rejected, superseded, withdrawn]
    design_decisions:
      type: array
      min_items: 1
      unique_items: true
      order_semantic: false
      items: {ref: common.identifier, resolves_to: same-bundle-accepted-decision-record}
    superseded_by:
      type: array
      min_items: 1
      unique_items: true
      order_semantic: false
      items: {ref: common.identifier, resolves_to: same-bundle-record}
    withdrawal_source:
      closed: true
      required_fields: [kind, id]
      fields:
        kind: {enum: [task, record]}
        id: {ref: common.identifier, resolves_by_kind: true}
    proposal_authority_effect: {type: string, min_length: 1}
    proposal_evidence: {type: string, min_length: 1}
    implementation_evidence: {type: string, min_length: 1}
    confirmation_status:
      enum: [unconfirmed, partially-confirmed, confirmed]
    confirmation_decisions:
      type: array
      min_items: 1
      unique_items: true
      order_semantic: false
      items: {ref: common.identifier, resolves_to: same-bundle-accepted-decision-record}
    unconfirmed_scope: {type: string, min_length: 1}
    freshness: {ref: freshness.declaration}
    legacy_lock: {ref: bundle.legacy_lock}
    accepted_bootstrap_lock: {ref: bundle.accepted_bootstrap_lock}
    extensions:
      type: array
      unique_by: contract
      items:
        ref: common.extension_use
      omit_when_empty: true
  conditional_constraints:
    accepted_bootstrap_lock:
      permitted_only_when: {type: specification, id: nkf-0.5-specification}
      mutually_exclusive_with: legacy_lock
  type_body_contract:
    product: nkf.product
    principle: nkf.principle
    concept: nkf.concept
    journey: nkf.journey
    domain: nkf.domain
    capability: nkf.capability
    technology: nkf.technology
    specification: nkf.specification
    design: nkf.design
    decision: nkf.decision
    realization: nkf.realization
    evidence: nkf.evidence
  type_state_contract:
    design:
      required_fields: [task, design_disposition]
      required_source_fields: [stable_path]
      disposition_conditions:
        active: {forbidden: [design_decisions, superseded_by, withdrawal_source]}
        adopted: {required: [design_decisions], forbidden: [superseded_by, withdrawal_source]}
        rejected: {required: [design_decisions], forbidden: [superseded_by, withdrawal_source]}
        superseded: {required: [superseded_by], optional: [design_decisions], forbidden: [withdrawal_source]}
        withdrawn: {required: [withdrawal_source], forbidden: [design_decisions, superseded_by]}
    decision: {required_fields: [task]}
    specification:
      required_fields: [task]
      accepted_version_canonical_nkf_0_5:
        required_fields: [accepted_bootstrap_lock]
        exact_governance: {lifecycle: immutable, status: accepted}
      all_other_specifications:
        accepted_bootstrap_lock: forbidden
    realization:
      required_fields: [task, confirmation_status]
      confirmation_conditions:
        unconfirmed: {forbidden: [confirmation_decisions, unconfirmed_scope]}
        partially-confirmed: {required: [confirmation_decisions, unconfirmed_scope]}
        confirmed: {required: [confirmation_decisions], forbidden: [unconfirmed_scope]}
  source:
    closed: true
    required_fields: [path, stable_path, digest]
    optional_fields: []
    fields:
      path:
        ref: paths.knowledge_relative_file
        suffix: .md
        must_exist: true
        file_kind: regular-file
      stable_path:
        ref: paths.knowledge_relative_file
        equals: path
        canonical_path_change_after-onboarding-or-migration: forbidden
      digest:
        ref: common.digest
  governance:
    closed: true
    required_fields: [lifecycle, status, authority]
    optional_fields: [accepted_at]
    fields:
      lifecycle:
        enum: [living, immutable]
      status:
        enum: [draft, accepted, superseded, retired]
      authority:
        type: array
        min_items: 1
        unique_items: true
        items:
          ref: common.identifier
      accepted_at:
        type: string
        format: iso-8601-date
    declared_status_proves_acceptance: false
    accepted_at_proves_acceptance: false
  scope:
    closed: true
    required_fields: [root]
    optional_fields: [subjects]
    fields:
      root:
        ref: common.identifier
        equals: bundle.root.record
      subjects:
        type: array
        items:
          ref: common.identifier
        omit_when_empty: true
  section:
    closed: true
    required_fields: [id, heading_path, occurrence, authority, role]
    optional_fields: [responsibilities]
    fields:
      id:
        ref: common.identifier
        unique_scope: record
      heading_path:
        type: array
        min_items: 1
        items:
          type: string
          min_length: 1
        order_semantic: true
      occurrence:
        type: integer
        minimum: 1
      authority:
        enum: [accepted-meaning, proposal, unresolved, evidence]
      role:
        ref: vocabularies.section_roles
        allowed_by: record.body_contract
      responsibilities:
        type: array
        min_items: 1
        unique_items: true
        items:
          ref: common.identifier
        allowed_by: record.body_contract
        omit_when_empty: true
    semantic_h2_h3_mapping_complete: true
    one_mapping_per_semantic_heading: true
  relationship:
    closed: true
    required_fields: [type, target, source_section]
    fields:
      type:
        ref: vocabularies.record_relationship_types
      target:
        ref: common.identifier
        resolves_to: same-bundle-record
      source_section:
        ref: common.identifier
        resolves_to: declaring-record-section
    exact_duplicates: forbidden
  provenance:
    closed: true
    optional_fields: [producers, verifiers, sources, primary_observation]
    fields:
      producers:
        type: array
        items:
          ref: record.actor_event
      verifiers:
        type: array
        items:
          ref: record.actor_event
      sources:
        type: array
        items:
          ref: record.provenance_source
        unique_non_null_by: id
      primary_observation:
        ref: record.primary_observation
    omit_when_empty: true
  actor_event:
    closed: true
    required_fields: [actor]
    optional_fields: [at, method]
    fields:
      actor:
        ref: common.identifier
      at:
        type: string
        min_length: 1
        lexical_format: not-specified-by-nkf-0.1
      method:
        type: string
        min_length: 1
  provenance_source:
    closed: true
    required_fields: [locator]
    optional_fields: [id, title, author, observed_at, revision, last_modified_at, digest]
    fields:
      locator:
        type: string
        min_length: 1
      id:
        ref: common.identifier
      title:
        type: string
        min_length: 1
      author:
        type: string
        min_length: 1
      observed_at:
        type: string
        min_length: 1
        lexical_format: not-specified-by-nkf-0.1
      revision:
        type: string
        min_length: 1
      last_modified_at:
        type: string
        min_length: 1
        lexical_format: not-specified-by-nkf-0.1
      digest:
        ref: common.digest
  primary_observation:
    closed: true
    required_fields: [method, source_section]
    optional_fields: [observed_at]
    fields:
      method:
        type: string
        min_length: 1
      source_section:
        ref: common.identifier
        resolves_to: declaring-record-section
      observed_at:
        type: string
        min_length: 1
        lexical_format: not-specified-by-nkf-0.1
  external_authority:
    closed: true
    required_fields: [id, authority, relationship, source_section]
    optional_fields: [locator, resolution_rule]
    at_least_one: [locator, resolution_rule]
    fields:
      id:
        ref: common.identifier
      authority:
        type: string
        min_length: 1
      relationship:
        type: string
        min_length: 1
      source_section:
        ref: common.identifier
        resolves_to: declaring-record-section
      locator:
        type: string
        min_length: 1
      resolution_rule:
        type: string
        min_length: 1
  entity:
    closed: true
    required_fields: [id, kind, defining_section]
    optional_fields: [address]
    fields:
      id:
        ref: common.identifier
        unique_scope: record
      kind:
        ref: vocabularies.entity_kinds
        allowed_by: record.body_contract
      defining_section:
        ref: common.identifier
        resolves_to: declaring-record-section
      address:
        type: string
        min_length: 1
        identity: false
  entity_relationship:
    closed: true
    required_fields: [type, source, target, source_section]
    fields:
      type:
        ref: vocabularies.entity_relationship_types
      source:
        ref: common.entity_reference
        owner: declaring-record
      target:
        ref: common.entity_reference
      source_section:
        ref: common.identifier
        resolves_to: declaring-record-section
    self_relationship: forbidden
    exact_duplicates: forbidden
  binding:
    closed: true
    required_fields: [entity, realization, kind, source_section]
    optional_fields: [locator, resolution_rule, external_authority]
    at_least_one: [locator, resolution_rule]
    fields:
      entity:
        ref: common.entity_reference
      realization:
        ref: common.identifier
        equals: declaring-record-id
      kind:
        ref: vocabularies.binding_kinds
      source_section:
        ref: common.identifier
        resolves_to: declaring-record-section
      locator:
        type: string
        min_length: 1
      resolution_rule:
        type: string
        min_length: 1
      external_authority:
        ref: common.identifier
        resolves_to: declaring-record-external-authority
    declaring_body_contract: nkf.realization
  constraints:
    one_markdown_source: true
    source_digest_exact: true
    markdown_h1_count: 1
    title_matches_h1: true
    required_responsibility_coverage: true
    relationship_source_bound: true
    array_order_semantic:
      only: [section.heading_path]
    responsibility_emit_order: body-contract-order
    optional_empty_structures: omit
    presentation_field: forbidden

root_profiles:
  common:
    identity: nkf.common
    applies_automatically: true
    selectable: false
    allowed_body_contracts: [nkf.design, nkf.decision, nkf.realization, nkf.evidence]
    binding_kinds: [source, system, process, asset, implementation, provider, namespace, data, interface]
  selectable:
    nkf.profile.product:
      root:
        type: product
        body_contract: nkf.product
        lifecycle: living
      allowed_body_contracts: [nkf.product, nkf.principle, nkf.concept, nkf.journey, nkf.domain, nkf.capability, nkf.design, nkf.decision, nkf.realization, nkf.evidence]
      required_body_contracts: []
      record_part_of: product-domain-capability
      governed_artifacts: forbidden
      binding_kinds: [source, system, process, asset, implementation, provider, namespace, data, interface, agreement, deployment]
    nkf.profile.technology:
      root:
        type: technology
        body_contract: nkf.technology
        lifecycle: living
      allowed_body_contracts: [nkf.technology, nkf.specification, nkf.design, nkf.decision, nkf.realization, nkf.evidence]
      required_body_contracts: [nkf.specification]
      record_part_of: forbidden
      governed_artifacts: permitted
      binding_kinds: [source, system, process, asset, implementation, provider, namespace, data, interface]
  selection:
    count: 1
    fallback: forbidden
    implicit_default: forbidden
    general_or_generic_root: forbidden
    unsupported: fail-closed

vocabularies:
  section_authority:
    accepted-meaning: governs-only-when-exact-record-revision-accepted
    proposal: candidate-non-governing-meaning
    unresolved: explicit-open-or-undecided-meaning
    evidence: source-grounded-support-not-product-intent
  verification_levels:
    order: [data-validity, adapter-compatibility, runtime-behaviour, human-experience, production-suitability]
    meanings:
      data-validity: governed-inputs-well-formed-and-integrity-bound
      adapter-compatibility: consumer-loads-data-through-declared-contract
      runtime-behaviour: required-runtime-outcome-directly-observed
      human-experience: human-authority-directly-reviewed-experienced-result
      production-suitability: production-commercial-and-legal-suitability-established
    lower-level-claim-never-higher-level-success: true
  capability_findings:
    proven: capability-directly-verified-at-named-level
    unsupported: capability-established-as-not-supported
    unknown: capability-support-not-established
  record_relationship_types:
    part-of: source-is-governed-part-of-target
    defines: source-canonically-defines-meaning-used-by-target
    governs: source-constrains-target
    applies-to: source-is-applicable-to-target
    depends-on: source-requires-target-meaning
    extends: source-adds-compatible-meaning-to-target
    supersedes: source-replaces-target-for-declared-scope
    rationale-for: source-explains-target
    realizes: source-maps-target-to-durable-realization
    evidences: source-supplies-evidence-relevant-to-target
    references: source-points-without-stronger-relation
  graph_relationship_types:
    part-of:
      meaning: source-is-governed-part-of-target
      source_kinds: [record, entity]
      target_kinds: [record, entity]
      same_kind_required: true
      source_authorities: [accepted-meaning, proposal]
      self_edge: forbidden
      cycles: forbidden
    defines:
      meaning: source-canonically-defines-meaning-used-by-target
      source_kinds: [record, document, entity]
      target_kinds: [record, document, entity]
      source_authorities: [accepted-meaning, proposal, document-meaning]
      self_edge: forbidden
      cycles: forbidden
    governs:
      meaning: source-constrains-target
      source_kinds: [record]
      target_kinds: [record, document, entity]
      source_governance_status: accepted
      source_authorities: [accepted-meaning]
      self_edge: forbidden
      cycles: forbidden
    applies-to:
      meaning: source-is-applicable-to-target
      source_kinds: [record, document, entity]
      target_kinds: [record, document, entity]
      source_authorities: [accepted-meaning, proposal, evidence, document-meaning]
      self_edge: forbidden
      cycles: permitted
    depends-on:
      meaning: source-requires-target-meaning
      source_kinds: [record, document, entity]
      target_kinds: [record, document, entity]
      source_authorities: [accepted-meaning, proposal, evidence, document-meaning]
      self_edge: forbidden
      cycles: permitted
    extends:
      meaning: source-adds-compatible-meaning-to-target
      source_kinds: [record, document, entity]
      target_kinds: [record, document, entity]
      same_kind_required: true
      source_authorities: [accepted-meaning, proposal, document-meaning]
      self_edge: forbidden
      cycles: forbidden
    supersedes:
      meaning: source-replaces-target-for-declared-scope
      source_kinds: [record, document, entity]
      target_kinds: [record, document, entity]
      same_kind_required: true
      source_authorities: [accepted-meaning, document-meaning]
      self_edge: forbidden
      cycles: forbidden
    rationale-for:
      meaning: source-explains-target
      source_kinds: [record, document, entity]
      target_kinds: [record, document, entity]
      source_authorities: [accepted-meaning, proposal, evidence, document-meaning]
      self_edge: forbidden
      cycles: forbidden
    realizes:
      meaning: source-maps-target-to-durable-realization
      source_kinds: [record, entity]
      target_kinds: [record, document, entity]
      source_record_body: nkf.realization
      source_authorities: [accepted-meaning, proposal]
      self_edge: forbidden
      cycles: forbidden
    evidences:
