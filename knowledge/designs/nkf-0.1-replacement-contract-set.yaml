validation_result:
  identity: nkf.validation-result
  nkf_version: "0.1"
  governed_knowledge: false
  required_content:
    - execution-id
    - runner-identity
    - started-at
    - completed-at
    - checker-identity-and-digest
    - markdown-digest
    - executable-yaml-digest
    - schema-digests
    - requested-conformance-level
    - every-phase-state
    - overall-conformance
    - declared-governance
    - acceptance-binding-verification
    - governing-use-readiness
    - ordered-diagnostics
  conformance_values: [passed, failed]
  governing_use_values: [ready, not-ready, not-evaluated]
  excludes:
    - absolute-project-paths
    - credentials
    - secrets
    - copied-operational-payloads

security:
  prohibited:
    - live-credentials
    - access-tokens
    - private-keys
    - secrets
  high_confidence_finding_fails_conformance: true
  passing_scan_proves_absence: false
  sensitive_bundle_access_policy: out-of-scope

human_review:
  deterministic_validation_cannot_establish:
    - semantic-role-accuracy
    - responsibility-binding-accuracy
    - markdown-truth
    - markdown-adequacy
    - markdown-safety
    - product-completeness
    - evidence-support
    - deserved-acceptance
    - external-authority-currency
    - locator-currency
    - design-quality
    - realization-existence
    - realization-behavior
