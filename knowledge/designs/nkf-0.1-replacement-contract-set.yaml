    entity-relationship.part-of.cycle: {severity: error, blocking: conformance, phase: record-contract}
    entity-relationship.type-constraint: {severity: error, blocking: conformance, phase: record-contract}
    binding.kind.unsupported: {severity: error, blocking: conformance, phase: record-contract}
    binding.entity.unresolved: {severity: error, blocking: conformance, phase: record-contract}
